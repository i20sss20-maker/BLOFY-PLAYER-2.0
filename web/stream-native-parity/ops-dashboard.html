<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOFY | لوحة مراقبة خاصة</title>
<style>body{background:#10151d;color:#e9eef5;font:16px system-ui,sans-serif;margin:0}main{max-width:1100px;margin:auto;padding:28px}header{border-bottom:1px solid #334155;padding-bottom:20px}h1{font-size:26px;margin:8px 0}.sub{color:#b9c5d4}form{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #475569}input{background:#1e293b;color:white;flex:1;min-width:180px}button{background:#c1e7df;color:#102d29;cursor:pointer}button:disabled{opacity:.5}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}article{background:#1b2431;border:1px solid #334155;border-radius:12px;padding:16px}article strong{display:block;font-size:26px;margin-top:8px}#status{min-height:26px;color:#e4be85}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:12px;border-bottom:1px solid #334155;text-align:right}section{overflow:auto;margin-top:24px}small{color:#b9c5d4}button:focus,input:focus{outline:2px solid #c1e7df}</style></head>
<body><main><header><small>BLOFY STREAM / PRIVATE OPERATIONS</small><h1>مراقبة جودة التشغيل والموارد</h1><div class="sub">بيانات مجمعة فقط • لا تعرض معلومات المشتركين</div></header>
