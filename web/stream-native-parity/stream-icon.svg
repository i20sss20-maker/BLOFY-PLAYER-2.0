<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="blofy-title blofy-desc">
  <title id="blofy-title">BLOFY STREAM</title>
  <desc id="blofy-desc">علامة بلوفي ستريم البحرية: حلقتا بث باللون الفيروزي والأزرق وزر تشغيل ذهبي.</desc>
  <defs>
    <linearGradient id="blofy-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#174b56"/>
      <stop offset=".56" stop-color="#103844"/>
      <stop offset="1" stop-color="#071d29"/>
    </linearGradient>
    <linearGradient id="blofy-teal" x1=".15" y1="0" x2="1" y2="1">
