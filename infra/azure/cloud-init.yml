#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - ca-certificates
  - curl
  - openssl

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker __ADMIN_USERNAME__
  - mkdir -p /swap
  - fallocate -l 2G /swap/blofy.swap || dd if=/dev/zero of=/swap/blofy.swap bs=1M count=2048
  - chmod 600 /swap/blofy.swap
  - mkswap /swap/blofy.swap
  - swapon /swap/blofy.swap
  - "grep -q '/swap/blofy.swap' /etc/fstab || echo '/swap/blofy.swap none swap sw 0 0' >> /etc/fstab"
  - mkdir -p /opt/blofy
  - git clone --depth 1 --branch infra/azure-staging https://github.com/i20sss20-maker/BLOFY-PLAYER-2.0.git /opt/blofy/app
  - chown -R __ADMIN_USERNAME__:__ADMIN_USERNAME__ /opt/blofy
  - echo 'Azure host prepared. Copy infra/azure/.env.example to infra/azure/.env, set secrets, then run ./deploy.sh' > /etc/motd
