<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08070e">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="/blofy-logo.png">
  <link rel="stylesheet" href="/site-polish.css">
  <title>BLOFY PLAYER | الصفحة غير موجودة</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08070e;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
    .not-found{width:min(560px,calc(100% - 32px));padding:38px;border:1px solid rgba(185,145,255,.18);border-radius:26px;background:linear-gradient(145deg,rgba(27,21,40,.92),rgba(11,9,16,.96));text-align:center;box-shadow:0 28px 90px rgba(0,0,0,.35)}
    .not-found img{width:64px;height:64px;object-fit:contain;border-radius:18px}
    .code{margin:18px 0 4px;color:#b58cff;font-weight:900;letter-spacing:.14em}
    h1{margin:8px 0 10px}
    .muted{color:#aaa1b6;line-height:1.8}
    .actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:24px}
    .actions a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 15px;border-radius:13px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);font-weight:800}
    .actions a.primary{background:linear-gradient(115deg,#9a5cff,#7440e8);border-color:transparent}
  </style>
</head>
<body>
  <main class="not-found">
    <img src="/blofy-logo.png" alt="BLOFY PLAYER">
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p class="muted">الرابط غير صحيح أو تم نقله. تقدر ترجع للبوابة أو تفتح مركز التحميل الرسمي.</p>
    <div class="actions">
      <a class="primary" href="/">الرئيسية</a>
      <a href="/connect">ربط الجهاز</a>
      <a href="/downloads">التحميل</a>
    </div>
  </main>
</body>
</html>
