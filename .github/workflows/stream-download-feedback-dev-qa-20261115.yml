name: BLOFY STREAM Download Feedback Dev QA

on:
  push:
    branches:
      - feat/stream-download-preflight-feedback-20261115
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blofy-stream-download-feedback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-stream-dev-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Test download policy and stream build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeDemoUnitTest \
            --tests tv.blofy.player.ui.library.DownloadTransferPolicyTest \
            --tests tv.blofy.player.ui.library.OfflineDownloadPolicyTest \
            --tests tv.blofy.player.ui.player.PlayerNetworkPolicyTest \
            --tests tv.blofy.player.core.diagnostics.StreamAudioHealthTest
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            assembleStreamCodeDemo
      - name: Save test reports only (no signed release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blofy-stream-download-feedback-dev-qa-${{ github.sha }}
          path: |
            app/build/test-results/testStreamCodeDemoUnitTest/
            app/build/reports/tests/testStreamCodeDemoUnitTest/
          if-no-files-found: ignore
          retention-days: 7
