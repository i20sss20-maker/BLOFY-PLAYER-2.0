name: BLOFY Android 9 TV stability regressions
on:
  push:
    branches: [fix/tv-easy-qr-activation-20261108]
    paths:
      - 'app/**'
      - '.github/workflows/blofy-tv-stability-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blofy-tv-stability-regression
  cancel-in-progress: true
jobs:
  android9-robolectric:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Install Android 36 tooling
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test Android 9 TV login and activation identity
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testDebugUnitTest \
            --tests '*LoginLocalEntryRegressionTest' \
            --tests '*DeviceIdentityTest' \
            --tests '*VerifiedActivationLeaseTest' \
            --tests '*ActivationConnectionDiagnosticsTest' \
            --tests '*BlofyActivationDnsTest' \
            --tests '*BlofyActivationOriginFallbackTest' \
            --tests '*UpdateDownloadTest' \
            --tests '*UpdateSafetyTest'
      - name: Publish JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-TV-Android9-stability-tests
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
