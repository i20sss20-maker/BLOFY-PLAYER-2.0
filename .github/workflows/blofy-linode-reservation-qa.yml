name: BLOFY Linode reservation PostgreSQL QA
on:
  pull_request:
    paths:
      - 'services/activation/src/linode-reservation-ledger.mjs'
      - 'services/activation/test/linode-reservation-ledger.test.mjs'
      - '.github/workflows/blofy-linode-reservation-qa.yml'
permissions:
  contents: read
jobs:
  reservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: services/activation
    env:
      BLOFY_RESERVATION_TEST_DATABASE_URL: postgresql://qa:isolated_test_only@localhost:5432/qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test test/linode-reservation-ledger.test.mjs
