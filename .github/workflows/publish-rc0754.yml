name: Publish BLOFY rc07.54

on:
  push:
    branches: [release/rc0754-signed-test]
    paths:
      - .github/workflows/publish-rc0754.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: blofy-publish-rc0754
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download verified production-signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          gh run download 35346365349 \
            --repo "$GITHUB_REPOSITORY" \
            --name "BLOFY-PLAYER-2.0-rc07.54-PRODUCTION-SIGNED-efdd6ee7311cf3c9e7cb18f16150fc722a5794cb" \
            --dir publish
          apk="$(find publish -type f -name 'BLOFY-PLAYER-2.0-rc07.54-PRODUCTION-SIGNED.apk' -print -quit)"
          test -s "$apk"
          sha256sum "$apk" | tee publish/RC0754-APK-SHA256.txt

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.0.0-rc07.54"
          APK="$(find publish -type f -name 'BLOFY-PLAYER-2.0-rc07.54-PRODUCTION-SIGNED.apk' -print -quit)"
          NOTES="BLOFY PLAYER RC07.54 — تحسين تحديث المحتوى للباقات الكبيرة: تسريع مرحلة الحفظ بعد 30٪، الحفاظ على المفضلة/القفل بطريقة أخف، ومنع شاشة استراحة الرسيفر أثناء التحديث. لا تغييرات على Media3 أو FFmpeg أو fallback أو محركات التشغيل."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" publish/RC0754-APK-SHA256.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" publish/RC0754-APK-SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "BLOFY PLAYER 2.0.0-rc07.54" \
              --notes "$NOTES"
          fi
