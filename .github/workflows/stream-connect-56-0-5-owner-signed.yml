name: BLOFY STREAM 56.0.5 CONNECT owner-signed candidate
on:
  push:
    branches:
      - release/stream-connect-56-0-5-owner-candidate-20261124
    paths:
      - '.github/workflows/stream-connect-56-0-5-owner-signed.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stream-connect-owner-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-stream-owner-qa:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    env:
      EXPECTED_CERT: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
      ANDROID_NDK_VERSION: '28.0.13004108'
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd5f81cd44a72fd99c3f208b5b8668fd458a53ad
      - name: Require independently compared full-suite evidence and successful Android 9 QA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARISON_RUN: '45381210516'
          QA_RUN: '45379098506'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cd5f81cd44a72fd99c3f208b5b8668fd458a53ad
          # No customer release: this is a private candidate only. Existing
          # regression debt is documented, not suppressed or marked resolved.
          for attempt in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPARISON_RUN" > comparison-run.json
            jq -e '.head_sha=="2eb25d5ef9058e696e9e989e5ca80ac5e27447da"' comparison-run.json
            if jq -e '.status=="completed"' comparison-run.json >/dev/null; then break; fi
            sleep 15
          done
          jq -e '.status=="completed" and .conclusion=="success"' comparison-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN" | jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="cb3294a2d68e10c168e0b3be8cc6a7ad473c82fd"'
          gh run download "$COMPARISON_RUN" --repo "$GITHUB_REPOSITORY" --name stream-regression-comparison --dir comparison-evidence
          jq -e '.baseline_tests>=952 and .candidate_tests>=958 and (.new_failures|length)==0 and (.missing|length)==0 and (.newly_skipped|length)==0 and (.baseline_failures|length)>=39 and (.candidate_failures|length)==39 and (.shared_failures|length)==39 and (.connect_tests|length)==6 and ([.connect_tests[]]|all(.=="passed"))' comparison-evidence/comparison-report.json
          echo 'Private testing gate: candidate has 39 failures also observed in baseline; baseline run has additional failures and is not a clean comparator. No customer publication permitted.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android native FFmpeg build tools
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000120' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.56.0.5"' app/build.gradle.kts
          grep -Fq 'ExternalStreamConnectActivity' app/src/main/AndroidManifest.xml
          grep -Fq 'BLOFY CONNECT' app/src/main/java/tv/blofy/player/ui/settings/SettingsActivity.kt
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION" 'cmake;3.22.1'
          if ! command -v ninja >/dev/null; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Cache pinned Robolectric Android runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-central-i7-api28-api35-v1-${{ runner.os }}
      - name: Fetch and verify Android runtimes from canonical Maven Central before tests
        shell: bash
        run: |
          set -euo pipefail
          repo=https://repo.maven.apache.org/maven2
          group=org/robolectric/android-all-instrumented
          for version in 9-robolectric-4913185-2-i7 15-robolectric-12650502-i7; do
            dir="$HOME/.m2/repository/$group/$version"
            mkdir -p "$dir"
            name="android-all-instrumented-$version"
            for ext in jar pom; do
              file="$name.$ext"
              url="$repo/$group/$version/$file"
              curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-max-time 180 --connect-timeout 15 --max-time 120 "$url.sha1" -o "$dir/$file.sha1.tmp"
              expected="$(awk '{print tolower($1)}' "$dir/$file.sha1.tmp")"
              [[ "$expected" =~ ^[a-f0-9]{40}$ ]]
              if ! printf '%s  %s\n' "$expected" "$dir/$file" | sha1sum -c --status; then
                curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-max-time 240 --connect-timeout 15 --max-time 180 "$url" -o "$dir/$file.tmp"
                printf '%s  %s\n' "$expected" "$dir/$file.tmp" | sha1sum -c
                mv "$dir/$file.tmp" "$dir/$file"
              fi
              mv "$dir/$file.sha1.tmp" "$dir/$file.sha1"
            done
            unzip -tq "$dir/$name.jar" >/dev/null
          done
          cat > "$RUNNER_TEMP/robolectric-central.init.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                  systemProperty 'maven.repo.local', new File(System.getProperty('user.home'), '.m2/repository').absolutePath
              }
          }
          GRADLE
      - name: Build licensed Media3 FFmpeg decoder for ARM and x86
        shell: bash
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          test -s build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar
          grep -Fxq 'config_gpl=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'config_nonfree=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'config_version3=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'page_size_compatible=16384' build/ffmpeg-native/build-info.txt
      - name: Run STREAM and CONNECT regression before signing
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/robolectric-central.init.gradle" -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 testDebugUnitTest
          gradle --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/robolectric-central.init.gradle" -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 testStreamCodeDemoUnitTest --tests 'tv.blofy.player.core.identity.ExternalStreamConnect*Test'
      - name: Sign owner-only full STREAM 56.0.5 with CONNECT
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!required:-}" || { echo "::error::Signing credential unavailable: $required"; exit 1; }
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > "$RUNNER_TEMP/blofy-production.b64"
          base64 -d "$RUNNER_TEMP/blofy-production.b64" > "$BLOFY_RELEASE_KEYSTORE_PATH"
          test -s "$BLOFY_RELEASE_KEYSTORE_PATH"
          cert="$(keytool -exportcert -keystore "$BLOFY_RELEASE_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$cert" = "$EXPECTED_CERT" || { echo "::error::Original STREAM owner certificate mismatch"; exit 1; }
          gradle --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar" \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            validateReleaseConfiguration assembleStreamCodeOnly
      - name: Verify full Android identity, real signing certificate and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/streamCodeOnly/app-streamCodeOnly.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/stream-badging.txt"
          grep -Fq "name='tv.blofy.player.v2.stream' versionCode='2000120' versionName='2.0.0-rc07.56.0.5-STREAM'" "$RUNNER_TEMP/stream-badging.txt"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/stream-badging.txt"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-cert.txt" | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$cert" = "$EXPECTED_CERT"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/entries.txt"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libffmpegJNI.so" "$RUNNER_TEMP/entries.txt"
          done
          mkdir -p build/owner-qa
          name="BLOFY-STREAM-56.0.5-CONNECT-OWNER-SIGNED.apk"
          cp "$apk" "build/owner-qa/$name"
          (cd build/owner-qa && sha256sum "$name" > SHA256SUMS && sha256sum -c SHA256SUMS)
          printf 'app_id=tv.blofy.player.v2.stream\nversion_code=2000120\nversion_name=2.0.0-rc07.56.0.5-STREAM\nsource_commit=%s\nchannel=private-owner-qa\n' "$(git rev-parse HEAD)" > build/owner-qa/BUILD-IDENTITY.txt
          cp comparison-evidence/comparison-report.json build/owner-qa/REGRESSION-REPORT.json
          echo "Owner-signed full STREAM 56.0.5 APK verified; NOT published to customers." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full owner-signed APK for private testing only
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-56.0.5-CONNECT-OWNER-SIGNED-cd5f81cd44a72fd99c3f208b5b8668fd458a53ad
          path: build/owner-qa/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve all pre-signing test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-pre-signing-test-results-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testStreamCodeDemoUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/blofy-production.keystore" "$RUNNER_TEMP/blofy-production.b64"
