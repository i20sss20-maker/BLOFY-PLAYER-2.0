name: BLOFY Linode Ledger QA
on:
  pull_request:
    paths:
      - 'services/activation/src/linode-feed-ledger.mjs'
      - 'services/activation/test/linode-feed-ledger.test.mjs'
      - 'services/activation/tools/linode-feed-ledger-postgres-qa.mjs'
      - '.github/workflows/blofy-linode-ledger-qa.yml'
permissions:
  contents: read
jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blofy_ledger_qa
          POSTGRES_USER: blofy_qa
          POSTGRES_PASSWORD: blofy_qa_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blofy_qa -d blofy_ledger_qa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: services/activation
      - run: node --test test/linode-feed-ledger.test.mjs tools/linode-feed-ledger-postgres-qa.mjs
        working-directory: services/activation
