name: Publish BLOFY Website 48 Metadata

on:
  push:
    branches: [rc07-commercial-stability]
    paths: [.github/workflows/publish-website48-main.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Advance approved website release from 47 to 48
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('services/activation/src/approved-release-rc0747.mjs')
          s = p.read_text()
          replacements = [
            ("versionCode: 2000058,", "versionCode: 2000059,"),
            ("versionName: '2.0.0-rc07.47',", "versionName: '2.0.0-rc07.48',"),
            ("releases/download/v2.0.0-rc07.47/BLOFY-PLAYER-2.0-rc07.47-signed.apk", "releases/download/v2.0.0-rc07.48/BLOFY-PLAYER-2.0-rc07.48-signed.apk"),
            ("sha256: 'a488d272ee44de6d4f2b0f46acb49edea95d3e6f2800738f8e1539a1f4b1fa14',", "sha256: '921d463f00b94d2d54a3b5064bd7981ee8557a9dcfa0b02be40a5913e929e5e3',"),
            ("export const RC0747_PUBLICATION_ACTION = 'publish_rc0747_20260914';", "export const RC0747_PUBLICATION_ACTION = 'publish_rc0748_20260914';"),
            ("versionCode: 2000057,", "versionCode: 2000058,"),
            ("versionName: '2.0.0-rc07.46',", "versionName: '2.0.0-rc07.47',"),
            ("releases/download/v2.0.0-rc07.46/BLOFY-PLAYER-2.0-rc07.46-signed.apk", "releases/download/v2.0.0-rc07.47/BLOFY-PLAYER-2.0-rc07.47-signed.apk"),
            ("Publish rc07.47 only when production is still exactly on the approved rc07.46", "Publish rc07.48 only when production is still exactly on the approved rc07.47"),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected release marker: {old}')
            s = s.replace(old, new, 1)
          old_notes = "releaseNotes: 'BLOFY PLAYER 47 — تحسين البحث وعرض الأفلام والمسلسلات كبوسترات، تحسين استجابة الريموت وOK، تحسين تحميل بيانات وصور الطاقم عند توفرها من السيرفر، وتقليل الضغط الخلفي على أجهزة Android TV الضعيفة. يتضمن إصلاحات استقرار التحديث والقوائم مع الحفاظ على محركات التشغيل والثيم.'"
          new_notes = "releaseNotes: 'BLOFY PLAYER 48 — إصدار الموقع فقط. تثبيت رقم الإصدار 2000059 والتحقق من شهادة الإنتاج وسلامة مكتبات FFmpeg المضمنة، مع بقاء التحديث المباشر فعالاً. يتضمن تحسينات البحث والريموت وصور الطاقم من الإصدار 47. الثيم ومحركات ومسارات التشغيل دون تغيير.'"
          if old_notes not in s:
            raise SystemExit('missing approved release notes marker')
          p.write_text(s.replace(old_notes, new_notes, 1))

          p = Path('services/activation/src/release-metadata.mjs')
          s = p.read_text()
          replacements = [
            ("versionCode: 2000058,", "versionCode: 2000059,"),
            ("versionName: '2.0.0-rc07.47',", "versionName: '2.0.0-rc07.48',"),
            ("releases/download/v2.0.0-rc07.47/BLOFY-PLAYER-2.0-rc07.47-signed.apk", "releases/download/v2.0.0-rc07.48/BLOFY-PLAYER-2.0-rc07.48-signed.apk"),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected metadata marker: {old}')
            s = s.replace(old, new, 1)
          old_notes = "releaseNotes: 'BLOFY PLAYER 47 — تحسين البحث وعرض الأفلام والمسلسلات كبوسترات، تحسين استجابة الريموت وOK، تحسين تحميل بيانات وصور الطاقم عند توفرها من السيرفر، وتقليل الضغط الخلفي على أجهزة Android TV الضعيفة. يتضمن إصلاحات استقرار التحديث والقوائم مع الحفاظ على محركات التشغيل والثيم.'"
          new_notes = "releaseNotes: 'BLOFY PLAYER 48 — إصدار الموقع فقط. تثبيت رقم الإصدار 2000059 والتحقق من شهادة الإنتاج وسلامة مكتبات FFmpeg المضمنة، مع بقاء التحديث المباشر فعالاً. يتضمن تحسينات البحث والريموت وصور الطاقم من الإصدار 47. الثيم ومحركات ومسارات التشغيل دون تغيير.'"
          if old_notes not in s:
            raise SystemExit('missing fallback release notes marker')
          p.write_text(s.replace(old_notes, new_notes, 1))
          PY

      - name: Verify activation service
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix services/activation
          npm run check --prefix services/activation
          npm test --prefix services/activation
          grep -Fq "versionCode: 2000059" services/activation/src/release-metadata.mjs
          grep -Fq "2.0.0-rc07.48" services/activation/src/approved-release-rc0747.mjs
          grep -Fq "921d463f00b94d2d54a3b5064bd7981ee8557a9dcfa0b02be40a5913e929e5e3" services/activation/src/approved-release-rc0747.mjs

      - name: Commit website 48 metadata to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/activation/src/approved-release-rc0747.mjs services/activation/src/release-metadata.mjs
          git diff --cached --check
          git commit -m 'Publish BLOFY PLAYER 48 on website'
          git push origin HEAD:main
