name: BLOFY Azure Target Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-target-audit.yml'

permissions:
  contents: read
  id-token: write

env:
  AZURE_RG: ${{ vars.BLOFY_AZURE_RG }}
  EXPECTED_ACTIVATION_TAG: '6d2526695542'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Collect privacy-safe target audit
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null
          IMAGE="$(az containerapp show -g "$AZURE_RG" -n blofy-activation --query 'properties.template.containers[0].image' -o tsv)"
          READY="$(az containerapp show -g "$AZURE_RG" -n blofy-activation --query 'properties.latestReadyRevisionName' -o tsv)"
          LATEST="$(az containerapp show -g "$AZURE_RG" -n blofy-activation --query 'properties.latestRevisionName' -o tsv)"
          [[ "$IMAGE" == *":$EXPECTED_ACTIVATION_TAG" ]]
          [[ -n "$LATEST" && "$READY" == "$LATEST" ]]

          OUT="$RUNNER_TEMP/activation-console.log"
          set +e
          timeout 35s az containerapp logs show \
            -g "$AZURE_RG" \
            -n blofy-activation \
            --type console \
            --tail 300 \
            >"$OUT" 2>&1
          set -e

          LINE="$(grep 'BLOFY_MIGRATION_AZURE_AUDIT_V1' "$OUT" | tail -1 || true)"
          if [[ -z "$LINE" ]]; then
            echo 'Safe Azure audit marker not found in recent activation console logs.' >&2
            exit 1
          fi
          printf '%s\n' "$LINE"

      - name: Verify public gateway remains healthy
        shell: bash
        run: |
          set -euo pipefail
          FQDN="$(az containerapp show -g "$AZURE_RG" -n blofy-gateway --query 'properties.configuration.ingress.fqdn' -o tsv)"
          curl -fsS --max-time 15 "https://$FQDN/health" >/dev/null
          echo 'Gateway remains healthy after read-only audit.'
