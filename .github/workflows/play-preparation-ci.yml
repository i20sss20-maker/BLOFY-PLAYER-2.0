name: BLOFY Google Play preparation checks
on:
  pull_request:
    branches: [rc07-runtime-recovery, release/rc0750-railway-updater]
    paths: ['app/**', '.github/workflows/play-preparation-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify actual Play app behavior and lint
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -PBLOFY_DISTRIBUTION=play -PBLOFY_ACTIVATION_BASE_URL=https://example.test testDebugUnitTest --tests tv.blofy.player.core.identity.CommercialPreparationTest
          gradle --no-daemon --max-workers=2 -PBLOFY_DISTRIBUTION=play -PBLOFY_ACTIVATION_BASE_URL=https://example.test lintDebug assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > play-permissions.txt
          if grep -q REQUEST_INSTALL_PACKAGES play-permissions.txt; then echo 'Play APK contains the installer permission'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-preparation-${{ github.sha }}
          path: |
            play-permissions.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 14
