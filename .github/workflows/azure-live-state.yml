name: BLOFY Azure Live State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-live-state.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect live Azure state
        env:
          RG: ${{ vars.BLOFY_AZURE_RG }}
        shell: bash
        run: |
          set -u
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null
          ENV_NAME="$(az containerapp env list --resource-group "$RG" --query '[0].name' -o tsv)"
          echo '=== Environment ==='
          az containerapp env show --resource-group "$RG" --name "$ENV_NAME" \
            --query '{name:name,internal:properties.vnetConfiguration.internal,publicNetworkAccess:properties.publicNetworkAccess,defaultDomain:properties.defaultDomain,staticIp:properties.staticIp}' -o json
          for app in blofy-activation blofy-releases blofy-gateway; do
            echo "=== $app ==="
            az containerapp show --resource-group "$RG" --name "$app" \
              --query '{provisioningState:properties.provisioningState,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName,image:properties.template.containers[0].image,external:properties.configuration.ingress.external,targetPort:properties.configuration.ingress.targetPort,fqdn:properties.configuration.ingress.fqdn,traffic:properties.configuration.ingress.traffic}' -o json
            az containerapp revision list --resource-group "$RG" --name "$app" \
              --query '[].{name:name,active:properties.active,health:properties.healthState,provisioning:properties.provisioningState,replicas:properties.replicas,created:properties.createdTime}' -o table
          done
          FQDN="$(az containerapp show --resource-group "$RG" --name blofy-gateway --query properties.configuration.ingress.fqdn -o tsv)"
          echo "=== Gateway probe: https://$FQDN/health ==="
          curl -sS --connect-timeout 5 --max-time 8 -D /tmp/headers.txt -o /tmp/body.txt -w 'HTTP=%{http_code} DNS=%{time_namelookup} CONNECT=%{time_connect} TLS=%{time_appconnect} TOTAL=%{time_total}\n' "https://$FQDN/health" || true
          cat /tmp/headers.txt 2>/dev/null || true
          cat /tmp/body.txt 2>/dev/null || true
          echo
          echo '=== Gateway recent logs ==='
          timeout 25s az containerapp logs show --resource-group "$RG" --name blofy-gateway --type console --tail 80 2>&1 || true
