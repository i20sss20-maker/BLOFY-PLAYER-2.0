name: BLOFY External RC07.50 Railway Updater Release

on:
  push:
    branches: [rc07-commercial-stability]
    paths: [.github/workflows/website-rc0750-railway-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blofy-external-rc0750-railway
  cancel-in-progress: false

env:
  SOURCE_BRANCH: release/rc0750-railway-updater
  PRODUCTION_ACTIVATION_BASE_URL: https://api.blofyplayer.com
  PRODUCTION_UPDATE_BASE_URL: https://updates.blofyplayer.com
  RELEASE_VERSION_CODE: "2000061"
  RELEASE_VERSION_NAME: 2.0.0-rc07.50
  RELEASE_TAG: v2.0.0-rc07.50
  RELEASE_APK: BLOFY-PLAYER-2.0-rc07.50-signed.apk
  EXPECTED_APPLICATION_ID: tv.blofy.player.v2
  EXPECTED_CERT_SHA256: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
  MEDIA3_VERSION: "1.6.1"
  FFMPEG_DECODERS: ac3 eac3 dca truehd aac mp3 opus vorbis flac
  ANDROID_NDK_VERSION: 28.0.13004108
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_BUILD_TOOLS_VERSION: 35.0.0

jobs:
  publish-external-apk:
    if: github.ref == 'refs/heads/rc07-commercial-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc0750-railway-updater
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prove rc07.50 only separates updater endpoint from stable rc07.49 app
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin tag v2.0.0-rc07.49
          source_sha="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          mapfile -t changed < <(git diff --name-only v2.0.0-rc07.49 -- app)
          printf '%s\n' "${changed[@]}"
          [[ ${#changed[@]} -eq 2 ]]
          [[ "${changed[0]}" == "app/build.gradle.kts" ]]
          [[ "${changed[1]}" == "app/src/main/java/tv/blofy/player/core/update/AppReleaseRepository.kt" ]]
          grep -Fq 'versionCode = 2000061' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.50"' app/build.gradle.kts
          grep -Fq 'buildConfigField("String", "UPDATE_BASE_URL"' app/build.gradle.kts
          grep -Fq 'BuildConfig.UPDATE_BASE_URL' app/src/main/java/tv/blofy/player/core/update/AppReleaseRepository.kt
          ! git diff --name-only v2.0.0-rc07.49 -- app/src/main/java/tv/blofy/player/core/playback app/src/main/java/tv/blofy/player/ui/player | grep -q .

      - name: Verify activation and Railway update endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 30 "$PRODUCTION_ACTIVATION_BASE_URL/health" > "$RUNNER_TEMP/activation-health.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 30 "$PRODUCTION_UPDATE_BASE_URL/health" > "$RUNNER_TEMP/update-health.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          a=json.loads((root/'activation-health.json').read_text())
          u=json.loads((root/'update-health.json').read_text())
          assert a['ok'] is True
          assert u['ok'] is True
          assert int(u['release']['app']['versionCode']) == 2000060
          assert u['release']['app']['versionName'] == '2.0.0-rc07.49'
          PY

      - name: Reject already published rc07.50
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release 50 already exists; refusing overwrite.' >&2
            exit 1
          fi

      - name: Install Android native and signing toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION"
          command -v ninja >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - name: Decode and verify production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/blofy-production.keystore"
          clean_b64="$RUNNER_TEMP/blofy-production.b64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > "$clean_b64"
          remainder=$(( $(wc -c < "$clean_b64") % 4 )); if [[ "$remainder" -ne 0 ]]; then printf '%*s' $((4 - remainder)) '' | tr ' ' '=' >> "$clean_b64"; fi
          base64 --decode "$clean_b64" > "$keystore"
          keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          actual="$(keytool -exportcert -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          [[ "$actual" == "$EXPECTED_CERT_SHA256" ]]

      - name: Build unchanged Media3 FFmpeg decoder
        shell: bash
        env:
          ENABLED_DECODERS: ${{ env.FFMPEG_DECODERS }}
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          aar="build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          test -s "$aar" && sha256sum --check "$aar.sha256"

      - name: Test lint and build signed rc07.50 APK
        shell: bash
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          aar="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_DISTRIBUTION=website \
            -PBLOFY_SECURITY_R8=true \
            -PBLOFY_ACTIVATION_BASE_URL="$PRODUCTION_ACTIVATION_BASE_URL" \
            -PBLOFY_UPDATE_BASE_URL="$PRODUCTION_UPDATE_BASE_URL" \
            -PBLOFY_BUILD_SHA="$SOURCE_SHA" \
            -PBLOFY_FFMPEG_AAR="$aar" \
            testReleaseUnitTest lintRelease assembleRelease

      - name: Verify identity signature and direct update over rc07.49
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release "$RUNNER_TEMP/upgrade"
          cp app/build/outputs/apk/release/app-release.apk "release/$RELEASE_APK"
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          new="release/$RELEASE_APK"
          "$tools/aapt" dump badging "$new" | tee release/apk-badging.txt
          grep -Fq "package: name='$EXPECTED_APPLICATION_ID' versionCode='$RELEASE_VERSION_CODE' versionName='$RELEASE_VERSION_NAME'" release/apk-badging.txt
          ! grep -q '^application-debuggable' release/apk-badging.txt
          "$tools/zipalign" -c -P 16 -v 4 "$new" > release/apk-alignment.txt
          "$tools/apksigner" verify --verbose --print-certs "$new" | tee release/apk-signature.txt
          new_cert="$("$tools/apksigner" verify --print-certs "$new" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          [[ "$new_cert" == "$EXPECTED_CERT_SHA256" ]]
          unzip -Z1 "$new" > "$RUNNER_TEMP/apk-files.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do grep -Eiq "^lib/$abi/lib(ffmpeg|ffmpegJNI).*\\.so$" "$RUNNER_TEMP/apk-files.txt"; done
          gh release download v2.0.0-rc07.49 --pattern BLOFY-PLAYER-2.0-rc07.49-signed.apk --dir "$RUNNER_TEMP/upgrade" --repo "$GITHUB_REPOSITORY"
          old="$RUNNER_TEMP/upgrade/BLOFY-PLAYER-2.0-rc07.49-signed.apk"
          "$tools/aapt" dump badging "$old" > "$RUNNER_TEMP/old-badging.txt"
          grep -Fq "package: name='$EXPECTED_APPLICATION_ID' versionCode='2000060'" "$RUNNER_TEMP/old-badging.txt"
          old_cert="$("$tools/apksigner" verify --print-certs "$old" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          [[ "$old_cert" == "$EXPECTED_CERT_SHA256" ]]
          [[ "$RELEASE_VERSION_CODE" -gt 2000060 ]]
          (cd release && sha256sum "$RELEASE_APK" > SHA256SUMS && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-rc07.50-railway-updater-${{ env.SOURCE_SHA }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified rc07.50 external APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_source="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')"
          [[ "$remote_source" == "$SOURCE_SHA" ]] || { echo 'Source branch advanced; refusing stale publication' >&2; exit 1; }
          notes='BLOFY PLAYER 50 — جسر فصل قناة التحديث الخارجي. التفعيل والبوابة يستخدمان نطاق BLOFY على Railway مؤقتًا، وقناة التحديث الخارجية تستخدم نطاق BLOFY المخصص على Railway. لم يتم تغيير Media3 أو FFmpeg أو fallback أو مسارات ومحركات التشغيل أو الثيم. تم التحقق من اسم الحزمة وشهادة الإنتاج وأن النسخة تثبت كتحديث فوق 49.'
          gh release create "$RELEASE_TAG" "release/$RELEASE_APK" release/SHA256SUMS release/apk-badging.txt release/apk-signature.txt release/apk-alignment.txt \
            --title 'BLOFY PLAYER 50 — Railway Updater Bridge' --notes "$notes" --target "$SOURCE_SHA" --latest --repo "$GITHUB_REPOSITORY"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/blofy-production.keystore" "$RUNNER_TEMP/blofy-production.b64"
