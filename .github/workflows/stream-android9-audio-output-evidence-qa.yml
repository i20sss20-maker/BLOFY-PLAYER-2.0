name: BLOFY STREAM 55.8.32 Android 9 Audio Evidence QA

on:
  pull_request:
    branches:
      - qa/stream-55832-signed-base-20261117
    paths:
      - 'app/**'
      - '.github/workflows/stream-android9-audio-output-evidence-qa.yml'

permissions:
  contents: read

jobs:
  android9-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Verify exact signed 55.8.32 source identity; never sign or publish
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000109' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.8.32"' app/build.gradle.kts
          grep -Fq 'applicationIdSuffix = ".stream.qa"' app/build.gradle.kts
          grep -Fq 'buildConfigField("boolean", "CODE_ONLY_LOGIN", "true")' app/build.gradle.kts
          test ! -f app/build/outputs/apk/streamCodeOnly/app-streamCodeOnly.apk
      - name: Test Android 9 audio renderer diagnostics and user-approved AAC path
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeDemoUnitTest \
            --tests 'tv.blofy.player.core.diagnostics.StreamAudioOutputEvidenceTest' \
            --tests 'tv.blofy.player.ui.player.StreamAacTrackChoiceTest' \
            --tests 'tv.blofy.player.ui.player.StreamAudioChannelTransitionTest' \
            --tests 'tv.blofy.player.core.diagnostics.StreamAudioQaReportTest' \
            --tests 'tv.blofy.player.core.diagnostics.StreamAudioHealthTest'
      - name: Assemble unsigned separate STREAM QA APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            assembleStreamCodeDemo
          file=app/build/outputs/apk/streamCodeDemo/app-streamCodeDemo.apk
          test -s "$file"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$file" > "$RUNNER_TEMP/blofy-stream-qa-badging.txt"
          grep -Fq "name='tv.blofy.player.v2.stream.qa'" "$RUNNER_TEMP/blofy-stream-qa-badging.txt"
          echo 'QA ONLY: no production signing, download site, or internal updater promotion' >> "$GITHUB_STEP_SUMMARY"
      - name: Attach QA package and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.32-ANDROID9-AUDIO-QA-${{ github.sha }}
          path: |
            app/build/outputs/apk/streamCodeDemo/*.apk
            app/build/test-results/testStreamCodeDemoUnitTest/
          if-no-files-found: warn
          retention-days: 7
