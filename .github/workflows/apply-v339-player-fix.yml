name: Apply v339 player behavior fix

on:
  push:
    branches:
      - fix-v339-player-behavior-rc06
    paths:
      - .github/workflows/apply-v339-player-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix-v339-player-behavior-rc06
          fetch-depth: 0

      - name: Apply deterministic source repair
        run: python3 scripts/apply_v339_player_fix.py

      - name: Validate and commit repaired source
        run: |
          git config user.name "BLOFY Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/tv/blofy/player/ui/player/PlayerActivity.kt
          git diff --cached --check
          git commit -m "Restore rc05 player behavior inside approved v339 HUD"
          git push origin HEAD:fix-v339-player-behavior-rc06
