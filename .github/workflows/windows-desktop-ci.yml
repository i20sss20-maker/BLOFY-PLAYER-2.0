name: Windows Desktop CI

on:
  push:
    branches:
      - feature/windows-desktop-v1
    paths:
      - "windows/**"
      - ".github/workflows/windows-desktop-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-desktop-ci.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Create Windows icon from Android BLOFY logo
        shell: pwsh
        run: |
          python -m pip install pillow --disable-pip-version-check --quiet
          New-Item -ItemType Directory -Force windows/src/BlofyPlayer.Windows/Assets | Out-Null
          @'
          from PIL import Image
          src = "app/src/main/res/drawable-nodpi/blofy_logo.png"
          dst = "windows/src/BlofyPlayer.Windows/Assets/blofy.ico"
          image = Image.open(src).convert("RGBA")
          image.save(dst, format="ICO", sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding UTF8 convert_icon.py
          python convert_icon.py

      - name: Restore
        run: dotnet restore windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj

      - name: Verify consistent Windows release metadata
        shell: pwsh
        run: |
          $p = Get-Content -Raw windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj
          $i = Get-Content -Raw windows/installer/BlofyPlayer.iss
          $v = Get-Content -Raw windows/src/BlofyPlayer.Windows/Core/AppBuildInfo.cs
          if ($p -notmatch '<Version>0\.4\.20</Version>' -or
              $i -notmatch '#define MyAppVersion "0\.4\.20"' -or
              $v -notmatch 'const string Version = "0\.4\.20"') {
            throw "Windows client, application and setup versions disagree"
          }

      - name: Artwork streaming regression checks
        run: dotnet run --project windows/tests/ArtworkReaderChecks/ArtworkReaderChecks.csproj -c Release

      - name: Build
        run: dotnet build windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj -c Release --no-restore

      - name: Publish self-contained x64
        run: dotnet publish windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj -c Release -r win-x64 --self-contained true -o windows/publish

      - name: Include BLOFY icon
        shell: pwsh
        run: Copy-Item windows/src/BlofyPlayer.Windows/Assets/blofy.ico windows/publish/blofy.ico -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup EXE
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc windows/installer/BlofyPlayer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test silent installer in isolated folder
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'windows/installer/output/BLOFY-PLAYER-Windows-Setup-x64.exe').Path
          $target = Join-Path $env:RUNNER_TEMP 'BLOFY-Windows-Smoke'
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ("/DIR=" + $target)
          )
          if ($process.ExitCode -ne 0) { throw "Silent Windows setup failed: $($process.ExitCode)" }
          $binary = Join-Path $target 'BLOFY PLAYER.exe'
          if (!(Test-Path $binary)) { throw "The installed Windows player executable is missing" }
          $version = (Get-Item $binary).VersionInfo.FileVersion
          if (!$version.StartsWith("0.4.20")) {
            throw "Unexpected installed file version: $version"
          }
          Write-Host "Installer smoke check passed: $binary ($version)"

      - name: Build separate Debug playback lab artifact
        run: dotnet publish windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj -c Debug -r win-x64 --self-contained true -o windows/qa-debug

      - name: Upload Windows Debug playback lab
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-Windows-DEBUG-Playback-Lab-x64
          path: windows/qa-debug
          if-no-files-found: error
          retention-days: 7

      - name: Generate installer SHA256
        shell: pwsh
        run: |
          $setup = 'windows/installer/output/BLOFY-PLAYER-Windows-Setup-x64.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BLOFY-PLAYER-Windows-Setup-x64.exe" | Set-Content -Encoding Ascii windows/installer/output/SHA256SUMS.txt

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-Windows-x64-Portable
          path: windows/publish
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-Windows-Setup-x64
          path: |
            windows/installer/output/BLOFY-PLAYER-Windows-Setup-x64.exe
            windows/installer/output/SHA256SUMS.txt
          if-no-files-found: error
