name: Windows Desktop CI

on:
  push:
    branches:
      - feature/windows-desktop-v1
    paths:
      - "windows/**"
      - ".github/workflows/windows-desktop-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-desktop-ci.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj

      - name: Build
        run: dotnet build windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj -c Release --no-restore

      - name: Publish self-contained x64
        run: dotnet publish windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj -c Release -r win-x64 --self-contained true -o windows/publish

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-Windows-x64
          path: windows/publish
          if-no-files-found: error
