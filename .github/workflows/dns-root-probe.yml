name: BLOFY Root DNS Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dns-root-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for root DNS verification and TLS
        shell: bash
        env:
          EXPECTED_TXT: railway-verify=149ca2e23f3cbb512864f614997aa2ef26ac948b42b91293cfe5b6929d576a3c
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            echo "=== attempt $attempt/20 ==="
            a="$(dig +short A blofyplayer.com | head -n1 || true)"
            txt="$(dig +short TXT _railway-verify.blofyplayer.com | tr -d '"' || true)"
            echo "A=$a"
            echo "TXT=$txt"

            txt_ok=0
            tls_ok=0
            [[ "$txt" == *"$EXPECTED_TXT"* ]] && txt_ok=1

            cert="$(timeout 12 openssl s_client -connect blofyplayer.com:443 -servername blofyplayer.com </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || true)"
            echo "$cert"
            if grep -Eq 'DNS:blofyplayer\.com([,[:space:]]|$)|DNS:\*\.blofyplayer\.com([,[:space:]]|$)' <<<"$cert"; then
              tls_ok=1
            fi

            if [[ "$txt_ok" -eq 1 && "$tls_ok" -eq 1 ]]; then
              curl --fail --silent --show-error --location --proto '=https' --tlsv1.2                 --connect-timeout 8 --max-time 30 https://blofyplayer.com/health
              echo
              echo "ROOT_DNS_AND_TLS_READY"
              exit 0
            fi

            sleep 30
          done
          echo "::error::Root DNS verification or TLS is still not ready after 10 minutes"
          exit 1
