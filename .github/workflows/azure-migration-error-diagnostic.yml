name: BLOFY Azure Migration Error Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'ops/azure-migration-error-diagnostic.run'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AZURE_RG: ${{ vars.BLOFY_AZURE_RG }}
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read migration error from Log Analytics
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(az monitor log-analytics workspace list -g "$AZURE_RG" --query '[0].customerId' -o tsv)"
          test -n "$WORKSPACE"
          QUERY='ContainerAppConsoleLogs_CL | where TimeGenerated > ago(2h) | where ContainerAppName_s == "blofy-activation" | where Log_s contains "migration_import_failed" or Log_s contains "migration_import_database_unavailable" | project TimeGenerated, RevisionName_s, Log_s | order by TimeGenerated desc | take 20'
          OUT="$(az monitor log-analytics query -w "$WORKSPACE" --analytics-query "$QUERY" -o json)"
          COUNT="$(jq 'length' <<<"$OUT")"
          echo "Migration error rows found: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo 'No migration error row found in Log Analytics.'
            exit 2
          fi
          jq -r '.[] | [.TimeGenerated,.RevisionName_s,.Log_s] | @tsv' <<<"$OUT"
