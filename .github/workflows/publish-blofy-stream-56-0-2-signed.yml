name: Publish verified BLOFY STREAM 56.0.2 owner-signed website APK
on:
  push:
    branches: [release/blofy-stream-56-0-2-website-signed-20261121]
    paths: ['.github/workflows/publish-blofy-stream-56-0-2-signed.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: blofy-stream-56-0-2-signed-website-publication
  cancel-in-progress: false
jobs:
  publish-only-after-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '44835025044'
      SOURCE_HEAD: '8a855395bb4178732a5d5762058c4a177fd29790'
      ARTIFACT_PREFIX: 'BLOFY-STREAM-56.0.2-AUTO-CATALOG-OWNER-SIGNED-'
      APK: 'BLOFY-STREAM-56.0.2-AUTO-CATALOG-FIX-OWNER-SIGNED.apk'
      ZIP: 'BLOFY-STREAM-56.0.2-CATALOG-OWNER-SIGNED-PACKAGE.zip'
      TAG: 'blofy-stream-56-0-2-signed-20261121'
      CERT: 'C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E'
    steps:
      - uses: actions/checkout@v4
      - name: Require exact upstream STREAM 56.0.2 CI and original signing to succeed
        shell: bash
        run: |
          set -euo pipefail
          done_status=''
          for attempt in $(seq 1 140); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
            jq -e --arg sha "$SOURCE_HEAD" '.head_sha==$sha and .event=="pull_request"' "$RUNNER_TEMP/source-run.json"
            status="$(jq -r '.status' "$RUNNER_TEMP/source-run.json")"
            if [ "$status" = completed ]; then
              jq -e '.conclusion=="success"' "$RUNNER_TEMP/source-run.json"
              done_status=passed
              break
            fi
            sleep 22
          done
          test "$done_status" = passed || { echo "::error::Signing run did not finish successfully"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          jq -e '[.jobs[] | select(.name=="verify" and .conclusion=="success")] | length==1' "$RUNNER_TEMP/jobs.json"
          jq -e '[.jobs[] | select(.name=="owner-signed-stream-qa" and .conclusion=="success")] | length==1' "$RUNNER_TEMP/jobs.json"
          jq -e '[.jobs[].steps[] | select(.name=="Sign full BLOFY STREAM with original owner certificate" and .conclusion=="success")] | length==1' "$RUNNER_TEMP/jobs.json"
          jq -e '[.jobs[].steps[] | select(.name=="Verify identity, certificate, signatures, native FFmpeg and SHA256" and .conclusion=="success")] | length==1' "$RUNNER_TEMP/jobs.json"
      - name: Retrieve exact owner-signed APK (never build or sign in public publisher)
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          artifact="$(jq -er --arg p "$ARTIFACT_PREFIX" '[.artifacts[] | select((.name|startswith($p)) and .expired==false)] | if length==1 then .[0].name else error("missing or ambiguous signed artifact") end' "$RUNNER_TEMP/artifacts.json")"
          mkdir -p signed release
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir signed
          source_apk="$(find signed -type f -name "$APK" -print -quit)"
          sums="$(find signed -type f -name SHA256SUMS -print -quit)"
          identity="$(find signed -type f -name IDENTITY.txt -print -quit)"
          test -s "$source_apk" && test -s "$sums" && test -s "$identity"
          grep -Fxq 'application_id=tv.blofy.player.v2.stream' "$identity"
          grep -Fxq 'version_code=2000117' "$identity"
          grep -Eq '^source_sha=[0-9a-f]{40}$' "$identity"
          (cd "$(dirname "$source_apk")" && sha256sum -c SHA256SUMS)
          cp "$source_apk" "release/$APK"
          # The signed artifact also carries FFmpeg compliance checksums.
          # Publish an APK-only checksum manifest after the original bundle was verified.
          (cd release && sha256sum "$APK" > SHA256SUMS && sha256sum -c SHA256SUMS)
          cp "$identity" release/IDENTITY.txt
          size="$(stat -c '%s' "release/$APK")"
          test "$size" -gt 25000000 && test "$size" -lt 268435456
          sha="$(sha256sum "release/$APK" | awk '{print $1}')"
          printf 'SIZE=%s\nSHA256=%s\n' "$size" "$sha" >> "$GITHUB_ENV"
      - name: Independently verify Android package, original-owner signature and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/build-tools/35.0.0" || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging "release/$APK" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "name='tv.blofy.player.v2.stream' versionCode='2000117' versionName='2.0.0-rc07.56.0.2-STREAM'" "$RUNNER_TEMP/badging.txt"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/badging.txt"
          "$tools/apksigner" verify --verbose --print-certs "release/$APK" > "$RUNNER_TEMP/apk-signatures.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signatures.txt" | head -n 1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$CERT"
          "$tools/zipalign" -c -P 16 -v 4 "release/$APK"
          unzip -Z1 "release/$APK" > "$RUNNER_TEMP/entries.txt"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libffmpegJNI.so" "$RUNNER_TEMP/entries.txt"
          done
          (cd release && sha256sum -c SHA256SUMS)
      - name: Create immutable APK ZIP for Railway's SHA256-gated importer
        shell: bash
        run: |
          set -euo pipefail
          (cd release && zip -0 -q -j "$ZIP" "$APK" SHA256SUMS IDENTITY.txt)
          test -s "release/$ZIP"
          test "$(unzip -Z1 "release/$ZIP" | grep -Fxc "$APK")" -eq 1
          test "$(unzip -p "release/$ZIP" "$APK" | sha256sum | awk '{print $1}')" = "$SHA256"
      - name: Publish owner-signed APK plus SHA256-gated archive as GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          existing=0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing=1
            # Idempotency only for byte-identical, already published signed files.
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK" --dir "$RUNNER_TEMP/existing"
            test "$(sha256sum "$RUNNER_TEMP/existing/$APK" | awk '{print $1}')" = "$SHA256" ||
              { echo "::error::Existing release tag has a different APK"; exit 1; }
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          BLOFY STREAM 56.0.2 | App package tv.blofy.player.v2.stream, versionCode 2000117.
          Original-owner signed FFmpeg APK. Automatic incremental content checks
          and an in-settings progress spinner with explicit completion/error status.
          Source branch head: $SOURCE_HEAD; independently verified upstream run: $SOURCE_RUN.
          APK_SHA256=$SHA256
          APK_BYTES=$SIZE
          This GitHub release is the signed package source. The customer's
          update feed is not changed until Railway imports and verifies the exact APK.
          Install without uninstalling the previous same-certificate STREAM app.
          EOF
          if [ "$existing" -eq 0 ]; then
            gh release create "$TAG" "release/$APK" "release/$ZIP" release/SHA256SUMS release/IDENTITY.txt \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --prerelease \
              --title "BLOFY STREAM 56.0.2 | Automatic Content Refresh | Owner Signed" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets |
            jq -er --arg apk "$APK" --arg zip "$ZIP" 'select((.assets|map(.name)|index($apk)) and (.assets|map(.name)|index($zip))) | .tagName'
          echo "### Verified BLOFY STREAM 56.0.2 owner-signed APK published (not yet website-promoted)" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256: $SHA256; bytes: $SIZE; source: $SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
