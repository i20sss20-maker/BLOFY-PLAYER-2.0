name: BLOFY STREAM 55.8.14 - Android 9 audio owner QA
on:
  push:
    branches:
      - qa/stream-55-8-14-audio-recovery-20261112
    paths:
      - 'app/**'
      - 'tools/stream-audio-device-qa.py'
      - 'tools/test_stream_audio_device_qa.py'
      - '.github/workflows/stream-55-8-14-audio-qa.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/stream-audio-device-qa.py'
      - 'tools/test_stream_audio_device_qa.py'
      - '.github/workflows/stream-55-8-14-audio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android9-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify QA identity from pinned 55.8.14 owner-signed baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000091' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.8.14"' app/build.gradle.kts
          grep -Fq 'applicationIdSuffix = ".stream.qa"' app/build.gradle.kts
          grep -Fq 'StreamAudioRecoveryPolicy.shouldAttempt(' app/src/main/java/tv/blofy/player/ui/player/PlayerActivity.kt
          grep -Fq 'detectedMimeTypes' app/src/main/java/tv/blofy/player/core/diagnostics/StreamAudioHealth.kt
      - name: Confirm local-only ADB report cannot export credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_stream_audio_device_qa.py
      - name: Install Android 36 for compile
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Test Android 9 audio policy and build parallel-installable STREAM QA APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeDemoUnitTest \
            --tests 'tv.blofy.player.core.diagnostics.StreamAudioRecoveryPolicyTest' \
            --tests 'tv.blofy.player.core.diagnostics.StreamAudioHealthTest'
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            assembleStreamCodeDemo
          test -s app/build/outputs/apk/streamCodeDemo/app-streamCodeDemo.apk
      - name: Keep APK as temporary owner QA only
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.14-Android9-Audio-QA-${{ github.sha }}
          path: |
            app/build/outputs/apk/streamCodeDemo/*.apk
            app/build/test-results/testStreamCodeDemoUnitTest/*.xml
          retention-days: 14
          if-no-files-found: error
