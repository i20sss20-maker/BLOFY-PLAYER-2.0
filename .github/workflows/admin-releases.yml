name: BLOFY Admin Releases
on:
  push:
    branches: [main, fix/admin-release-management, fix/downloader-releases-ssr, fix/portal-rc0742-publish]
    paths: ['services/activation/**', '.github/workflows/admin-releases.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blofy_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: blofy_admin_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BLOFY_TEST_DATABASE_URL: postgresql://blofy_test:local_test_only@127.0.0.1:5432/blofy_admin_test
    defaults:
      run:
        working-directory: services/activation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax validation
        run: |
          npm run check
          node --check src/admin-console-hook.mjs
          node --check src/admin-session-hook.mjs
          node --check src/release-catalog.mjs
          node --check src/public-downloads.mjs
          node --check web/release-manager.js
      - name: Release catalogue tests with PostgreSQL
        run: node --test test/release-catalog.test.mjs test/public-downloads.test.mjs test/approved-release-rc0742.test.mjs test/subscriber-portal-ui.test.mjs test/portal-save-generation.test.mjs
      - name: Authenticated admin and public update integration
        run: node test/admin-release-runtime.mjs
