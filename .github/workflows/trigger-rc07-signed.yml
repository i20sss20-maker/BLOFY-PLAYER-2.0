name: Trigger BLOFY RC07 Signed Release

on:
  push:
    branches: [rc07-commercial-stability]

permissions:
  actions: write
  contents: read

jobs:
  trigger-signed:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rc07-release.yml --ref rc07-commercial-stability
