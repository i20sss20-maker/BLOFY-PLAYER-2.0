name: Trigger BLOFY RC07 Signed Release

on:
  push:
    branches: [rc07-runtime-recovery]
    paths:
      - '.github/workflows/trigger-rc07-signed.yml'
      - '.github/workflows/rc07-release.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger-signed:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rc07-release.yml --repo i20sss20-maker/BLOFY-PLAYER-2.0 --ref rc07-runtime-recovery
