name: BLOFY Azure Admin Auth Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-admin-auth-repair.yml'

permissions:
  contents: read
  id-token: write

env:
  AZURE_RG: ${{ vars.BLOFY_AZURE_RG }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Refresh release admin password binding
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null

          APP='blofy-releases'
          KV_SECRET_NAME='release-admin-password'
          APP_SECRET_NAME='release-admin-password-refresh'

          VAULT="$(az keyvault list -g "$AZURE_RG" --query '[0].name' -o tsv)"
          test -n "$VAULT"

          IDENTITY_ID="$(az identity list -g "$AZURE_RG" --query "[?contains(name, 'runtime')].id | [0]" -o tsv)"
          test -n "$IDENTITY_ID"

          KEYVAULT_URL="https://${VAULT}.vault.azure.net/secrets/${KV_SECRET_NAME}"

          echo "Key Vault: $VAULT"
          echo "Runtime identity: ${IDENTITY_ID##*/}"
          echo "Creating fresh Container App secret reference: $APP_SECRET_NAME"

          # A new Container App secret name forces a fresh Key Vault resolution
          # without GitHub ever reading or exposing the secret value.
          az containerapp secret set \
            -g "$AZURE_RG" \
            -n "$APP" \
            --secrets "$APP_SECRET_NAME=keyvaultref:$KEYVAULT_URL,identityref:$IDENTITY_ID" \
            --only-show-errors >/dev/null

          # Force a new revision and point ADMIN_PASSWORD at the fresh reference.
          az containerapp update \
            -g "$AZURE_RG" \
            -n "$APP" \
            --set-env-vars \
              "ADMIN_PASSWORD=secretref:$APP_SECRET_NAME" \
              "BLOFY_AUTH_REFRESH=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --only-show-errors >/dev/null

          for attempt in {1..36}; do
            READY="$(az containerapp show -g "$AZURE_RG" -n "$APP" --query 'properties.latestReadyRevisionName' -o tsv)"
            LATEST="$(az containerapp show -g "$AZURE_RG" -n "$APP" --query 'properties.latestRevisionName' -o tsv)"
            if [[ -n "$LATEST" && "$READY" == "$LATEST" ]]; then
              echo "Release revision ready: $LATEST"
              break
            fi
            if [[ "$attempt" == 36 ]]; then
              echo 'Latest blofy-releases revision did not become ready in time.' >&2
              exit 1
            fi
            sleep 5
          done

          ENV_SECRET="$(az containerapp show -g "$AZURE_RG" -n "$APP" --query "properties.template.containers[0].env[?name=='ADMIN_PASSWORD'].secretRef | [0]" -o tsv)"
          test "$ENV_SECRET" = "$APP_SECRET_NAME"

          REF_URL="$(az containerapp secret list -g "$AZURE_RG" -n "$APP" --query "[?name=='$APP_SECRET_NAME'].keyVaultUrl | [0]" -o tsv)"
          test "$REF_URL" = "$KEYVAULT_URL"

          echo 'BLOFY Azure release-admin secret refresh passed.'
