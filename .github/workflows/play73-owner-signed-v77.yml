# Owner-only signed APK/AAB from preserved Play73. Never publish to Google Play or the customer website.
# A one-time, branch-only QA GitHub prerelease is allowed only on the explicit opt-in commit.
name: BLOFY Play73 v77 Signed APK and AAB owner-only

on:
  push:
    branches: [fix/play73-v77-catalog-connection-recovery-20261102]
    paths:
      - .github/workflows/play73-owner-signed-v77.yml
      - app/**
      - tools/verify_play_2000073.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: blofy-play73-v77-owner-signed-only
  cancel-in-progress: true

env:
  ACTIVATION_BASE_URL: https://api.blofyplayer.com
  UPDATE_BASE_URL: https://updates.blofyplayer.com
  EXPECTED_APPLICATION_ID: tv.blofy.player.v2
  EXPECTED_VERSION_CODE: "2000077"
  EXPECTED_VERSION_NAME: 2.0.0-rc07.55.9-play73-catalog-recovery
  EXPECTED_CERT_SHA256: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
  MEDIA3_VERSION: "1.6.1"
  ANDROID_NDK_VERSION: 28.0.13004108
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_BUILD_TOOLS_VERSION: 35.0.0
  FFMPEG_DECODERS: ac3 eac3 dca truehd aac mp3 opus vorbis flac

jobs:
  signed-test:
    name: Preserve 73 + FFmpeg + R8 + signed 77 APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Assert actual v73 purple visual baseline is unchanged
        shell: bash
        run: |
          test "$(git hash-object app/src/main/res/drawable/blofy_home_background.xml)" = 435f8ef89e0c2d7179f11d4c8417a14f0ef5d4f1
          test "$(git hash-object app/src/main/java/tv/blofy/player/ui/common/BlofyTvDesign.kt)" = 10543a8cb4b8aead4ead9beeb5f606943c751dd0
      - name: Verify all original Play73 Activity routes are present in successor
        run: python3 tools/verify_play_2000073.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate signed Play73 successor v77 identity and signing inputs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!value:-}" ]] || { echo "::error::Missing $value"; exit 1; }
          done
          grep -Fq 'applicationId = "tv.blofy.player.v2"' app/build.gradle.kts
          grep -Fq 'versionCode = 2000077' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.9-play73-catalog-recovery"' app/build.gradle.kts

      - name: Install Android native and signing toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION"
          command -v ninja >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Robolectric starts BlofyApp; fixtures must never contact customer services.
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            testDebugUnitTest

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-Play73-v77-unit-tests-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Decode and validate production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/blofy-production.keystore"
          clean_b64="$RUNNER_TEMP/blofy-production.b64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > "$clean_b64"
          remainder=$(( $(wc -c < "$clean_b64") % 4 )); if [[ "$remainder" -ne 0 ]]; then printf '%*s' $((4 - remainder)) '' | tr ' ' '=' >> "$clean_b64"; fi
          base64 --decode "$clean_b64" > "$keystore"
          keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          actual="$(keytool -exportcert -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          [[ "$actual" == "$EXPECTED_CERT_SHA256" ]]

      - name: Build Media3 FFmpeg decoder
        shell: bash
        env:
          ENABLED_DECODERS: ${{ env.FFMPEG_DECODERS }}
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          aar="build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          test -s "$aar"
          sha256sum --check "$aar.sha256"

      - name: Build signed Play APK and AAB for owner review only, never publish
        shell: bash
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m
        run: |
          set -euo pipefail
          aar="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_DISTRIBUTION=play \
            -PBLOFY_SECURITY_R8=true \
            -PBLOFY_ACTIVATION_BASE_URL="$ACTIVATION_BASE_URL" \
            -PBLOFY_UPDATE_BASE_URL="$UPDATE_BASE_URL" \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            -PBLOFY_FFMPEG_AAR="$aar" \
            lintRelease assembleRelease bundleRelease

      - name: Verify and stage signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" "$RUNNER_TEMP/badging.txt"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/badging.txt"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          actual="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          [[ "$actual" == "$EXPECTED_CERT_SHA256" ]]
          jarsigner -verify "$aab" >/dev/null
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Eiq "^lib/$abi/lib(ffmpeg|ffmpegJNI).*\\.so$" "$RUNNER_TEMP/apk-files.txt"
          done
          mkdir -p signed-test
          cp "$apk" signed-test/BLOFY-PLAYER-v77-Play73-OWNER-SIGNED.apk
          cp "$aab" signed-test/BLOFY-PLAYER-v77-Play73-OWNER-SIGNED.aab
          cp "$RUNNER_TEMP/badging.txt" signed-test/apk-badging.txt
          cp "$RUNNER_TEMP/signature.txt" signed-test/apk-signature.txt
          {
            echo "version=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "commit=$GITHUB_SHA"
            echo "activation=$ACTIVATION_BASE_URL"
            echo "updates=$UPDATE_BASE_URL"
            echo "production_signed=true"
            echo "r8=true"
            echo "ffmpeg=true"
            echo "published=false"
            echo "source=play73-preservation-branch"
            echo "owner_only=true"
          } > signed-test/build-info.txt
          (cd signed-test && sha256sum *.apk *.aab > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-v77-Play73-OWNER-SIGNED-${{ github.sha }}
          path: signed-test/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK only for QA installation
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-v77-Play73-OWNER-SIGNED-APK-${{ github.sha }}
          path: signed-test/BLOFY-PLAYER-v77-Play73-OWNER-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

      # Only this explicitly requested QA commit can publish a direct APK link.
      # The release is a GitHub prerelease, NOT a Google Play/website deployment.
      - name: Publish verified v77 owner APK as one-time GitHub QA prerelease
        if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(v77): enable one-time QA prerelease') }}"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="signed-test/BLOFY-PLAYER-v77-Play73-OWNER-SIGNED.apk"
          test -s "$apk"
          (cd signed-test && sha256sum --check SHA256SUMS)
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/release-badging.txt"
          grep -Fq "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" "$RUNNER_TEMP/release-badging.txt"
          "$tools/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          "$tools/apksigner" verify --verbose "$apk"
          actual="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          [[ "$actual" == "$EXPECTED_CERT_SHA256" ]]
          unzip -tqq "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/v77-apk-entries.txt"
          grep -Fxq 'AndroidManifest.xml' "$RUNNER_TEMP/v77-apk-entries.txt"
          grep -Fxq 'classes.dex' "$RUNNER_TEMP/v77-apk-entries.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Eiq "^lib/$abi/lib(ffmpeg|ffmpegJNI).*\\.so$" "$RUNNER_TEMP/v77-apk-entries.txt"
          done
          # A successful signed build is not enough: require CI, native FFmpeg,
          # and the v77 QA workflow (which includes the Android TV9 D-pad job)
          # to pass for this EXACT commit before making the prerelease visible.
          for attempt in $(seq 1 24); do
            runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$GITHUB_SHA" -f per_page=100)"
            missing=0
            for name in 'BLOFY Android CI' 'BLOFY FFmpeg Native' 'BLOFY Google Play 73 restoration – v77 QA (NOT publication)'; do
              if ! jq -e --arg name "$name" --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .conclusion == "success")] | length > 0' >/dev/null <<< "$runs"; then
                echo "Waiting for successful $name on $GITHUB_SHA"
                missing=1
              fi
            done
            [[ "$missing" == 0 ]] && break
            [[ "$attempt" -lt 24 ]] || { echo "::error::CI/FFmpeg/TV9 QA gates did not pass on exact commit"; exit 1; }
            sleep 15
          done
          (cd signed-test && sha256sum BLOFY-PLAYER-v77-Play73-OWNER-SIGNED.apk > BLOFY-PLAYER-v77-Play73-OWNER-SIGNED.apk.sha256)
          tag="blofy-v77-play73-owner-qa-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "QA prerelease already exists: $tag"
            exit 0
          fi
          cat > "$RUNNER_TEMP/v77-qa-release-notes.md" <<EOF
          BLOFY PLAYER v77 / Play73-preserving owner-signed QA build.

          - Source commit: $GITHUB_SHA
          - Android versionCode: $EXPECTED_VERSION_CODE
          - Signing certificate SHA-256: $EXPECTED_CERT_SHA256
          - Activation: $ACTIVATION_BASE_URL
          - Updates: $UPDATE_BASE_URL
          - Passed: Android CI, FFmpeg Native, v77 QA, Android TV9 D-pad, signed APK/AAB verification.
          - This is a GitHub-only prerelease for the owner's device testing. NOT Google Play or the customer website.
          - The actual cause of the upstream provider's "connection closed" at 28% is not yet proven. Test on the owner's physical device before treating the issue as fixed.
          EOF
          gh release create "$tag" "$apk" "signed-test/BLOFY-PLAYER-v77-Play73-OWNER-SIGNED.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "BLOFY PLAYER v77 Play73 Owner QA (${GITHUB_SHA:0:12})" \
            --notes-file "$RUNNER_TEMP/v77-qa-release-notes.md" \
            --prerelease --latest=false
