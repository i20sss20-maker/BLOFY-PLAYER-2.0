name: Cancel superseded rc07.41 fixture builds
on:
  push:
    branches: [fix/cancel-duplicate-rc0741]
    paths: ['.github/workflows/cancel-duplicate-rc0741.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel-exact-superseded-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only superseded builds after verifying the corrected candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO" = i20sss20-maker/BLOFY-PLAYER-2.0
          test "$(gh api "repos/$REPO/git/ref/heads/rc07-runtime-recovery" --jq .object.sha)" = 60daaa00b35f42e7d0fc7b9bf91cf4ed4a9e0bc1
          for id in 34725246277 34725250733; do
            gh api "repos/$REPO/actions/runs/$id" > "$RUNNER_TEMP/superseded.json"
            python3 - "$RUNNER_TEMP/superseded.json" <<'PY'
          import json,sys
          run=json.load(open(sys.argv[1]))
          assert run['head_sha']=='616fd18bb87f11bc433d5828be10544d3ee63ec2'
          assert run['workflow_id']==349395134 and run['head_branch']=='rc07-runtime-recovery'
          PY
            state="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/superseded.json")"
            if test "$state" != completed; then gh api --method POST "repos/$REPO/actions/runs/$id/cancel"; fi
          done
          echo 'Superseded test-fixture builds stopped. The corrected candidate and existing public release are untouched.'
