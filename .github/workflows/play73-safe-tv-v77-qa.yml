name: BLOFY Google Play 73 restoration – v77 QA (NOT publication)
on:
  push:
    branches: [fix/play73-v77-catalog-connection-recovery-20261102]
  pull_request:
    branches: [baseline/actual-signed-play73-20261102]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blofy-play73-v77-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preserve-approved-73:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard the REAL signed owner v73 source theme and Xtream engine against changes
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            actual="$(git hash-object "$1")"
            if [[ "$actual" != "$2" ]]; then echo "::error file=$1::Approved 73 baseline changed" >&2; exit 1; fi
          }
          check_blob app/src/main/res/drawable-nodpi/blofy_logo.png 8a84b6b7d65f494e13e26c687fe0a980a664e208
          check_blob app/src/main/res/drawable/blofy_home_background.xml 435f8ef89e0c2d7179f11d4c8417a14f0ef5d4f1
          check_blob app/src/main/java/tv/blofy/player/ui/common/BlofyTvDesign.kt 10543a8cb4b8aead4ead9beeb5f606943c751dd0
          check_blob app/src/main/java/tv/blofy/player/data/PlaylistManager.kt e78cb30c615d2089455a169a6f347543d7486384
          check_blob app/src/main/java/tv/blofy/player/data/remote/XtreamClient.kt b0b13e558b2282713c639ed72b713a383907f004
          grep -Fq 'applicationId = "tv.blofy.player.v2"' app/build.gradle.kts
          grep -Fq 'versionCode = 2000077' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.9-play73-catalog-recovery"' app/build.gradle.kts
          python3 - <<'PY'
          import pathlib, struct
          for name, expected in [
            ('app/src/main/res/drawable-xhdpi/blofy_tv_banner.png', (320,180)),
            ('app/src/main/res/mipmap-nodpi/blofy_tv_icon.png', (512,512)),
          ]:
            data=pathlib.Path(name).read_bytes()
            assert data[:8]==b'\x89PNG\r\n\x1a\n', name
            assert struct.unpack('>II',data[16:24])==expected, name
          PY
          test ! -e app/src/main/res/drawable/blofy_tv_banner.xml

  compile-and-test:
    needs: preserve-approved-73
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Run full test, lint and compile independent review APK
        run: |
          set -euo pipefail
          # Keep unit tests off the customer service, but NEVER ship that offline fixture URL in the owner APK.
          gradle --no-daemon --max-workers=2 -PBLOFY_DISTRIBUTION=play -PBLOFY_TV_QA=true -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 testDebugUnitTest
          # Package owner's QA build with real Railway activation/updates origins.
          gradle --no-daemon --max-workers=2 -PBLOFY_DISTRIBUTION=play -PBLOFY_TV_QA=true -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com lintDebug assembleDebug assembleDebugAndroidTest
          mkdir -p app/build/outputs/apk/debug
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/owner-qa-badging.txt
          grep -Fq "package: name='tv.blofy.player.v2.qa' versionCode='2000077'" app/build/outputs/apk/debug/owner-qa-badging.txt
          printf 'build=Play73-preserving-v77-owner-QA\\napp_id=tv.blofy.player.v2.qa\\nactivation=https://api.blofyplayer.com\\nupdates=https://updates.blofyplayer.com\\nproduction_update=false\\n' > app/build/outputs/apk/debug/owner-qa-build-info.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/owner-qa-SHA256SUMS
      - name: Upload owner-only QA APK (never replace Play installation)
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-Play73-restored-v77-QA-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/owner-qa-build-info.txt
            app/build/outputs/apk/debug/owner-qa-badging.txt
            app/build/outputs/apk/debug/owner-qa-SHA256SUMS
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 14

  android-tv-9-dpad:
    needs: compile-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test real TV remote focus and launcher assets on Android TV 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            gradle --no-daemon -PBLOFY_DISTRIBUTION=play -PBLOFY_TV_QA=true -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class tv.blofy.player.ui.AndroidTvReviewDpadTest -e tvReview true tv.blofy.player.v2.qa.test/androidx.test.runner.AndroidJUnitRunner | tee tv73-dpad.txt
            grep -q 'OK (2 tests)' tv73-dpad.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BLOFY-Play73-AndroidTV9-DPAD-${{ github.sha }}
          path: tv73-dpad.txt
          if-no-files-found: ignore
