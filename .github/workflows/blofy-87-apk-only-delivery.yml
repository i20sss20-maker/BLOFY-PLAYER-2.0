name: BLOFY 87 signed APK single-file verified delivery
on:
  push:
    branches: [chore/blofy-87-apk-only-delivery-20261104]
    paths:
      - .github/workflows/blofy-87-apk-only-delivery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official previously verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download 41778439947 --repo "$GITHUB_REPOSITORY" \
            --name BLOFY-55-8-10-2000087-APK-AAB-OWNER-SIGNED --dir payload
      - name: Validate original signed identity and exact APK checksum
        run: |
          set -euo pipefail
          apk=payload/BLOFY-PLAYER-55.8.10-2000087-SIGNED.apk
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          grep -Fq 'VersionCode=2000087' payload/BUILD_INFO.txt
          grep -Fq 'Package=tv.blofy.player.v2' payload/BUILD_INFO.txt
          grep -Fq 'Signed=true' payload/BUILD_INFO.txt
          grep -Fq 'OriginalSignatureSha256=C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E' payload/BUILD_INFO.txt
          expected="$(grep 'BLOFY-PLAYER-55.8.10-2000087-SIGNED.apk' payload/SHA256SUMS | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$(sha256sum "$apk" | awk '{print $1}')"
      - name: Upload official signed APK only, no huge AAB
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-87-OWNER-SIGNED-APK-ONLY
          path: payload/BLOFY-PLAYER-55.8.10-2000087-SIGNED.apk
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
