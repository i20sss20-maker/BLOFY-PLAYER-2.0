name: BLOFY Production Smoke
# current verified production gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blofy-production-smoke
  cancel-in-progress: true

env:
  ACTIVATION_BASE_URL: https://api.blofyplayer.com
  PORTAL_BASE_URL: https://blofyplayer.com
  UPDATE_BASE_URL: https://updates.blofyplayer.com

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify BLOFY production endpoints
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/blofy-smoke"
          mkdir -p "$tmp"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "$ACTIVATION_BASE_URL/health" > "$tmp/api.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "$PORTAL_BASE_URL/health" > "$tmp/root.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "$UPDATE_BASE_URL/health" > "$tmp/updates.json"

          python3 - "$tmp/api.json" "$tmp/root.json" "$tmp/updates.json" <<'PY'
          import json, sys

          api=json.load(open(sys.argv[1],encoding='utf-8'))
          root=json.load(open(sys.argv[2],encoding='utf-8'))
          updates=json.load(open(sys.argv[3],encoding='utf-8'))

          for name,payload in (('api',api),('root',root)):
              assert payload.get('ok') is True, f'{name}: ok != true'
              assert payload.get('database') == 'ready', f'{name}: database not ready'
              assert payload.get('playlistEncryption') == 'ready', f'{name}: playlist encryption not ready'

          assert updates.get('ok') is True, 'updates: ok != true'

          api_app=(api.get('release') or {}).get('app') or {}
          root_app=(root.get('release') or {}).get('app') or {}
          update_app=(updates.get('release') or {}).get('app') or {}

          for app in (api_app,root_app,update_app):
              assert int(app.get('versionCode',0)) > 0
              assert str(app.get('versionName') or '')
              assert str(app.get('downloadUrl') or '').startswith(
                  'https://github.com/i20sss20-maker/BLOFY-PLAYER-2.0/releases/download/'
              )

          expected=(update_app['versionCode'],update_app['versionName'],update_app['downloadUrl'])
          assert (api_app['versionCode'],api_app['versionName'],api_app['downloadUrl']) == expected
          assert (root_app['versionCode'],root_app['versionName'],root_app['downloadUrl']) == expected

          print('BLOFY production smoke OK')
          print('activation=ready')
          print('portal=ready')
          print(f"update={update_app['versionName']} ({update_app['versionCode']})")
          print(f"download={update_app['downloadUrl']}")
          PY

      - name: Verify public portal and stable updater URL
        shell: bash
        run: |
          set -euo pipefail
          portal="$RUNNER_TEMP/blofy-portal.html"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "$PORTAL_BASE_URL/" > "$portal"
          grep -Eiq 'BLOFY|بلوفي' "$portal"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 45 --range 0-0 --output /dev/null \
            "$UPDATE_BASE_URL/download/latest.apk"

      - name: Verify active GitHub release asset is reachable
        shell: bash
        run: |
          set -euo pipefail
          release_url="$(curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "$UPDATE_BASE_URL/health" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['release']['app']['downloadUrl'])")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 45 --range 0-0 --output /dev/null "$release_url"
