name: BLOFY STREAM 55.8.15 - Smart Playback 2.0 isolated QA
on:
  push:
    branches:
      - qa/stream-55-8-15-smart-playback-20261112
    paths:
      - 'app/**'
      - '.github/workflows/stream-55-8-15-smart-playback-qa.yml'
      - 'tools/stream-audio-device-qa.py'
      - 'tools/test_stream_audio_device_qa.py'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/stream-55-8-15-smart-playback-qa.yml'
      - 'tools/stream-audio-device-qa.py'
      - 'tools/test_stream_audio_device_qa.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smart-playback-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify isolated version and fail-closed media behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000092' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.8.15"' app/build.gradle.kts
          grep -Fq 'applicationIdSuffix = ".stream.qa"' app/build.gradle.kts
          grep -Fq 'selectedUnsupported = selectedUnsupported' app/src/main/java/tv/blofy/player/ui/player/PlayerActivity.kt
          grep -Fq 'manualSelection = manualAudioContentKey == currentContentKey' app/src/main/java/tv/blofy/player/ui/player/PlayerActivity.kt
          grep -Fq 'PlaybackRecoveryPolicy.isSourceAdmissionRefusal(responseStatus)' app/src/main/java/tv/blofy/player/core/playback/BlofyPlaybackSession.kt
          grep -Fq 'httpStatus == 456' app/src/main/java/tv/blofy/player/core/playback/PlaybackRecoveryPolicy.kt
      - name: Verify sanitized Android 9 device evidence tooling
        shell: bash
        run: |
          python3 tools/test_stream_audio_device_qa.py
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Run SDK28 audio and source connection safety regression tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeDemoUnitTest \
            --tests 'tv.blofy.player.core.diagnostics.StreamAudioRecoveryPolicyTest' \
            --tests 'tv.blofy.player.core.diagnostics.StreamAudioHealthTest' \
            --tests 'tv.blofy.player.core.playback.PlaybackRecoveryPolicyTest' \
            --tests 'tv.blofy.player.core.diagnostics.StreamConnectionDiagnosticsTest'
      - name: Build separate APK for owner QA, never a signed customer release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            assembleStreamCodeDemo
          APK=app/build/outputs/apk/streamCodeDemo/app-streamCodeDemo.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/qa-identity.txt"
          grep -Fq "name='tv.blofy.player.v2.stream.qa'" "$RUNNER_TEMP/qa-identity.txt"
          grep -Fq "versionCode='2000092'" "$RUNNER_TEMP/qa-identity.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/qa-hash.txt"
          {
            echo '### BLOFY STREAM 55.8.15 Smart Playback 2.0 QA'
            echo '- Distinct debug QA package: tv.blofy.player.v2.stream.qa'
            echo '- Candidate versionCode: 2000092; does not update 55.8.14 installed owners.'
            echo '- Recover supported audio when Android 9 selected an unsupported track.'
            echo '- Respect manual track, muted playback, disabled audio and one-time recovery.'
            echo '- No retry or alternate-provider request for 401, 403, 429 or 456.'
            echo '- Signed owner APK: **NOT created**.'
            echo '- Real Android TV audibility and actual source rights: **NOT verified**.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload private temporary debug QA APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.15-SMART-PLAYBACK-OWNER-QA-${{ github.sha }}
          path: |
            app/build/outputs/apk/streamCodeDemo/*.apk
            app/build/test-results/testStreamCodeDemoUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
