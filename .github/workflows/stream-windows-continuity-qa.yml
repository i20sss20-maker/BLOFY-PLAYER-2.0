name: BLOFY STREAM Windows - long-running playback QA
on:
  push:
    branches:
      - qa/windows-stream-continuous-playback-20261112
    paths:
      - 'windows/**'
      - '.github/workflows/stream-windows-continuity-qa.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/stream-windows-continuity-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuous-playback:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test long-running media forwarding and bounded idle failover
        shell: pwsh
        run: |
          dotnet run --project windows/tests/StreamMediaCopyChecks/StreamMediaCopyChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Windows BLOFY STREAM code-only WPF application
        shell: pwsh
        run: |
          dotnet restore windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable x64 QA test only (no installer/publication)
        shell: pwsh
        run: |
          dotnet publish windows/src/BlofyPlayer.Windows/BlofyPlayer.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -o windows/qa-portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'windows/qa-portable/BLOFY STREAM.exe')) { throw 'STREAM Windows x64 binary missing' }
      - name: Upload temporary QA files, not a signed customer release
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-Windows-continuity-QA-${{ github.sha }}
          path: windows/qa-portable/
          retention-days: 7
          if-no-files-found: error
