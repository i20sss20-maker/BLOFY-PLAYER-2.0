name: BLOFY RC06 Signed Release

on:
  push:
    branches: [main]
    paths:
      - docs/RC06_RELEASE_READY
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blofy-rc06-signed-release
  cancel-in-progress: false

env:
  PRODUCTION_ACTIVATION_BASE_URL: https://blofy-player-2-0.vercel.app
  EXPECTED_APPLICATION_ID: tv.blofy.player.v2
  EXPECTED_VERSION_CODE: "2000007"
  EXPECTED_VERSION_NAME: 2.0.0-rc06
  EXPECTED_CERT_SHA256: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
  MEDIA3_VERSION: "1.6.1"
  FFMPEG_VERSION: n6.0
  FFMPEG_DECODERS: ac3 eac3 dca truehd aac mp3 opus vorbis flac
  ANDROID_NDK_VERSION: 28.0.13004108
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_BUILD_TOOLS_VERSION: 35.0.0

jobs:
  signed-release:
    name: Verify + FFmpeg + signed APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate rc06 and signing inputs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!value:-}" ]] || { echo "::error::Missing $value"; exit 1; }
          done
          [[ "$EXPECTED_CERT_SHA256" =~ ^[0-9A-F]{64}$ ]] || { echo "::error::Invalid certificate SHA-256"; exit 1; }
          grep -Fq 'versionCode = 2000007' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc06"' app/build.gradle.kts
          grep -Fq 'applicationId = "tv.blofy.player.v2"' app/build.gradle.kts

      - name: Install Android native and signing toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Decode and validate permanent production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/blofy-production.keystore"
          clean_b64="$RUNNER_TEMP/blofy-production.b64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > "$clean_b64"
          test -s "$clean_b64"
          remainder=$(( $(wc -c < "$clean_b64") % 4 ))
          if [[ "$remainder" -ne 0 ]]; then
            printf '%*s' $((4 - remainder)) '' | tr ' ' '=' >> "$clean_b64"
          fi
          base64 --decode "$clean_b64" > "$keystore"
          rm -f "$clean_b64"
          test -s "$keystore"
          keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          actual="$(keytool -exportcert -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          [[ "$actual" == "$EXPECTED_CERT_SHA256" ]] || { echo "::error::Production certificate mismatch"; exit 1; }

      - name: Verify production activation health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 20 \
            "$PRODUCTION_ACTIVATION_BASE_URL/health" > "$RUNNER_TEMP/health.json"
          python3 - "$RUNNER_TEMP/health.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              payload=json.load(f)
          if not (payload.get('ok') is True and payload.get('database') == 'ready' and payload.get('playlistEncryption') == 'ready'):
              raise SystemExit('Production activation health gate failed')
          PY

      - name: Build Media3 FFmpeg decoder
        shell: bash
        env:
          ENABLED_DECODERS: ${{ env.FFMPEG_DECODERS }}
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          aar="build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          test -s "$aar"
          sha256sum --check "$aar.sha256"

      - name: Run unit catalog tests, lint, and build signed release
        shell: bash
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          aar="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          gradle --no-daemon \
            -PBLOFY_ACTIVATION_BASE_URL="$PRODUCTION_ACTIVATION_BASE_URL" \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            -PBLOFY_FFMPEG_AAR="$aar" \
            testDebugUnitTest lintRelease assembleRelease bundleRelease

      - name: Verify package, version, signature, alignment and FFmpeg ABIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          out_apk="release/BLOFY-PLAYER-2.0-rc06.apk"
          out_aab="release/BLOFY-PLAYER-2.0-rc06.aab"
          cp "$apk" "$out_apk"
          cp "$aab" "$out_aab"
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"

          "$tools/aapt" dump badging "$out_apk" | tee release/apk-badging.txt
          grep -Fq "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" release/apk-badging.txt
          "$tools/zipalign" -c -P 16 -v 4 "$out_apk"
          "$tools/apksigner" verify --verbose --print-certs "$out_apk" | tee release/apk-signature.txt
          actual="$("$tools/apksigner" verify --print-certs "$out_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          [[ "$actual" == "$EXPECTED_CERT_SHA256" ]] || { echo "::error::APK certificate mismatch"; exit 1; }

          jarsigner -verify -certs "$out_aab" | tee release/aab-signature.txt
          unzip -Z1 "$out_apk" > "$RUNNER_TEMP/apk-files.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Eiq "^lib/$abi/lib(ffmpeg|ffmpegJNI).*\\.so$" "$RUNNER_TEMP/apk-files.txt"
          done
          (cd release && sha256sum BLOFY-PLAYER-2.0-rc06.apk BLOFY-PLAYER-2.0-rc06.aab > SHA256SUMS && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-rc06-signed-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/blofy-production.keystore" "$RUNNER_TEMP/blofy-production.b64"