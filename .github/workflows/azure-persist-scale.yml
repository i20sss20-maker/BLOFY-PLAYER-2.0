name: BLOFY Persist Azure Scale

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-persist-scale.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Persist min replicas in managed Bicep and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('infra/azure/managed/main.bicep')
          text = p.read_text(encoding='utf-8')
          count = text.count('minReplicas: 0')
          if count != 3:
              raise SystemExit(f'Expected exactly 3 minReplicas: 0 entries, found {count}')
          p.write_text(text.replace('minReplicas: 0', 'minReplicas: 1'), encoding='utf-8')
          PY

          git rm .github/workflows/azure-keep-warm.yml .github/workflows/azure-persist-scale.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infra/azure/managed/main.bicep
          git diff --cached --check
          test "$(git diff --cached --numstat infra/azure/managed/main.bicep | awk '{print $1+$2}')" = "6"
          git commit -m 'infra(azure): keep production services warm'
          git push origin HEAD:main
