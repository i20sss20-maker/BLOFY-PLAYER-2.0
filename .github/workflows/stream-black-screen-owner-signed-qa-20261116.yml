name: BLOFY STREAM 55.8.30 TV Remote Navigation Owner QA
# Require proven TV voice shortcuts, source failure classifier, clock-independent status and same-SHA QA before owner signing.
on:
  push:
    branches:
      - fix/stream-live-panel-focus-blofy-brand-20261116
    paths:
      - '.github/workflows/stream-black-screen-owner-signed-qa-20261116.yml'
      - 'app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt'
      - 'app/src/main/java/tv/blofy/player/ui/browser/LiveChannelAdapter.kt'
      - 'app/src/main/java/tv/blofy/player/ui/player/StreamArabicAudioCatalog.kt'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stream-black-screen-owner-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-stream-owner-qa:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    env:
      EXPECTED_CERT: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
      ANDROID_NDK_VERSION: '28.0.13004108'
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android native FFmpeg build tools
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000107' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.8.30"' app/build.gradle.kts
          # Require the specific panel implementation, not the previous detached HUD.
          grep -Fq 'val actions = buildAttachedActions' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'ownerBrandReplacesOnlyVisibleAnesLabelsAndKeepsAudioIds' app/src/test/java/tv/blofy/player/ui/player/StreamAnisAudioCatalogTest.kt
          grep -Fq 'highContrast = true' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'keyCode == KeyEvent.KEYCODE_DPAD_RIGHT' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'keyCode == KeyEvent.KEYCODE_DPAD_LEFT && !audioPickerOpen' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq '.replace("أنيس", "بلوفي")' app/src/main/java/tv/blofy/player/ui/player/StreamArabicAudioCatalog.kt
          grep -Fq 'unifiedChannelPanel = BuildConfig.CODE_ONLY_LOGIN' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'LiveChannelPanelPolicyTest' .github/workflows/stream-anis-audio-inapp-qa-20261115.yml
          grep -Fq 'LiveChannelTab.FAVORITES' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'LiveChannelTab.RECENT' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'showCurrentLiveEpg()' app/src/main/java/tv/blofy/player/ui/player/PlayerActivity.kt
          grep -Fq 'showCurrentLiveDiagnostics()' app/src/main/java/tv/blofy/player/ui/player/PlayerActivity.kt
          grep -Fq 'LiveChannelPanelAction.BLOFY_AUDIO' app/src/main/java/tv/blofy/player/ui/player/LiveChannelPanelPolicy.kt
          grep -Fq 'StreamArabicAudioCatalog.Failure.NO_ENDPOINT' app/src/main/java/tv/blofy/player/ui/player/PlayerActivity.kt
          grep -Fq 'return scroller' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          # Regression gate: no nested group/file picker when using the LIVE sidebar.
          grep -Fq 'showInlineArabicVoices(' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'activity.playInlineArabicAudio(voice)' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'ViewGroup.LayoutParams.MATCH_PARENT, dp(154)' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'val isAudible: Boolean' app/src/main/java/tv/blofy/player/ui/player/StreamArabicAudioSession.kt
          grep -Fq 'StreamAudioQuickPickPolicyTest' .github/workflows/stream-anis-audio-inapp-qa-20261115.yml
          grep -Fq 'StreamAudioQuickPickPrefs.toggleFavorite' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'StreamAudioQuickPickPrefs.markStarted' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'StreamAudioQuickPickPrefs.markFailed' app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt
          grep -Fq 'SystemClock.elapsedRealtime()' app/src/main/java/tv/blofy/player/ui/player/StreamAudioQuickPickPrefs.kt
          grep -Fq 'classify(error)' app/src/main/java/tv/blofy/player/ui/player/StreamArabicAudioSession.kt
          grep -Fq '18_000L' app/src/main/java/tv/blofy/player/ui/player/StreamArabicAudioSession.kt
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION" 'cmake;3.22.1'
          if ! command -v ninja >/dev/null; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Build licensed Media3 FFmpeg decoder for ARM and x86
        shell: bash
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          test -s build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar
          grep -Fxq 'config_gpl=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'config_nonfree=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'config_version3=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'page_size_compatible=16384' build/ffmpeg-native/build-info.txt
      - name: Run STREAM local playback regression before signing
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'LIVE_FIRST_FRAME_TIMEOUT_MS = 16_000L' app/src/main/java/tv/blofy/player/core/playback/BlofyPlaybackSession.kt
          grep -Fq 'noFirstFrameRecoveries == MAX_NO_FIRST_FRAME_RECOVERIES' app/src/main/java/tv/blofy/player/core/playback/BlofyPlaybackSession.kt
          gradle --no-daemon --max-workers=2 -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 testDebugUnitTest
      - name: Sign owner-only full STREAM 55.8.30 with black screen fix
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!required:-}" || { echo "::error::Signing credential unavailable: $required"; exit 1; }
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > "$RUNNER_TEMP/blofy-production.b64"
          base64 -d "$RUNNER_TEMP/blofy-production.b64" > "$BLOFY_RELEASE_KEYSTORE_PATH"
          test -s "$BLOFY_RELEASE_KEYSTORE_PATH"
          cert="$(keytool -exportcert -keystore "$BLOFY_RELEASE_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$cert" = "$EXPECTED_CERT" || { echo "::error::Original STREAM owner certificate mismatch"; exit 1; }
          gradle --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar" \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            validateReleaseConfiguration assembleStreamCodeOnly
      - name: Verify full Android identity, real signing certificate and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/streamCodeOnly/app-streamCodeOnly.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/stream-badging.txt"
          grep -Fq "name='tv.blofy.player.v2.stream' versionCode='2000107' versionName='2.0.0-rc07.55.8.30-STREAM'" "$RUNNER_TEMP/stream-badging.txt"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/stream-badging.txt"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-cert.txt" | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$cert" = "$EXPECTED_CERT"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/entries.txt"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libffmpegJNI.so" "$RUNNER_TEMP/entries.txt"
          done
          mkdir -p build/owner-qa
          name="BLOFY-STREAM-55.8.30-TV-NAV-OWNER-SIGNED.apk"
          cp "$apk" "build/owner-qa/$name"
          (cd build/owner-qa && sha256sum "$name" > SHA256SUMS && sha256sum -c SHA256SUMS)
          printf 'app_id=tv.blofy.player.v2.stream\nversion_code=2000107\nversion_name=2.0.0-rc07.55.8.30-STREAM\nsource_commit=%s\nchannel=private-owner-qa\n' "$GITHUB_SHA" > build/owner-qa/BUILD-IDENTITY.txt
          echo "Owner-signed full STREAM 55.8.30 APK verified; NOT published to customers." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full owner-signed APK for private testing only
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.30-TV-NAV-OWNER-SIGNED-${{ github.sha }}
          path: build/owner-qa/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/blofy-production.keystore" "$RUNNER_TEMP/blofy-production.b64"
