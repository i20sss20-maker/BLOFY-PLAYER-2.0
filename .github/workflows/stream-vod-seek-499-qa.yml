name: BLOFY STREAM VOD range seek-storm QA (no production)
on:
  push:
    branches: [qa/stream-vod-seek-abort-storm-20261123]
    paths:
      - 'app/src/main/java/tv/blofy/player/ui/player/PlayerActivity.kt'
      - 'app/src/main/java/tv/blofy/player/ui/player/VodSeekBurstPolicy.kt'
      - 'app/src/main/java/tv/blofy/player/core/playback/BlofyPlaybackSession.kt'
      - 'app/src/test/java/tv/blofy/player/ui/player/VodSeekBurstPolicyTest.kt'
      - 'app/src/test/java/tv/blofy/player/core/playback/PlaybackSessionReleaseTest.kt'
      - '.github/workflows/stream-vod-seek-499-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-stream-safe-vod:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install supported SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Run whole STREAM unit regression with no external hosts
        run: |
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeOnlyUnitTest
      - name: Build isolated STREAM demo without owner signing secrets
        run: |
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            assembleStreamCodeDemo
          apk="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "name='tv.blofy.player.v2.stream' versionCode='2000119'"
      - name: Save no-secrets QA reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blofy-stream-vod-499-qa-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
