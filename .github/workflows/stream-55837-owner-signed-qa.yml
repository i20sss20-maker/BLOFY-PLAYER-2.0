name: BLOFY STREAM 55.8.37 owner-signed episode freshness QA
on:
  push:
    branches:
      - fix/stream-55837-episodes-auto-refresh-20261118
    paths:
      - '.github/workflows/stream-55837-owner-signed-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-55837-owner-only-signing
  cancel-in-progress: false

jobs:
  sign-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    env:
      EXPECTED_CERT: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
      NDK_VERSION: '28.0.13004108'
      TOOL_VERSION: '35.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify isolated STREAM 55.8.37 identity and episode safeguards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000114' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.8.37"' app/build.gradle.kts
          grep -Fq 'SUCCESS_GAP_MS = 3L * 60_000L' app/src/main/java/tv/blofy/player/ui/series/SeriesEpisodeRefreshPolicy.kt
          grep -Fq 'visibleEpisodeRefreshJob?.cancel()' app/src/main/java/tv/blofy/player/ui/series/EpisodesActivity.kt
          grep -Fq 'preserveCachedRows = true' app/src/main/java/tv/blofy/player/ui/series/EpisodesActivity.kt
          grep -Fq 'class SeriesEpisodeRefreshPolicyTest' app/src/test/java/tv/blofy/player/ui/series/SeriesEpisodeRefreshPolicyTest.kt
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;$TOOL_VERSION" "ndk;$NDK_VERSION" 'cmake;3.22.1'
          if ! command -v ninja >/dev/null; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Test code-only episodic refresh and catalog safety
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeOnlyUnitTest --tests 'tv.blofy.player.ui.series.SeriesEpisodeRefreshPolicyTest'
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeOnlyUnitTest --tests 'tv.blofy.player.data.SeriesEpisodeRetentionPolicyTest'
      - name: Build pinned non-GPL Media3 decoder
        shell: bash
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          aar=build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar
          test -s "$aar"
          grep -Fxq 'config_gpl=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'config_nonfree=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'page_size_compatible=16384' build/ffmpeg-native/build-info.txt
      - name: Build original-owner-signed STREAM APK for private device QA
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-stream-qa.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!required:-}" || { echo "Signing input unavailable: $required"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$BLOFY_RELEASE_KEYSTORE_PATH"
          test -s "$BLOFY_RELEASE_KEYSTORE_PATH"
          cert="$(keytool -exportcert -keystore "$BLOFY_RELEASE_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$cert" = "$EXPECTED_CERT" || { echo "Owner certificate mismatch"; exit 1; }
          gradle --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m" \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar" \
            validateReleaseConfiguration assembleStreamCodeOnly
          rm -f "$BLOFY_RELEASE_KEYSTORE_PATH"
      - name: Verify package upgrade identity and exact owner signing
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/streamCodeOnly/app-streamCodeOnly.apk
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/$TOOL_VERSION"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/stream-badging.txt"
          grep -Fq "name='tv.blofy.player.v2.stream' versionCode='2000114' versionName='2.0.0-rc07.55.8.37-STREAM'" "$RUNNER_TEMP/stream-badging.txt"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/stream-badging.txt"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/stream-cert.txt"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/stream-cert.txt" | head -1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$cert" = "$EXPECTED_CERT"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/entries.txt"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libffmpegJNI.so" "$RUNNER_TEMP/entries.txt"
          done
          mkdir -p build/owner-qa
          cp "$apk" build/owner-qa/BLOFY-STREAM-55.8.37-EPISODES-OWNER-SIGNED.apk
          (cd build/owner-qa && sha256sum *.apk > SHA256SUMS && sha256sum --check SHA256SUMS)
          printf 'package=tv.blofy.player.v2.stream\nversionCode=2000114\nversionName=2.0.0-rc07.55.8.37-STREAM\ncommit=%s\nowner_signed=true\ncustomer_published=false\n' "$GITHUB_SHA" > build/owner-qa/BUILD_INFO.txt
      - name: Upload private owner-signed APK for TV QA (no public website rollout)
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.37-EPISODES-OWNER-SIGNED-${{ github.sha }}
          path: build/owner-qa/
          if-no-files-found: error
          retention-days: 14
      - name: Delete remaining temporary signing inputs
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/blofy-stream-qa.keystore"
