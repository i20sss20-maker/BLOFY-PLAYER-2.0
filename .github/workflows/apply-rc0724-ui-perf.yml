name: Apply rc07.24 UI and List Performance Fix

on:
  push:
    branches: [rc07-runtime-recovery]
    paths:
      - .github/workflows/apply-rc0724-ui-perf.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc07-runtime-recovery
      - name: Apply focused UI/performance patch
        run: python3 tools/rc0724_ui_perf_patch.py
      - name: Validate patch surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- app/src/main/java/tv/blofy/player/ui/browser/ContentBrowserActivity.kt app/src/main/java/tv/blofy/player/ui/catalog/PosterCatalogActivity.kt
          ! git diff --name-only | grep -E 'core/playback|media3|ffmpeg|PlayerActivity' || { echo 'Playback path changed unexpectedly'; exit 1; }
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/tv/blofy/player/ui/browser/ContentBrowserActivity.kt app/src/main/java/tv/blofy/player/ui/catalog/PosterCatalogActivity.kt
          git commit -m 'fix: space browser UI and speed first catalog render'
          git push origin HEAD:rc07-runtime-recovery
