name: FoXFM redirect-follow radio availability
on:
  push:
    branches: [fix/stream-foxfm-blofy-audio-20261116]
    paths: ['.github/workflows/stream-foxfm-redirect-radio-probe.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check audio signatures after approved radio.foxfm.xyz redirects
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import http from 'node:http';
          const paths=Array.from({length:9},(_,i)=>'http://foxfm.xyz/'+(i+1));
          function fetchSample(url,depth=0){
            return new Promise(resolve=>{
              const req=http.get(url,{timeout:5500,headers:{'user-agent':'BLOFY-STREAM-Audio-Relay/1.0'}},res=>{
                if(res.statusCode===301&&depth===0) {
                  const next=new URL(res.headers.location||'',url);
                  res.destroy();
                  if(next.protocol==='http:'&&next.hostname==='radio.foxfm.xyz'&&!next.search&&!next.username&&/^[/]listen[/][a-z0-9]+[/]stream[0-9]+$/.test(next.pathname)){
                    fetchSample(next.toString(),1).then(resolve);
                  }else resolve({status:301,reason:'redirect_not_approved'});
                  return;
                }
                const status=res.statusCode||0;
                let sample=Buffer.alloc(0);
                res.on('data',b=>{sample=Buffer.concat([sample,b.subarray(0,2048-sample.length)]);if(sample.length>=2048)res.destroy()});
                res.on('close',()=>{
                  const b=sample;
                  const audio=b.subarray(0,3).toString()==='ID3'||b.subarray(0,4).toString()==='OggS'||b.subarray(0,4).toString()==='fLaC'||(b.length>=2&&b[0]===255&&((b[1]&224)===224));
                  const ts=b.length>=377&&b[0]===71&&b[188]===71&&b[376]===71;
                  resolve({status,audio:audio||ts,bytes:b.length,type:String(res.headers['content-type']||'').split(';')[0]});
                });
              });
              req.on('timeout',()=>req.destroy(Error('timeout')));
              req.on('error',e=>resolve({status:0,error:e.code||e.message}));
            });
          }
          for(let i=0;i<paths.length;i++){
            const result=await fetchSample(paths[i]);
            console.log(JSON.stringify({station:i+1,...result}));
          }
          JS
