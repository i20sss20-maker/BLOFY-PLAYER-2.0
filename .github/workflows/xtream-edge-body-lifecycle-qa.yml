name: Xtream edge transport lifecycle QA
on:
  push:
    branches: ['qa/xtream-edge-body-lifecycle-20261129']
    paths:
      - 'services/activation/src/xtream-edge-body-lifecycle.mjs'
      - 'services/activation/test/xtream-edge-body-lifecycle.test.mjs'
      - '.github/workflows/xtream-edge-body-lifecycle-qa.yml'
  pull_request:
    paths:
      - 'services/activation/src/xtream-edge-body-lifecycle.mjs'
      - 'services/activation/test/xtream-edge-body-lifecycle.test.mjs'
      - '.github/workflows/xtream-edge-body-lifecycle-qa.yml'
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test services/activation/test/xtream-edge-body-lifecycle.test.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun test services/activation/test/xtream-edge-body-lifecycle.test.mjs
