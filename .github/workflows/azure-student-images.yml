name: BLOFY Legacy Azure Images (Manual Only)

# Legacy fallback only. Railway is the active BLOFY production platform.
# This workflow must never deploy automatically from main.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: blofy-azure-student-images
  cancel-in-progress: true

env:
  AZURE_RG: ${{ vars.BLOFY_AZURE_RG }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure Container Registry
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_RG"
          ACR="$(az acr list --resource-group "$AZURE_RG" --query '[0].name' -o tsv)"
          test -n "$ACR"
          LOGIN_SERVER="$(az acr show --name "$ACR" --query loginServer -o tsv)"
          echo "acr=$ACR" >> "$GITHUB_OUTPUT"
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Restore ACR network access and login
        shell: bash
        run: |
          set -euo pipefail
          ACR='${{ steps.azure.outputs.acr }}'
          # main.bicep declares the production registry public with the default
          # network action Allow. Re-assert that desired state before a hosted
          # GitHub runner pushes the replacement images.
          az acr update --name "$ACR" --public-network-enabled true --only-show-errors >/dev/null
          az acr login --name "$ACR"

      - name: Build and push BLOFY images
        shell: bash
        run: |
          set -euo pipefail
          REG='${{ steps.azure.outputs.login_server }}'
          TAG='${{ steps.azure.outputs.tag }}'

          docker build -t "$REG/blofy/activation:$TAG" -f services/activation/Dockerfile services/activation
          docker push "$REG/blofy/activation:$TAG"

          docker build -t "$REG/blofy/releases:$TAG" -f services/update-distribution/Dockerfile services/update-distribution
          docker push "$REG/blofy/releases:$TAG"

          docker build -t "$REG/blofy/gateway:$TAG" -f infra/azure/managed/gateway/Dockerfile infra/azure/managed/gateway
          docker push "$REG/blofy/gateway:$TAG"

      - name: Deploy images to existing Container Apps
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null
          REG='${{ steps.azure.outputs.login_server }}'
          TAG='${{ steps.azure.outputs.tag }}'

          # The environment must accept public traffic before an app-level
          # external ingress can be reached from the internet. Internal BLOFY
          # services remain internal; only the gateway has external ingress.
          ENV_NAME="$(az containerapp env list --resource-group "$AZURE_RG" --query '[0].name' -o tsv)"
          test -n "$ENV_NAME"
          az containerapp env update \
            --resource-group "$AZURE_RG" \
            --name "$ENV_NAME" \
            --public-network-access Enabled \
            --only-show-errors >/dev/null

          # Re-assert public ingress explicitly. This changes ingress only and
          # does not create a revision.
          az containerapp ingress update \
            --resource-group "$AZURE_RG" \
            --name blofy-gateway \
            --type external \
            --target-port 8080 \
            --transport auto \
            --allow-insecure false \
            --only-show-errors >/dev/null

          # Internal services remain single revision. The public gateway uses
          # multiple revision mode with an explicit latest=100 route.
          az containerapp revision set-mode \
            --resource-group "$AZURE_RG" \
            --name blofy-gateway \
            --mode multiple \
            --only-show-errors >/dev/null

          az containerapp update --resource-group "$AZURE_RG" --name blofy-activation --image "$REG/blofy/activation:$TAG" --set-env-vars BLOFY_SUBSCRIBER_BOOTSTRAP_URL=https://blofyplayer.com BLOFY_RENEWAL_WHATSAPP=966568941484 --only-show-errors >/dev/null
          az containerapp update --resource-group "$AZURE_RG" --name blofy-releases --image "$REG/blofy/releases:$TAG" --only-show-errors >/dev/null
          az containerapp update --resource-group "$AZURE_RG" --name blofy-gateway --image "$REG/blofy/gateway:$TAG" --only-show-errors >/dev/null

          az containerapp ingress traffic set \
            --resource-group "$AZURE_RG" \
            --name blofy-gateway \
            --revision-weight latest=100 \
            --only-show-errors >/dev/null

      - name: Report deployed revision state
        shell: bash
        run: |
          set -euo pipefail
          ENV_NAME="$(az containerapp env list --resource-group "$AZURE_RG" --query '[0].name' -o tsv)"
          echo '=== managed environment ==='
          az containerapp env show --resource-group "$AZURE_RG" --name "$ENV_NAME" \
            --query '{name:name,internal:properties.vnetConfiguration.internal,staticIp:properties.staticIp,defaultDomain:properties.defaultDomain,publicNetworkAccess:properties.publicNetworkAccess}' \
            -o json || true

          for app in blofy-activation blofy-releases blofy-gateway; do
            echo "=== $app ==="
            az containerapp show --resource-group "$AZURE_RG" --name "$app" \
              --query '{revisionMode:properties.configuration.activeRevisionsMode,external:properties.configuration.ingress.external,targetPort:properties.configuration.ingress.targetPort,transport:properties.configuration.ingress.transport,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName,image:properties.template.containers[0].image,fqdn:properties.configuration.ingress.fqdn,traffic:properties.configuration.ingress.traffic}' \
              -o json || true
            az containerapp revision list --resource-group "$AZURE_RG" --name "$app" \
              --query '[].{name:name,active:properties.active,healthState:properties.healthState,provisioningState:properties.provisioningState,replicas:properties.replicas}' \
              -o table || true
          done

      - name: Verify public gateway
        shell: bash
        run: |
          set -euo pipefail

          dump_diagnostics() {
            echo '--- BLOFY Azure diagnostics ---'
            ENV_NAME="$(az containerapp env list --resource-group "$AZURE_RG" --query '[0].name' -o tsv)"
            az containerapp env show --resource-group "$AZURE_RG" --name "$ENV_NAME" \
              --query '{name:name,internal:properties.vnetConfiguration.internal,staticIp:properties.staticIp,defaultDomain:properties.defaultDomain,publicNetworkAccess:properties.publicNetworkAccess}' \
              -o json || true
            for app in blofy-activation blofy-releases blofy-gateway; do
              echo "=== $app revision state ==="
              az containerapp show --resource-group "$AZURE_RG" --name "$app" \
                --query '{revisionMode:properties.configuration.activeRevisionsMode,external:properties.configuration.ingress.external,targetPort:properties.configuration.ingress.targetPort,transport:properties.configuration.ingress.transport,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName,image:properties.template.containers[0].image,fqdn:properties.configuration.ingress.fqdn,traffic:properties.configuration.ingress.traffic}' \
                -o json || true
              az containerapp revision list --resource-group "$AZURE_RG" --name "$app" \
                --query '[].{name:name,active:properties.active,healthState:properties.healthState,provisioningState:properties.provisioningState,replicas:properties.replicas}' \
                -o table || true
              echo "=== $app recent console logs ==="
              timeout 30s az containerapp logs show --resource-group "$AZURE_RG" --name "$app" --type console --tail 80 2>&1 || true
            done
          }

          FQDN="$(az containerapp show --resource-group "$AZURE_RG" --name blofy-gateway --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$FQDN"
          BASE="https://$FQDN"
          echo "Gateway URL: $BASE"

          ready=false
          for attempt in $(seq 1 36); do
            code="$(curl -sS --max-time 10 -o /tmp/blofy-health.json -w '%{http_code}' "$BASE/health" || true)"
            if [ "$code" = '200' ]; then
              ready=true
              break
            fi
            echo "health attempt $attempt/36 -> HTTP ${code:-curl-error}"
            sleep 5
          done

          if [ "$ready" != true ]; then
            echo 'Gateway health did not become ready in time.' >&2
            [ -s /tmp/blofy-health.json ] && { echo 'Last health response:'; cat /tmp/blofy-health.json; echo; } || true
            dump_diagnostics
            exit 1
          fi

          curl -fsS --max-time 10 "$BASE/release.json" >/tmp/blofy-release.json
          curl -fsS --max-time 10 "$BASE/" >/tmp/blofy-home.html

          for path in /d/blofy /d/just-player /d/vlc; do
            direct_ok=false
            for attempt in 1 2 3; do
              echo "direct APK check $path attempt $attempt/3"
              headers="$(curl -sSI --max-time 30 "$BASE$path" 2>&1 | tr -d '\r' || true)"
              printf '%s\n' "$headers"
              code="$(printf '%s\n' "$headers" | awk '/^HTTP/{code=$2} END{print code}')"
              if { [ "$code" = "200" ] || [ "$code" = "206" ]; } \
                && printf '%s\n' "$headers" | grep -Eiq '^content-type: application/vnd\.android\.package-archive' \
                && printf '%s\n' "$headers" | grep -Eiq '^content-disposition: attachment;' \
                && ! printf '%s\n' "$headers" | grep -Eiq '^location:'; then
                direct_ok=true
                break
              fi
              sleep 2
            done
            if [ "$direct_ok" != true ]; then
              echo "Direct APK verification failed for $path" >&2
              dump_diagnostics
              exit 1
            fi
          done

          echo "BLOFY Azure direct APK downloads verified: $BASE/d/blofy"
          echo "BLOFY Azure gateway healthy: $BASE"
