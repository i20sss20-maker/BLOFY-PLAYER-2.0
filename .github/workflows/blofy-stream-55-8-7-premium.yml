name: BLOFY STREAM 55.8.7 Premium Code-Only APK
on:
  push:
    branches: [feat/blofy-stream-55-8-7-premium-code-only-20261109, fix/stream-android9-trusted-ca-20261109, feat/stream-device-compatibility-20261109]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blofy-stream-55-8-7-premium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Guard 55.8.7 premium source and standalone app identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000084' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.8.7"' app/build.gradle.kts
          grep -Fq 'create("streamCodeDemo")' app/build.gradle.kts
          grep -Fq 'create("streamCodeOnly")' app/build.gradle.kts
          grep -Fq 'CODE_ONLY_LOGIN", "true"' app/build.gradle.kts
          grep -Fq 'api/v1/stream/app/redeem' app/src/main/java/tv/blofy/player/core/identity/StreamCodeClient.kt
          grep -Fq 'api/v1/stream/media/' app/src/main/java/tv/blofy/player/core/playback/ContentUrlResolver.kt
          test -s app/src/main/assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          test -s app/src/main/assets/fonts/IBMPlexSansArabic-Regular.ttf
      - name: Verify STREAM-only Android 9 certificate trust anchors
        shell: bash
        run: |
          set -euo pipefail
          for variant in streamCodeOnly streamCodeDemo; do
            xml="app/src/$variant/res/xml/network_security_config.xml"
            roots="app/src/$variant/res/raw/blofy_stream_isrg_roots.pem"
            test -s "$xml" && test -s "$roots"
            grep -Fq '<certificates src="system" />' "$xml"
            grep -Fq '<certificates src="@raw/blofy_stream_isrg_roots" />' "$xml"
            grep -Fq '<domain includeSubdomains="true">blofyplayer.com</domain>' "$xml"
            test "$(grep -c -- '-----BEGIN CERTIFICATE-----' "$roots")" = 2
            openssl crl2pkcs7 -nocrl -certfile "$roots" | openssl pkcs7 -print_certs -noout > "$RUNNER_TEMP/isrg-subjects.txt"
            grep -Fq 'ISRG Root X1' "$RUNNER_TEMP/isrg-subjects.txt"
            grep -Fq 'ISRG Root X2' "$RUNNER_TEMP/isrg-subjects.txt"
            awk 'BEGIN{n=0} /-----BEGIN CERTIFICATE-----/{n++} n==2 {print}' "$roots" > "$RUNNER_TEMP/isrg-x2.pem"
            x1="$(openssl x509 -in "$roots" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            x2="$(openssl x509 -in "$RUNNER_TEMP/isrg-x2.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test "$x1" = "96BCEC06264976F37460779ACF28C5A7CFE8A3C0AAE11A8FFCEE05C0BDDF08C6"
            test "$x2" = "69729B8E15A86EFC177A57AFB7171DFC64ADD28C2FCA8CF1507E34453CCB1470"
          done
          cmp app/src/streamCodeOnly/res/xml/network_security_config.xml app/src/streamCodeDemo/res/xml/network_security_config.xml
          cmp app/src/streamCodeOnly/res/raw/blofy_stream_isrg_roots.pem app/src/streamCodeDemo/res/raw/blofy_stream_isrg_roots.pem
      - name: Test code-only and build the original premium Android package
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            testDebugUnitTest 2>&1 | tee gradle-stream.log
          # The STREAM variant intentionally hides legacy QR/Xtream login, so
          # run its code-only tests separately from original PLAYER UI tests.
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            testStreamCodeDemoUnitTest \
              --tests tv.blofy.player.core.identity.StreamCodeClientTest \
              --tests tv.blofy.player.core.device.StreamDeviceCompatibilityTest \
              --tests tv.blofy.player.core.diagnostics.StreamConnectionDiagnosticsTest \
              2>&1 | tee -a gradle-stream.log
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            lintStreamCodeDemo assembleStreamCodeDemo 2>&1 | tee -a gradle-stream.log
      - name: Verify app identity, TV compatibility, and original font assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/streamCodeDemo/app-streamCodeDemo.apk
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" > badging.txt
          grep -Fq "name='tv.blofy.player.v2.stream'" badging.txt
          grep -Fq "versionCode='2000084'" badging.txt
          grep -Fq "BLOFY STREAM (QA)" badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          unzip -Z1 "$apk" | grep -Fq 'assets/fonts/IBMPlexSansArabic-SemiBold.ttf'
          unzip -Z1 "$apk" | grep -Fq 'assets/fonts/IBMPlexSansArabic-Regular.ttf'
          unzip -Z1 "$apk" | grep -Fq 'lib/arm64-v8a/libvlc.so'
          mkdir -p stream-qa
          cp "$apk" stream-qa/BLOFY-STREAM-55.8.7-PREMIUM-CODE-QA.apk
          cp badging.txt stream-qa/
          (cd stream-qa && sha256sum *.apk > SHA256SUMS)
      - name: Upload BLOFY STREAM independent QA APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.7-PREMIUM-QA-${{ github.sha }}
          path: stream-qa/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics if build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.7-DIAGNOSTICS-${{ github.sha }}
          path: |
            gradle-stream.log
            app/build/test-results/testStreamCodeDemoUnitTest/*.xml
            app/build/reports/lint-results-streamCodeDemo.*
          if-no-files-found: ignore
          retention-days: 7

  owner-signed:
    needs: qa
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
      BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
      BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
      EXPECTED_CERT: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Decode and verify original BLOFY release signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$BLOFY_RELEASE_STORE_PASSWORD"
          test -n "$BLOFY_RELEASE_KEY_ALIAS" && test -n "$BLOFY_RELEASE_KEY_PASSWORD"
          umask 077
          BLOFY_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/blofy-original.p12"
          export BLOFY_RELEASE_KEYSTORE_PATH
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$BLOFY_RELEASE_KEYSTORE_PATH"
          actual="$(keytool -exportcert -keystore "$BLOFY_RELEASE_KEYSTORE_PATH" -storepass:env BLOFY_RELEASE_STORE_PASSWORD -alias "$BLOFY_RELEASE_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$actual" = "$EXPECTED_CERT"
          echo "BLOFY_RELEASE_KEYSTORE_PATH=$BLOFY_RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed standalone STREAM APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" assembleStreamCodeOnly
      - name: Confirm signature and independent app ID
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/streamCodeOnly/app-streamCodeOnly.apk
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" > badging.txt
          grep -Fq "name='tv.blofy.player.v2.stream'" badging.txt
          grep -Fq "versionCode='2000084'" badging.txt
          grep -Fq "BLOFY STREAM" badging.txt
          ! grep -Fq "application-debuggable" badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > signature.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT"
          mkdir -p stream-signed
          cp "$apk" stream-signed/BLOFY-STREAM-55.8.7-PREMIUM-CODE-SIGNED.apk
          cp signature.txt badging.txt stream-signed/
          (cd stream-signed && sha256sum *.apk > SHA256SUMS)
      - name: Upload owner-signed standalone STREAM APK (not published)
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.7-PREMIUM-OWNER-SIGNED-${{ github.sha }}
          path: stream-signed/
          if-no-files-found: error
          retention-days: 30
