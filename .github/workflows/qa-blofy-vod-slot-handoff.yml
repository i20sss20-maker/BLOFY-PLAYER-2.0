name: BLOFY STREAM VOD transcode slot handoff QA
on:
  push:
    branches: [fix/stream-web-vod-transcoder-drain-before-seek-20261124]
    paths:
      - 'web/stream-native-parity/**'
      - '.github/workflows/qa-blofy-vod-slot-handoff.yml'
  pull_request:
    branches: [release/blofy-stream-web-1-0-0-20261124]
    paths:
      - 'web/stream-native-parity/**'
      - '.github/workflows/qa-blofy-vod-slot-handoff.yml'
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Rapid seek concurrent requests do not oversubscribe FFmpeg
        run: node --test web/stream-native-parity/qa/vod-drain-before-seek.test.mjs
      - name: Existing media lifecycle including playlist handoff and viewer STOP
        run: node --test web/stream-native-parity/qa/media-lifecycle.test.mjs
      - name: Build actual private worker
        run: bun build web/stream-native-parity/media-worker.ts --target=bun --outdir=/tmp/blofy-ffmpeg-drain
