name: STREAM poster coverage read-only database audit QA
on:
  push:
    branches: [fix/stream-poster-coverage-audit-20261121]
    paths: ['.github/workflows/stream-poster-coverage-audit-qa-20261121.yml','services/activation/src/xtream-full-catalog-integrity-audit.mjs','services/activation/test/xtream-full-catalog-integrity-audit.test.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify read-only catalog poster health audit and secret isolation
        run: |
          node --check services/activation/src/xtream-full-catalog-integrity-audit.mjs
          node --test services/activation/test/xtream-full-catalog-integrity-audit.test.mjs
