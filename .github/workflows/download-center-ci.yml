name: BLOFY Download Center CI

on:
  push:
    branches: [main]
    paths:
      - 'services/update-distribution/**'
      - '.github/workflows/download-center-ci.yml'
  pull_request:
    paths:
      - 'services/update-distribution/**'
      - '.github/workflows/download-center-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/update-distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - run: npm run check
