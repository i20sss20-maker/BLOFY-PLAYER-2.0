name: BLOFY Download Center CI

on:
  push:
    branches: [main]
    paths:
      - 'services/update-distribution/**'
      - '.github/workflows/download-center-ci.yml'
  pull_request:
    paths:
      - 'services/update-distribution/**'
      - '.github/workflows/download-center-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blofy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blofy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/blofy_test
      ADMIN_PASSWORD: ci-admin-password
      PUBLIC_ADMIN_PREFIX: /admin
      PORT: 3100
    defaults:
      run:
        working-directory: services/update-distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - run: npm run check
      - name: Complete-download counting regression
        run: node --test download-metrics.test.mjs
      - name: Catalog backup restore regression
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            initAppLibrary,
            listApps,
            listAppVariants,
            listCatalogBackups,
            restoreCatalogBackup,
            closeAppLibrary
          } from './app-library.mjs';

          await initAppLibrary();
          const allApps = await listApps(true);
          const before = allApps.length;
          const featured = ['projectivy-launcher', 'adb-tv', 'flauncher'];
          for (const slug of featured) {
            const app = allApps.find(item => item.slug === slug);
            if (!app?.featured || !app.iconUrl.startsWith('https://')) {
              throw new Error('featured_tv_app_missing:' + slug);
            }
          }
          const projectivy = allApps.find(app => app.slug === 'projectivy-launcher');
          const adbTv = allApps.find(app => app.slug === 'adb-tv');
          const flauncher = allApps.find(app => app.slug === 'flauncher');
          if (!projectivy?.autoUpdate ||
              !projectivy?.downloadUrl.includes('github.com/spocky/miproja1/releases/download/4.73/')) {
            throw new Error('projectivy_official_release_missing');
          }
          if (adbTv?.autoUpdate || adbTv?.downloadMode !== 'official' ||
              !adbTv?.downloadUrl.includes('adbappcontrol.com/en/tv/')) {
            throw new Error('adb_tv_official_source_missing');
          }
          if (!flauncher?.autoUpdate ||
              !flauncher?.downloadUrl.includes('github.com/osrosal/flauncher/releases/download/')) {
            throw new Error('flauncher_community_release_missing');
          }
          const flauncherVariants = (await listAppVariants()).filter(app => app.slug === 'flauncher');
          if (flauncherVariants.length !== 3 ||
              !flauncherVariants.some(app => app.key === 'armv7') ||
              !flauncherVariants.some(app => app.key === 'arm64')) {
            throw new Error('flauncher_arch_variants_missing');
          }
          const vlc = allApps.find(app => app.slug === 'vlc');
          if (!vlc || vlc.version !== '3.7.1' || !vlc.downloadUrl.includes('download.videolan.org/pub/videolan/vlc-android/3.7.1/')) {
            throw new Error('vlc_direct_source_not_migrated');
          }
          const tvBro = allApps.find(app => app.slug === 'tv-bro');
          if (!tvBro?.iconUrl.endsWith('/metadata/en-US/images/icon.png')) {
            throw new Error('tv_bro_official_icon_not_migrated');
          }
          const vlcVariants = (await listAppVariants()).filter(item => item.slug === 'vlc');
          if (vlcVariants.length < 2 || vlcVariants.some(item => !item.downloadUrl.includes('download.videolan.org/pub/videolan/vlc-android/3.7.1/'))) {
            throw new Error('vlc_variant_sources_not_migrated');
          }
          const backups = await listCatalogBackups(30);
          if (!backups.length) throw new Error('expected_catalog_backup');
          const restored = await restoreCatalogBackup(backups[backups.length - 1].id);
          if (restored.appCount !== before) {
            throw new Error(`restore_count_mismatch:${restored.appCount}!=${before}`);
          }
          await closeAppLibrary();
          console.log('CATALOG_BACKUP_RESTORE=PASS');
          NODE
      - name: Runtime smoke test with PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          node server.mjs >/tmp/blofy-download-center.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/blofy-download-center.log || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health >/tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          grep -Fq '"ok":true' /tmp/health.json

          curl -fsS --max-time 10 http://127.0.0.1:3100/downloads >/tmp/downloads.html
          # Show exactly the official stable build and the newest visible-version 74.
          grep -Fq 'data-v74-display-qa="true"' /tmp/downloads.html
          grep -Fq 'href="/download/v74-display74.apk"' /tmp/downloads.html
          grep -Fq 'v74-display74-remote-qa-20261025/BLOFY-PLAYER-Android-TV-v74-DISPLAY74-SIGNED.apk.sha256' /tmp/downloads.html
          grep -Fq 'href="/d/blofy"' /tmp/downloads.html
          # Main card, visible TV-v74 QA, and separate standalone Xiaomi test card.
          # Production with BLOFY_SINGLE_RELEASE_75=true hides both extra cards.
          # PLAYER + separately signed STREAM + cinema QA + Xiaomi QA.
          test "$(grep -o 'class="official-card"' /tmp/downloads.html | wc -l | tr -d '[:space:]')" = 4
          grep -Fq 'id="blofy-stream"' /tmp/downloads.html
          # STREAM has one dedicated official card, never a second generic app.
          test "$(grep -o 'id="blofy-stream"' /tmp/downloads.html | wc -l | tr -d '[:space:]')" = 1
          ! grep -Fq 'id="app-blofy-stream"' /tmp/downloads.html
          grep -Fq 'href="/d/blofy-stream"' /tmp/downloads.html
          grep -Fq 'href="/d/blofy-stream"' /tmp/downloads.html
          grep -Fq 'BLOFY STREAM' /tmp/downloads.html
          for slug in projectivy-launcher adb-tv flauncher; do
            grep -Fq "app-$slug" /tmp/downloads.html
            curl -fsS --max-time 10 "http://127.0.0.1:3100/apps/$slug" >"/tmp/app-$slug.html"
            grep -Fq "/download/apps/$slug" "/tmp/app-$slug.html"
          done
          grep -Fq 'cdn6.aptoide.com' /tmp/downloads.html
          grep -Fq 'cdn.aptoide.com' /tmp/downloads.html
          curl -fsS --max-time 10 http://127.0.0.1:3100/apps/blofy-stream >/tmp/stream-app.html
          grep -Fq '/d/blofy-stream' /tmp/stream-app.html
          ! grep -Fq 'data-cinematic-v74="true"' /tmp/downloads.html
          ! grep -Fq 'data-cinematic-v74-patch="true"' /tmp/downloads.html
          ! grep -Fq 'data-v74-remote-qa="true"' /tmp/downloads.html
          ! grep -Fq 'href="/download/v74-cinematic.apk"' /tmp/downloads.html
          ! grep -Fq 'href="/download/v74-cinema-fix.apk"' /tmp/downloads.html
          ! grep -Fq 'href="/download/v74-remote-qa.apk"' /tmp/downloads.html
          # Old direct APK endpoints stay valid for previously shared links.
          grep -Fq 'CINEMATIC_V74_PATCH.downloadPath' server.mjs
          grep -Fq 'CINEMATIC_V74_REMOTE.downloadPath' server.mjs
          grep -Fq 'CINEMATIC_V74_DOWNLOAD_PATH' server.mjs
          grep -Fq 'id="app-vlc"' /tmp/downloads.html
          grep -Fq 'rel="canonical" href="https://updates.blofyplayer.com/"' /tmp/downloads.html
          curl -fsS --max-time 10 http://127.0.0.1:3100/robots.txt >/tmp/updates-robots.txt
          curl -fsS --max-time 10 http://127.0.0.1:3100/sitemap.xml >/tmp/updates-sitemap.xml
          grep -Fq 'Sitemap: https://updates.blofyplayer.com/sitemap.xml' /tmp/updates-robots.txt
          grep -Fq '<loc>https://updates.blofyplayer.com/</loc>' /tmp/updates-sitemap.xml
          html_status="$(curl -sS --max-time 10 -H 'Accept: text/html' -o /tmp/updates-missing.html -w '%{http_code}' http://127.0.0.1:3100/__blofy_missing_route__)"
          test "$html_status" = 404
          grep -Fq 'الصفحة غير موجودة' /tmp/updates-missing.html
          json_status="$(curl -sS --max-time 10 -o /tmp/updates-missing.json -w '%{http_code}' http://127.0.0.1:3100/__blofy_missing_route__)"
          test "$json_status" = 404
          grep -Fq '"error":"not_found"' /tmp/updates-missing.json
          grep -Fq 'data-details-toggle' /tmp/downloads.html
          grep -Fq 'class="app-details"' /tmp/downloads.html
          grep -Fq 'id="app-search"' /tmp/downloads.html
          grep -Fq 'id="app-vlc"' /tmp/downloads.html
          grep -Fq 'class="stable-download-link"' /tmp/downloads.html
          grep -Fq 'class="copy-link"' /tmp/downloads.html
          grep -Fq 'data-copy-url=' /tmp/downloads.html
          grep -Fq 'نسخ / تفاصيل' /tmp/downloads.html
          grep -Fq 'إذا ما تعرف نوع جهازك اختر Universal' /tmp/downloads.html
          grep -Fq '/d/vlc' /tmp/downloads.html
          grep -Fq '/d/blofy' /tmp/downloads.html

          curl -fsS --max-time 10 'http://127.0.0.1:3100/downloads?app=vlc' >/tmp/downloads-vlc.html
          grep -Fq 'id="app-vlc"' /tmp/downloads-vlc.html
          grep -Fq "const requestedApp" /tmp/downloads-vlc.html
          grep -Fq 'class="variant-link"' /tmp/downloads.html
          grep -Fq 'ARMv7 · 32-bit' /tmp/downloads.html
          grep -Fq 'Universal' /tmp/downloads.html

          grep -Fq "streamApkDownload" server.mjs
          grep -Fq "'/latest.apk', '/apk', '/d/blofy'" server.mjs
          grep -Fq "application/vnd.android.package-archive" server.mjs
          grep -Fq "content-disposition" server.mjs
          grep -Fq "openRemoteApk" app-library.mjs

          # Legacy managed apps can have official store pages rather than a direct APK.
          # Keep public links functional without weakening direct-APK validation.
          node --input-type=module <<'NODE'
          import { upsertApp, closeAppLibrary } from './app-library.mjs';
          await upsertApp({
            slug:'ci-official', name:'CI official source', category:'tools', symbol:'CI',
            iconUrl:'https://example.com/ci.png', description:'CI store-link regression',
            devices:'Android', version:'1', architecture:'Universal', apkSizeBytes:0,
            downloadUrl:'https://play.google.com/store/apps/details?id=ci.example',
            downloadMode:'official', sortOrder:999, enabled:true, featured:false, autoUpdate:false
          });
          await closeAppLibrary();
          NODE
          curl --silent --show-error --max-time 10 --output /dev/null --dump-header /tmp/official.headers http://127.0.0.1:3100/download/apps/ci-official
          grep -Eq '^HTTP/[0-9.]+ 302' /tmp/official.headers
          grep -Fiq 'location: https://play.google.com/store/apps/details?id=ci.example' /tmp/official.headers
          curl --silent --show-error --max-time 10 http://127.0.0.1:3100/downloads >/tmp/downloads-official.html
          grep -Fq 'فتح المصدر الرسمي' /tmp/downloads-official.html
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          // Simulate an invalid pre-validation legacy direct row, in the temporary CI DB only.
          await client.query("update blofy_app_catalog set download_mode='direct' where slug='ci-official'");
          await client.end();
          NODE
          bad_status="$(curl --silent --show-error --max-time 10 --output /tmp/legacy-unavailable.json --write-out '%{http_code}' http://127.0.0.1:3100/d/ci-official)"
          test "$bad_status" = 503
          grep -Fq '"error":"app_download_source_unavailable"' /tmp/legacy-unavailable.json
          curl --silent --show-error --max-time 10 http://127.0.0.1:3100/downloads >/tmp/downloads-legacy.html
          grep -Fq 'رابط التحميل يحتاج تحديثًا' /tmp/downloads-legacy.html


          curl -fsS --max-time 10 -u admin:ci-admin-password http://127.0.0.1:3100/admin >/tmp/admin.html
          grep -Fq 'data-admin-filter="healthy"' /tmp/admin.html
          grep -Fq 'CATALOG BACKUPS' /tmp/admin.html
          grep -Fq 'AUDIT LOG' /tmp/admin.html
          grep -Fq 'id="admin-app-search"' /tmp/admin.html

          curl -fsS --max-time 10 http://127.0.0.1:3100/health >/tmp/health-after-download-ui.json
          grep -Fq '"ok":true' /tmp/health-after-download-ui.json

          echo "DOWNLOAD_CENTER_RUNTIME_SMOKE=PASS"

      - name: Verify current live BLOFY STREAM in-app feed and signed APK endpoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 20 \
              https://updates.blofyplayer.com/stream/release.json \
              -o "$RUNNER_TEMP/stream-live.json" 2>/dev/null \
              && jq -e '
                 .release.app.versionCode >= 2000089 and
                 .release.app.packageName == "tv.blofy.player.v2.stream" and
                 .release.app.apkSizeBytes > 10000000 and
                 .release.app.apkSizeBytes < 268435456 and
                 (.release.app.sha256 | test("^[a-f0-9]{64}$")) and
                 .release.app.downloadUrl == "https://updates.blofyplayer.com/d/blofy-stream"
               ' "$RUNNER_TEMP/stream-live.json" >/dev/null; then
              ready=1; break
            fi
            sleep 4
          done
          test "$ready" = "1" || { echo "::error::BLOFY STREAM release metadata is missing or unsafe"; exit 1; }
          curl --fail --silent --show-error --max-time 20 \
            https://updates.blofyplayer.com/release.json -o "$RUNNER_TEMP/player-live.json"
          jq -e '.release.app.downloadUrl != "https://updates.blofyplayer.com/d/blofy-stream"' \
            "$RUNNER_TEMP/player-live.json" >/dev/null
          curl --fail --silent --show-error --max-time 20 \
            https://updates.blofyplayer.com/downloads -o "$RUNNER_TEMP/live-downloads.html"
          grep -Fq 'id="blofy-stream"' "$RUNNER_TEMP/live-downloads.html"
          grep -Fq 'href="/d/blofy-stream"' "$RUNNER_TEMP/live-downloads.html"
          grep -Fq 'href="/d/blofy"' "$RUNNER_TEMP/live-downloads.html"
          curl --fail --silent --show-error --head --max-time 90 \
            https://updates.blofyplayer.com/d/blofy-stream > "$RUNNER_TEMP/stream-apk-head.txt"
          grep -iq '^content-type: application/vnd.android.package-archive' "$RUNNER_TEMP/stream-apk-head.txt"
          echo "BLOFY_STREAM_SIGNED_OTA_LIVE=PASS"
          echo "BLOFY_PLAYER_RELEASE_ISOLATION_LIVE=PASS"
