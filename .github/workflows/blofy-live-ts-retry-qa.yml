name: BLOFY live TS reconnect targeted QA (no customer sources)
on:
  push:
    branches:
      - qa/live-ts-upstream-transient-5xx-20261123
    paths:
      - 'services/activation/src/xtream-live-ts-recovery.mjs'
      - 'services/activation/src/xtream-media-retry-backoff.mjs'
      - 'services/activation/test/xtream-live-ts-recovery.test.mjs'
      - '.github/workflows/blofy-live-ts-retry-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ts-reconnect-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all isolated TS retry tests, no production provider URLs
        run: |
          node --check services/activation/src/xtream-live-ts-recovery.mjs
          node --test services/activation/test/xtream-live-ts-recovery.test.mjs
      - name: Scope proof
        if: always()
        run: |
          echo 'No paid subscriber accounts, real Xtream host credentials or live customer media were queried.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Passing does not prove end-to-end decoder recovery on customer TVs.' >> "$GITHUB_STEP_SUMMARY"
