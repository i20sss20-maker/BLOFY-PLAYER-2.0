name: BLOFY STREAM Encoder Capacity Evidence
on:
  push:
    branches: [feat/stream-web-encoder-capacity-evidence-20261124]
    paths:
      - 'web/stream-native-parity/**'
      - '.github/workflows/qa-blofy-stream-encoder-capacity.yml'
  pull_request:
    branches: [release/blofy-stream-web-1-0-0-20261124]
    paths:
      - 'web/stream-native-parity/**'
      - '.github/workflows/qa-blofy-stream-encoder-capacity.yml'
permissions:
  contents: read
jobs:
  synthetic-encoding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Verify FFmpeg with x264 and AAC encoders
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 75s sudo apt-get update -qq
            timeout 75s sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep libx264
          ffmpeg -hide_banner -encoders | grep ' aac '
      - name: Verify capacity counters, zero-customer state and production safety limit
        run: |
          node --check web/stream-native-parity/app.js
          node --test web/stream-native-parity/qa/encoder-capacity-observability.test.mjs
      - name: Run synthetic 1/2/3 software encoders with exact BLOFY quality profiles
        timeout-minutes: 7
        run: node web/stream-native-parity/qa/synthetic-encoder-concurrency.mjs
      - name: Verify worker/web transpilation after telemetry changes
        run: |
          bun build web/stream-native-parity/media-worker.ts --target=bun --outdir=/tmp/blofy-media-capacity-gate
          bun build web/stream-native-parity/server.ts --target=bun --outdir=/tmp/blofy-web-capacity-gate
      - name: Media lifecycle including no cross-viewer session deletion
        run: node --test web/stream-native-parity/qa/media-lifecycle.test.mjs
