name: BLOFY Azure Keep Warm

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-keep-warm.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RG: ${{ vars.BLOFY_AZURE_RG }}

jobs:
  keep-warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Keep BLOFY production services warm
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null
          for app in blofy-activation blofy-releases blofy-gateway; do
            echo "Setting $app min replicas to 1"
            az containerapp update \
              --resource-group "$AZURE_RG" \
              --name "$app" \
              --min-replicas 1 \
              --only-show-errors >/dev/null
          done

      - name: Verify replicas and public routes
        shell: bash
        run: |
          set -euo pipefail
          for app in blofy-activation blofy-releases blofy-gateway; do
            min="$(az containerapp show --resource-group "$AZURE_RG" --name "$app" --query properties.template.scale.minReplicas -o tsv)"
            echo "$app minReplicas=$min"
            test "$min" = "1"
          done

          FQDN="$(az containerapp show --resource-group "$AZURE_RG" --name blofy-gateway --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$FQDN"
          BASE="https://$FQDN"

          for path in /health / /portal /release.json /admin; do
            out="$(curl -sS -L --connect-timeout 10 --max-time 20 -o /dev/null -w 'code=%{http_code} total=%{time_total}' "$BASE$path")"
            echo "$path $out"
            [[ "$out" == code=200* ]]
          done

          out="$(curl -sS -L --connect-timeout 10 --max-time 20 -o /dev/null -w 'code=%{http_code} total=%{time_total}' "$BASE/releases-admin")"
          echo "/releases-admin $out"
          [[ "$out" == code=401* ]]
