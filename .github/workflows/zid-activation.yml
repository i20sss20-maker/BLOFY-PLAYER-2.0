name: Zid activation integration
on:
  pull_request:
    paths: ['services/activation/**', '.github/workflows/zid-activation.yml']
  push:
    branches: [main, feat/zid-activation-orders]
    paths: ['services/activation/**', '.github/workflows/zid-activation.yml']
jobs:
  verified-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blofy
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: blofy_zid_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U blofy -d blofy_zid_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/activation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/activation/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check src/zid-payments.mjs && npm run check
      - run: node --test test/zid-payments.test.mjs test/zid-payments.runtime.mjs
        env:
          BLOFY_TEST_DATABASE_URL: postgresql://blofy:fixture-only@127.0.0.1:5432/blofy_zid_test
