name: TV App Library Preview CI

on:
  push:
    branches:
      - feature/tv-app-library-preview
    paths:
      - 'services/update-distribution/**'
      - '.github/workflows/tv-app-library-preview-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/update-distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - run: npm run check
