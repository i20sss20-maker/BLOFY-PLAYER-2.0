name: BLOFY rc07.55 artwork verification
on:
  push:
    branches: [fix/rc0755-artwork-throughput]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc0755-artwork-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify unchanged testing version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text()
          assert 'versionCode = 2000067' in text
          assert 'versionName = "2.0.0-rc07.55"' in text
          PY
      - name: Install compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Run unit regressions and Android compatibility lint
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest lintDebug --stacktrace
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc0755-artwork-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
  device:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: tv
            api: 31
            target: android-tv
            arch: x86
          - kind: phone
            api: 35
            target: google_apis
            arch: x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build isolated artwork fixtures
        run: gradle --no-daemon --max-workers=2 -PBLOFY_ACTIVATION_BASE_URL=https://example.test assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify favorites online then after an offline process restart
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          profile: ${{ matrix.kind == 'tv' && 'tv_1080p' || 'pixel_2' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/verify_rc0755_artwork.sh
      - name: Retain phone or TV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc0755-artwork-device-${{ matrix.kind }}-${{ github.sha }}
          path: artwork-evidence/
          if-no-files-found: warn
