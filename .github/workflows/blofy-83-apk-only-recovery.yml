name: BLOFY 83 signed APK single-file delivery
on:
  push:
    branches: [fix/blofy-sections-83-20261104]
    paths:
      - .github/workflows/blofy-83-apk-only-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover-owner-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download already built and verified v83 owner-signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download 41756652902 --repo "$GITHUB_REPOSITORY" \
            --name BLOFY-55-8-6-2000083-APK-AAB-OWNER-SIGNED --dir payload
      - name: Validate APK matches original signed build
        run: |
          set -euo pipefail
          f=payload/BLOFY-PLAYER-55.8.6-2000083-SIGNED.apk
          test -s "$f"
          unzip -tq "$f" >/dev/null
          grep -Fq 'VersionCode=2000083' payload/BUILD_INFO.txt
          grep -Fq 'Signed=true' payload/BUILD_INFO.txt
          expected="$(grep 'BLOFY-PLAYER-55.8.6-2000083-SIGNED.apk' payload/SHA256SUMS | awk '{print $1}')"
          test -n "$expected"
          test "$(sha256sum "$f" | awk '{print $1}')" = "$expected"
          echo "Verified original signed APK: $(du -h "$f" | cut -f1)"
      - name: Upload APK without AAB or other assets so delivery is not truncated
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-v83-OWNER-SIGNED-APK-ONLY
          path: payload/BLOFY-PLAYER-55.8.6-2000083-SIGNED.apk
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
