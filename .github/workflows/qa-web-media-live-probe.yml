name: QA BLOFY Web media live probe and admission
on:
  pull_request:
    branches: [fix/web-media-capacity-20261125]
    paths:
      - web/stream-native-parity/**
      - .github/workflows/qa-web-media-live-probe.yml
  workflow_dispatch:
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web/stream-native-parity && node --test qa/live-media-source-probe.test.mjs qa/media-lifecycle.test.mjs
      - run: cd web/stream-native-parity && bun build media-worker.ts --target=bun --outfile=/tmp/media-worker-check.js
      - run: docker build -f web/stream-native-parity/Dockerfile.media web/stream-native-parity
