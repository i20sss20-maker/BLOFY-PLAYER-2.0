name: BLOFY Railway Production Migration

on:
  push:
    branches: [main]
    paths:
      - 'ops/railway-production-migration.run'

permissions:
  contents: read

concurrency:
  group: blofy-railway-production-migration
  cancel-in-progress: false

env:
  TARGET_URL: https://blofy-activation-portal-production.up.railway.app

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify explicit migration trigger
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'RUN=YES_COPY_BLOFY_VERCEL_TO_RAILWAY' ops/railway-production-migration.run

      - name: Validate encrypted source snapshot against Railway
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/validate.json"
          curl -fsS --max-time 240 "$TARGET_URL/api/v1/internal/migration-import/pull?mode=validate" -o "$OUT"
          jq '{mode,source,sourceCounts,targetCountsBefore,keyCompatible,keyMigrationMode,schemaCompatible,schemaIssues}' "$OUT"
          jq -e '.mode=="validated" and .source.database=="neondb" and .schemaCompatible==true and .schemaIssues==[]' "$OUT" >/dev/null
          jq -e '.sourceCounts.devices>=180 and .sourceCounts.device_playlists>=40 and .sourceCounts.playback_diagnostics>=1400' "$OUT" >/dev/null

      - name: Apply encrypted Vercel snapshot transactionally
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/apply.json"
          curl -fsS --max-time 360 "$TARGET_URL/api/v1/internal/migration-import/pull?mode=apply" -o "$OUT"
          jq '{mode,bundleId,backupSchema,source,sourceCounts,targetCountsAfter,keyCompatible,keyMigrationMode,persistedDataKey,restartRequired,preservedTargetTables}' "$OUT"
          jq -e '.mode=="applied" or .mode=="already-applied"' "$OUT" >/dev/null
          if jq -e '.mode=="applied"' "$OUT" >/dev/null; then
            jq -e '.persistedDataKey==true and .restartRequired==true and
              .sourceCounts.devices==.targetCountsAfter.devices and
              .sourceCounts.device_playlists==.targetCountsAfter.device_playlists and
              .sourceCounts.playback_diagnostics==.targetCountsAfter.playback_diagnostics' "$OUT" >/dev/null
          fi

      - name: Confirm Railway health after transactional apply
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$TARGET_URL/health" | jq -e '.ok==true and .database=="ready"' >/dev/null
