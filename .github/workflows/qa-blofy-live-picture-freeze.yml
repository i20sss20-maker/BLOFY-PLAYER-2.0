name: BLOFY STREAM Live Video Freeze Guard QA
on:
  push:
    branches: [fix/stream-web-no-picture-live-progress-20261124]
    paths:
      - 'web/stream-native-parity/**'
      - '.github/workflows/qa-blofy-live-picture-freeze.yml'
  pull_request:
    branches: [release/blofy-stream-web-1-0-0-20261124]
    paths:
      - 'web/stream-native-parity/**'
      - '.github/workflows/qa-blofy-live-picture-freeze.yml'
permissions:
  contents: read
jobs:
  live-picture-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audio clock must not disguise missing live picture
        run: node --test web/stream-native-parity/qa/live-audio-picture-progress.test.mjs
      - name: Existing video frame, HLS restart, decoder and VOD lifecycle
        run: node --test web/stream-native-parity/qa/media-lifecycle.test.mjs
      - name: Validate legacy-TV JS syntax
        run: node --check web/stream-native-parity/app.js
