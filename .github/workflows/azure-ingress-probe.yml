name: BLOFY Azure Ingress Probe (Manual Only)

# Legacy Azure workflow retained for reference/manual recovery only.
# Railway is the active BLOFY production platform; this workflow never runs automatically.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RG: ${{ vars.BLOFY_AZURE_RG }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Probe current BLOFY gateway image on port 80
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null

          ENV_NAME="$(az containerapp env list --resource-group "$AZURE_RG" --query '[0].name' -o tsv)"
          IDENTITY_ID="$(az identity list --resource-group "$AZURE_RG" --query '[0].id' -o tsv)"
          IMAGE="$(az containerapp show --resource-group "$AZURE_RG" --name blofy-gateway --query 'properties.template.containers[0].image' -o tsv)"
          test -n "$ENV_NAME"
          test -n "$IDENTITY_ID"
          test -n "$IMAGE"
          REGISTRY_SERVER="${IMAGE%%/*}"
          PROBE="blofy-gateway-probe"

          echo "Testing exact image on port 80: $IMAGE"
          az containerapp delete --resource-group "$AZURE_RG" --name "$PROBE" --yes --only-show-errors >/dev/null 2>&1 || true
          az containerapp create \
            --resource-group "$AZURE_RG" \
            --name "$PROBE" \
            --environment "$ENV_NAME" \
            --workload-profile-name Consumption \
            --user-assigned "$IDENTITY_ID" \
            --registry-identity "$IDENTITY_ID" \
            --registry-server "$REGISTRY_SERVER" \
            --image "$IMAGE" \
            --ingress external \
            --target-port 80 \
            --transport auto \
            --min-replicas 1 \
            --max-replicas 1 \
            --env-vars PORT=80 ACTIVATION_URL=http://blofy-activation RELEASE_URL=http://blofy-releases \
            --only-show-errors >/dev/null

          echo '=== clean BLOFY gateway port-80 probe ==='
          az containerapp show --resource-group "$AZURE_RG" --name "$PROBE" \
            --query '{workloadProfileName:properties.workloadProfileName,external:properties.configuration.ingress.external,targetPort:properties.configuration.ingress.targetPort,transport:properties.configuration.ingress.transport,revisionMode:properties.configuration.activeRevisionsMode,minReplicas:properties.template.scale.minReplicas,maxReplicas:properties.template.scale.maxReplicas,fqdn:properties.configuration.ingress.fqdn,image:properties.template.containers[0].image}' -o json

          FQDN="$(az containerapp show --resource-group "$AZURE_RG" --name "$PROBE" --query properties.configuration.ingress.fqdn -o tsv)"
          ok=false
          for attempt in $(seq 1 12); do
            code="$(curl -sS --max-time 10 -o /tmp/probe-body -w '%{http_code}' "https://$FQDN/health" || true)"
            echo "gateway-port80 attempt $attempt/12 -> HTTP ${code:-curl-error}"
            if [ "$code" = '200' ]; then
              ok=true
              break
            fi
            sleep 5
          done

          if [ "$ok" != true ]; then
            echo 'BLOFY gateway image still failed on port 80.' >&2
            [ -s /tmp/probe-body ] && { echo 'Last response:'; head -80 /tmp/probe-body; } || true
            timeout 30s az containerapp logs show --resource-group "$AZURE_RG" --name "$PROBE" --type console --tail 80 2>&1 || true
            exit 42
          fi

          echo 'BLOFY gateway image works on port 80.'

      - name: Cleanup probe
        if: always()
        shell: bash
        run: |
          az containerapp delete --resource-group "$AZURE_RG" --name blofy-gateway-probe --yes --only-show-errors >/dev/null 2>&1 || true
