name: BLOFY TV Private Test APK

on:
  push:
    branches:
      - qa/tv-private-download-2000073-20261024
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blofy-tv-private-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tv-private:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Check Play TV configuration
        run: python3 tools/verify_play_2000073.py
      - name: Run Kotlin/Room tests in isolated offline activation mode
        run: |
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testDebugUnitTest
      - name: Build isolated Google Play TV debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_DISTRIBUTION=play \
            -PBLOFY_TV_PRIVATE_TEST=true \
            -PBLOFY_ACTIVATION_BASE_URL=https://blofy-player-2-0.vercel.app \
            lintDebug assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" > tv-private-badging.txt
          grep -Fq "package: name='tv.blofy.player.v2.tvtest'" tv-private-badging.txt
          "$aapt" dump permissions "$apk" > tv-private-permissions.txt
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' tv-private-permissions.txt
          cp "$apk" BLOFY-PLAYER-TV-2000073-PRIVATE-TEST.apk
          sha256sum BLOFY-PLAYER-TV-2000073-PRIVATE-TEST.apk > SHA256SUMS.txt
      - name: Upload private APK for tester
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-TV-2000073-PRIVATE-TEST-${{ github.sha }}
          path: |
            BLOFY-PLAYER-TV-2000073-PRIVATE-TEST.apk
            SHA256SUMS.txt
            tv-private-badging.txt
          if-no-files-found: error
          retention-days: 14
