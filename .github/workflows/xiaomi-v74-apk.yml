name: Xiaomi Android TV v74 standalone signed APK
on:
  push:
    branches: [feature/xiaomi-v74-from-signed-source]
    paths:
      - app/**
      - .github/workflows/xiaomi-v74-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-xiaomi:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    env:
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
      ANDROID_NDK_VERSION: "28.0.13004108"
      ANDROID_CMAKE_VERSION: "3.22.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install SDK and native tools
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION"
          command -v ninja >/dev/null || { sudo apt-get update && sudo apt-get install -y ninja-build; }
      - name: Decode signing key
        env:
          KEY_B64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          umask 077
          printf '%s' "$KEY_B64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$RUNNER_TEMP/xiaomi.keystore"
          keytool -list -keystore "$RUNNER_TEMP/xiaomi.keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
      - name: Build FFmpeg native decoder
        env:
          ENABLED_DECODERS: ac3 eac3 dca truehd aac mp3 opus vorbis flac
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          sha256sum --check build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar.sha256
      - name: Assemble Xiaomi standalone signed APK
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/xiaomi.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_XIAOMI_EDITION=true \
            -PBLOFY_DISTRIBUTION=website \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar" \
            assembleRelease
      - name: Verify Android 9 installability and signing
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          test -s "$apk"
          "$tools/aapt" dump badging "$apk" | tee badging.txt
          grep -Fq "package: name='tv.blofy.player.xiaomi' versionCode='2000074'" badging.txt
          min_sdk=$("$tools/aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p")
          test "$min_sdk" -le 28
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee signature.txt
          mkdir -p xiaomi-artifact
          cp "$apk" xiaomi-artifact/BLOFY-PLAYER-Xiaomi-v74-SIGNED.apk
          cp badging.txt signature.txt xiaomi-artifact/
          (cd xiaomi-artifact && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-Xiaomi-v74-SIGNED
          path: xiaomi-artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/xiaomi.keystore"
