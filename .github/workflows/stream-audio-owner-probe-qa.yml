name: BLOFY STREAM Owner Audio Source QA
on:
  pull_request:
    branches: [qa/stream-timeline-keep-arabic-audio-20261115]
    paths:
      - 'services/activation/src/stream-audio-operator-diagnostics.mjs'
      - 'services/activation/src/xtream-admin-hook.mjs'
      - 'services/activation/test/stream-audio-operator-diagnostics.test.mjs'
      - '.github/workflows/stream-audio-owner-probe-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-audio-probe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private owner bridge syntax
        run: |
          node --check services/activation/src/stream-audio-operator-diagnostics.mjs
          node --check services/activation/src/xtream-admin-hook.mjs
      - name: Exercise no-network owner radio probe rules
        run: node --test services/activation/test/stream-audio-operator-diagnostics.test.mjs
      - name: Confirm no provider probes or production changes performed by CI
        run: echo 'No provider HTTP requests or customer writes were used.' >> "$GITHUB_STEP_SUMMARY"
