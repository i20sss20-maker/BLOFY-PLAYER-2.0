name: BLOFY website 2000074 owner-signed APK

on:
  push:
    branches:
      - release/blofy-website-2000074-20261024
    paths:
      - 'app/**'
      - 'tools/verify_play_2000073.py'
      - '.github/workflows/website-2000074-signed.yml'
      - 'build.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blofy-website-2000074-release
  cancel-in-progress: true

env:
  EXPECTED_APPLICATION_ID: tv.blofy.player.v2
  EXPECTED_VERSION_CODE: '2000074'
  EXPECTED_VERSION_NAME: 2.0.0-rc07.55.6
  EXPECTED_CERT_SHA256: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
  ACTIVATION_BASE_URL: https://api.blofyplayer.com
  UPDATE_BASE_URL: https://updates.blofyplayer.com
  ANDROID_NDK_VERSION: 28.0.13004108
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  verify-build-publish:
    if: github.ref == 'refs/heads/release/blofy-website-2000074-20261024'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate identity and signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::Owner signing secret $name unavailable"; exit 1; }
          done
          grep -Fq 'applicationId = "tv.blofy.player.v2"' app/build.gradle.kts
          grep -Fq 'versionCode = 2000074' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.6"' app/build.gradle.kts
          ! grep -Fq 'BLOFY_TEST_SIDELOAD=true' app/build.gradle.kts

      - name: Install Android SDK, NDK and CMake
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION"
          command -v ninja >/dev/null || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - name: Android unit tests and Play manifest checks
        run: |
          set -euo pipefail
          python3 tools/check_catalog_queries.py
          python3 tools/verify_play_2000073.py
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testDebugUnitTest

      - name: Release catalog contract tests
        run: |
          set -euo pipefail
          node --test services/activation/test/release-catalog.test.mjs services/activation/test/release-metadata.test.mjs services/activation/test/release-public.test.mjs

      - name: Verify original BLOFY signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/blofy-owner.keystore"
          keytool -list -keystore "$RUNNER_TEMP/blofy-owner.keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          actual="$(keytool -exportcert -keystore "$RUNNER_TEMP/blofy-owner.keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$actual" = "$EXPECTED_CERT_SHA256"

      - name: Compile full Media3 FFmpeg decoder
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"
          export ENABLED_DECODERS='ac3 eac3 dca truehd aac mp3 opus vorbis flac'
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          test -s build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar
          sha256sum --check build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar.sha256

      - name: Build owner-signed non-debuggable website APK
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-owner.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_DISTRIBUTION=website \
            -PBLOFY_SECURITY_R8=true \
            -PBLOFY_ACTIVATION_BASE_URL="$ACTIVATION_BASE_URL" \
            -PBLOFY_UPDATE_BASE_URL="$UPDATE_BASE_URL" \
            -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar" \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            lintRelease assembleRelease

      - name: Verify identity, original signature, 16k alignment and included decoders
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" "$RUNNER_TEMP/badging.txt"
          ! grep -Fq application-debuggable "$RUNNER_TEMP/badging.txt"
          "$tools/apksigner" verify --print-certs --verbose "$apk" > "$RUNNER_TEMP/signature.txt"
          actual="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          "$tools/zipalign" -c -P 16 4 "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Eiq "^lib/$abi/lib(ffmpeg|ffmpegJNI).*\\.so$" "$RUNNER_TEMP/apk-files.txt"
          done
          mkdir -p website-release
          cp "$apk" website-release/BLOFY-PLAYER-2.0-2000074-SIGNED.apk
          sha256sum website-release/BLOFY-PLAYER-2.0-2000074-SIGNED.apk > website-release/SHA256SUMS

      - name: Save verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-website-2000074-${{ github.sha }}
          path: website-release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish official website version 74 only after every gate passes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="blofy-player-2000074-website"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::74 already exists. Refusing to silently replace it."
            exit 1
          fi
          gh release create "$tag" \
            website-release/BLOFY-PLAYER-2.0-2000074-SIGNED.apk \
            website-release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BLOFY PLAYER 74 — Official website APK" \
            --notes "Production-signed Android TV/Android website update (versionCode 2000074). Same BLOFY app ID and original signing certificate as previous releases. Preserves data during supported in-place upgrades. Fixes silent Xtream catalog updates, resumable section refresh and playback-first performance. Not submitted to Google Play by this workflow."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq 'BLOFY-PLAYER-2.0-2000074-SIGNED.apk'

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/blofy-owner.keystore"
