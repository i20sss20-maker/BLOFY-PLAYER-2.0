name: BLOFY STREAM 55.8.7 Native Audio QA

on:
  push:
    branches:
      - feature/blofy-stream-55-8-7-audio-intelligence-20261110
    paths:
      - '.github/workflows/blofy-stream-native-audio-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-audio-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: 28.0.13004108
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
      MEDIA3_VERSION: '1.6.1'
      FFMPEG_VERSION: 'n6.0'
      ANDROID_ABI: '21'
      ENABLED_DECODERS: 'ac3 eac3 dca truehd aac mp3 opus vorbis flac'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;3.22.1"
          if ! command -v ninja >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          fi
      - name: Build pinned Media3 1.6.1 FFmpeg audio decoder
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          test -s build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar
      - name: Test STREAM code-only audio and build isolated QA package
        shell: bash
        run: |
          set -euxo pipefail
          AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar"
          gradle --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -PBLOFY_FFMPEG_AAR="$AAR" \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeDemoUnitTest \
            --tests 'tv.blofy.player.core.diagnostics.StreamAudioHealthTest' \
            --tests 'tv.blofy.player.core.identity.StreamCodeClientTest' \
            --tests 'tv.blofy.player.core.playback.PlaybackSessionReleaseTest'
          gradle --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -PBLOFY_FFMPEG_AAR="$AAR" \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            assembleStreamCodeDemo
      - name: Verify decoder libraries, license notices and isolated APK identity
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/streamCodeDemo/app-streamCodeDemo.apk
          AAR=build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar
          test -s "$APK"
          test -s "$AAR"
          # Read native build's actual manifest, not only its requested env vars.
          NATIVE_INFO=build/ffmpeg-native/build-info.txt
          test -s "$NATIVE_INFO"
          grep -Fxq 'decoders=ac3 eac3 dca truehd aac mp3 opus vorbis flac' "$NATIVE_INFO"
          grep -Fxq 'config_gpl=0' "$NATIVE_INFO"
          grep -Fxq 'config_nonfree=0' "$NATIVE_INFO"
          grep -Fxq 'config_version3=0' "$NATIVE_INFO"
          grep -Fxq 'page_size_compatible=16384' "$NATIVE_INFO"
          sha256sum --check "$AAR.sha256"
          unzip -Z1 "$AAR" > "$RUNNER_TEMP/ffmpeg-aar.txt"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/stream-apk.txt"
          grep -Fxq 'assets/open_source/ffmpeg/LICENSE.md' "$RUNNER_TEMP/stream-apk.txt"
          grep -Fxq 'assets/open_source/ffmpeg/SOURCE_OFFER.txt' "$RUNNER_TEMP/stream-apk.txt"
          grep -Fxq 'assets/open_source/THIRD_PARTY_NOTICES.txt' "$RUNNER_TEMP/stream-apk.txt"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "jni/$abi/libffmpegJNI.so" "$RUNNER_TEMP/ffmpeg-aar.txt"
            grep -Fxq "lib/$abi/libffmpegJNI.so" "$RUNNER_TEMP/stream-apk.txt"
          done
          grep -Fq 'applicationIdSuffix = ".stream.qa"' app/build.gradle.kts
          BADGING="$RUNNER_TEMP/native-qa-badging.txt"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt" dump badging "$APK" > "$BADGING"
          grep -Fq "name='tv.blofy.player.v2.stream.qa'" "$BADGING"
          grep -Fq "versionName='2.0.0-rc07.55.8.7-STREAM-QA'" "$BADGING"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/zipalign" \
            -c -P 16 -v 4 "$APK"
          mkdir -p build/stream-qa
          {
            echo 'variant=ffmpeg-media3-extension'
            echo 'version=55.8.7'
            echo 'package=tv.blofy.player.v2.stream.qa'
            echo "source_commit=$GITHUB_SHA"
            echo 'production_release=no'
            echo 'decoders=ac3,eac3,dca,truehd,aac,mp3,opus,vorbis,flac'
          } > build/stream-qa/BUILD-IDENTITY.txt
          sha256sum "$APK" "$AAR" > build/stream-qa/SHA256SUMS.txt
          cat build/stream-qa/BUILD-IDENTITY.txt >> "$GITHUB_STEP_SUMMARY"
          cat build/stream-qa/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload isolated Native Audio QA APK and native license metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.7-NATIVE-AUDIO-QA-${{ github.sha }}
          path: |
            app/build/outputs/apk/streamCodeDemo/*.apk
            app/build/test-results/testStreamCodeDemoUnitTest/
            build/ffmpeg-native/build-info.txt
            build/stream-qa/
            build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar.sha256
            build/ffmpeg-native/compliance/BUILD-AND-RELINK.txt
          if-no-files-found: warn
          retention-days: 7
