name: BLOFY TV Design Snapshots

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/tv/blofy/player/ui/**'
      - 'app/src/main/java/tv/blofy/player/core/theme/**'
      - 'app/src/main/res/drawable/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/tv-design-snapshots.yml'

concurrency:
  group: blofy-tv-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: Android TV 1080p snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Build debug and instrumentation APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run real Android TV UI and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          disk-size: 4096M
          heap-size: 1024M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=tv.blofy.player.DesignSnapshotInstrumentedTest --stacktrace
            mkdir -p build/design-snapshots
            adb pull /sdcard/Android/data/tv.blofy.player.v2/files/design-snapshots/. build/design-snapshots/
            find build/design-snapshots -maxdepth 2 -type f -print

      - name: Upload design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-TV-DESIGN-${{ github.sha }}
          path: build/design-snapshots/**
          if-no-files-found: warn
          retention-days: 30
