name: BLOFY TV Design Snapshots

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/tv/blofy/player/ui/**'
      - 'app/src/main/java/tv/blofy/player/core/theme/**'
      - 'app/src/main/res/drawable/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/tv-design-snapshots.yml'

concurrency:
  group: blofy-tv-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: Google TV 1080p snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Build debug and instrumentation APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run real TV UI and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          disk-size: 4096M
          heap-size: 1024M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            APP_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' ! -name '*androidTest*' | head -1)"
            TEST_APK="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' | head -1)"
            test -f "$APP_APK"
            test -f "$TEST_APK"
            echo "Installing $APP_APK"
            adb install -r "$APP_APK"
            echo "Installing $TEST_APK"
            adb install -r "$TEST_APK"

            adb shell am instrument -w \
              -e class tv.blofy.player.DesignSnapshotInstrumentedTest \
              tv.blofy.player.v2.test/androidx.test.runner.AndroidJUnitRunner

            mkdir -p build/design-snapshots
            REMOTE_DIR="/sdcard/Android/data/tv.blofy.player.v2/files/design-snapshots"
            echo "Snapshot directory contents:"
            adb shell "ls -la '$REMOTE_DIR'"
            adb pull "$REMOTE_DIR/." build/design-snapshots/

            count="$(find build/design-snapshots -maxdepth 1 -type f -name '*.png' | wc -l)"
            echo "Captured $count BLOFY TV screenshots"
            test "$count" -ge 9
            find build/design-snapshots -maxdepth 1 -type f -name '*.png' -print

      - name: Upload design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-TV-DESIGN-${{ github.sha }}
          path: build/design-snapshots/**
          if-no-files-found: warn
          retention-days: 30
