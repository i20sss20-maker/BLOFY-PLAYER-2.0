name: BLOFY rc07.55 Activation Details QA

on:
  push:
    branches: [qa/rc0755-activation-details-polish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blofy-rc0755-activation-details-qa
  cancel-in-progress: true

env:
  EXPECTED_APP_SOURCE_SHA: "cca23872c4a3bdff0e2568875a0a4a5cfed38cc3"
  EXPECTED_APPLICATION_ID: tv.blofy.player.v2
  EXPECTED_VERSION_CODE: "2000067"
  EXPECTED_VERSION_NAME: 2.0.0-rc07.55
  EXPECTED_CERT_SHA256: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
  ACTIVATION_BASE_URL: https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io
  UPDATE_BASE_URL: https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io
  MEDIA3_VERSION: "1.6.1"
  ANDROID_NDK_VERSION: 28.0.13004108
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_BUILD_TOOLS_VERSION: 35.0.0
  FFMPEG_DECODERS: ac3 eac3 dca truehd aac mp3 opus vorbis flac

jobs:
  verify:
    name: Unit + lint + assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact app source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_APP_SOURCE_SHA^{commit}"
          git diff --exit-code "$EXPECTED_APP_SOURCE_SHA" "$GITHUB_SHA" -- app
          grep -Fq 'applicationId = "tv.blofy.player.v2"' app/build.gradle.kts
          grep -Fq 'versionCode = 2000067' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55"' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit lint assemble
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_BUILD_SHA="$EXPECTED_APP_SOURCE_SHA" \
            testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-details-ci-${{ env.EXPECTED_APP_SOURCE_SHA }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  interface:
    name: Interface (${{ matrix.kind }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: tv
            api: 31
            target: android-tv
            arch: x86
          - kind: phone
            api: 35
            target: google_apis
            arch: x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build isolated UI fixtures
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_BUILD_SHA="$EXPECTED_APP_SOURCE_SHA" \
            assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual interface flows
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          profile: ${{ matrix.kind == 'tv' && 'tv_1080p' || 'pixel_2' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/verify_rc0744_ui.sh ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-details-ui-${{ matrix.kind }}-${{ env.EXPECTED_APP_SOURCE_SHA }}
          path: ui-evidence/
          if-no-files-found: ignore
          retention-days: 14

  signed-qa:
    name: Production-signed QA APK
    needs: [verify, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact app source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_APP_SOURCE_SHA^{commit}"
          git diff --exit-code "$EXPECTED_APP_SOURCE_SHA" "$GITHUB_SHA" -- app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate production signing inputs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!value:-}" ]] || { echo "::error::Missing $value"; exit 1; }
          done
      - name: Install native and signing toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION"
          command -v ninja >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ninja-build; }
      - name: Decode and validate production key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/blofy-production.keystore"
          clean_b64="$RUNNER_TEMP/blofy-production.b64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > "$clean_b64"
          remainder=$(( $(wc -c < "$clean_b64") % 4 ))
          if [[ "$remainder" -ne 0 ]]; then printf '%*s' $((4 - remainder)) '' | tr ' ' '=' >> "$clean_b64"; fi
          base64 --decode "$clean_b64" > "$keystore"
          keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          actual="$(keytool -exportcert -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          [[ "$actual" == "$EXPECTED_CERT_SHA256" ]]
      - name: Build Media3 FFmpeg decoder
        shell: bash
        env:
          ENABLED_DECODERS: ${{ env.FFMPEG_DECODERS }}
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          aar="build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          test -s "$aar"
          sha256sum --check "$aar.sha256"
      - name: Build production-signed QA APK
        shell: bash
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m
        run: |
          set -euo pipefail
          aar="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_SECURITY_R8=true \
            -PBLOFY_ACTIVATION_BASE_URL="$ACTIVATION_BASE_URL" \
            -PBLOFY_UPDATE_BASE_URL="$UPDATE_BASE_URL" \
            -PBLOFY_BUILD_SHA="$EXPECTED_APP_SOURCE_SHA" \
            -PBLOFY_FFMPEG_AAR="$aar" \
            lintRelease assembleRelease
      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" "$RUNNER_TEMP/badging.txt"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/badging.txt"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          actual="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          [[ "$actual" == "$EXPECTED_CERT_SHA256" ]]
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Eiq "^lib/$abi/lib(ffmpeg|ffmpegJNI).*\\.so$" "$RUNNER_TEMP/apk-files.txt"
          done
          mkdir -p signed-qa
          cp "$apk" signed-qa/BLOFY-PLAYER-2.0-rc07.55-ACTIVATION-DETAILS-PRODUCTION-SIGNED-QA.apk
          cp "$RUNNER_TEMP/badging.txt" signed-qa/apk-badging.txt
          cp "$RUNNER_TEMP/signature.txt" signed-qa/apk-signature.txt
          {
            echo "version=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "appSourceCommit=$EXPECTED_APP_SOURCE_SHA"
            echo "qaWorkflowCommit=$GITHUB_SHA"
            echo "production_signed=true"
            echo "r8=true"
            echo "ffmpeg=true"
            echo "published=false"
          } > signed-qa/build-info.txt
          (cd signed-qa && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-rc07.55-ACTIVATION-DETAILS-PRODUCTION-SIGNED-QA-${{ env.EXPECTED_APP_SOURCE_SHA }}
          path: signed-qa/
          if-no-files-found: error
          retention-days: 30
