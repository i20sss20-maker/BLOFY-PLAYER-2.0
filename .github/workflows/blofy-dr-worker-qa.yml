name: BLOFY private regional DR worker tests (never touches production)
on:
  push:
    branches: [qa/blofy-stream-offsite-backup-restore-20261123]
    paths:
      - 'ops/disaster-recovery/railway-worker/**'
      - '.github/workflows/blofy-dr-worker-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run AES-256-GCM, corruption and DB URL safety tests
        run: |
          python3 -m venv /tmp/blofy-dr-venv
          /tmp/blofy-dr-venv/bin/pip install --disable-pip-version-check -r ops/disaster-recovery/railway-worker/requirements.txt
          /tmp/blofy-dr-venv/bin/python -m unittest discover -s ops/disaster-recovery/railway-worker -p test_worker.py -v
      - name: Build isolated non-root PostgreSQL 18 worker image
        run: |
          docker build --pull -f ops/disaster-recovery/railway-worker/Dockerfile ops/disaster-recovery/railway-worker -t blofy-dr-worker:synthetic
      - name: Verify worker fails closed without secrets
        run: |
          if docker run --rm blofy-dr-worker:synthetic > /tmp/blofy-dr-no-secret.log 2>&1; then
            echo "ERROR: Worker ran with no backup secrets" >&2
            exit 1
          fi
          grep -q backup_disabled_by_default /tmp/blofy-dr-no-secret.log
          echo 'PASS: worker refuses to start without explicit enablement'
      - name: State external-backup activation status
        if: always()
        run: |
          echo 'QA uses fake data only. This job did not access Railway Postgres or upload customer backups.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remote backup and actual data restoration require a distinct operational run.' >> "$GITHUB_STEP_SUMMARY"
