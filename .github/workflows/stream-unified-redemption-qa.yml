name: STREAM unified redemption isolated QA
on:
  push:
    branches:
      - qa/stream-unified-server-redemption-20261125
    paths:
      - 'services/activation/src/stream-unified-code-redeem.mjs'
      - 'services/activation/src/stream-connect-pairing.mjs'
      - 'services/activation/src/xtream-gateway-hook.mjs'
      - 'services/activation/test/stream-unified-code-redeem.test.mjs'
      - '.github/workflows/stream-unified-redemption-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redemption:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/activation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: |
          node --check src/xtream-gateway-hook.mjs
          node --check src/stream-connect-pairing.mjs
          node --test test/stream-unified-code-redeem.test.mjs test/stream-connect-pairing.test.mjs
