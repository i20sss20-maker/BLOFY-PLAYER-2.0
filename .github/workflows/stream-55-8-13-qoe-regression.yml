name: BLOFY STREAM 55.8.13 QoE regression QA

on:
  push:
    branches:
      - feat/stream-55-8-13-qoe-stability-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-qoe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Test connection diagnosis, startup timing, recovery and audio
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testDebugUnitTest \
            --tests tv.blofy.player.core.diagnostics.StreamConnectionDiagnosticsTest \
            --tests tv.blofy.player.core.diagnostics.PlaybackDiagnosticsRetentionTest \
            --tests tv.blofy.player.core.diagnostics.PlaybackQualityAssessmentTest \
            --tests tv.blofy.player.core.diagnostics.StreamAudioHealthTest \
            --tests tv.blofy.player.core.playback.PlaybackRecoveryPolicyTest \
            --tests tv.blofy.player.ui.catalog.MovieCardMetaTest \
            --tests tv.blofy.player.ui.catalog.MovieGenrePrefetchPolicyTest \
            --tests tv.blofy.player.ui.catalog.MovieGenresTest
      - name: Save test evidence only — not a customer release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-55-8-13-qoe-tests-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
