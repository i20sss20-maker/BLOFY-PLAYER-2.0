name: STREAM 56.0.3 Android 9 emulator artwork and offline-download smoke
on:
  push:
    branches: [stage/stream-56-0-3-inspect-signed-20261121]
    paths: ['.github/workflows/stream-56-0-3-android9-emulator-20261121.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-api28:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stream-56-0-3-refresh-indicator-stall-20261121
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android 9 isolated device smoke, no live customer accounts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 720
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            gradle --no-daemon --max-workers=2 \
              -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
              -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
              connectedStreamCodeDemoAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=tv.blofy.player.ui.LibraryDownloadDeviceTest
      - name: Collect Android 9 instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-56-0-3-android9-qa
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 10
