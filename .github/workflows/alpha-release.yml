name: BLOFY Signed Release Candidate

on:
  workflow_dispatch:
    inputs:
      build_label:
        description: Short artifact label (letters, numbers, dot, dash, underscore)
        required: false
        default: rc02
        type: string

permissions:
  contents: read

concurrency:
  group: blofy-signed-release-candidate
  cancel-in-progress: false

env:
  PRODUCTION_ACTIVATION_BASE_URL: https://blofy-player-2-0.vercel.app
  EXPECTED_APPLICATION_ID: tv.blofy.player.v2
  EXPECTED_VERSION_CODE: "2000003"
  EXPECTED_VERSION_NAME: 2.0.0-rc02
  MEDIA3_VERSION: "1.6.1"
  FFMPEG_VERSION: n6.0
  FFMPEG_DECODERS: ac3 eac3 dca truehd aac mp3 opus vorbis flac
  ANDROID_ABI: "21"
  ANDROID_NDK_VERSION: 28.0.13004108
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_BUILD_TOOLS_VERSION: 35.0.0
  GRADLE_CMD: gradle
  MEDIA3_GRADLE_VERSION: "8.11.1"

jobs:
  build-signed-alpha:
    name: Production + FFmpeg + signed APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate release inputs and signing secrets
        id: release-meta
        shell: bash
        env:
          BUILD_LABEL: ${{ inputs.build_label }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.BLOFY_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Signed production release candidates may only be built from main"
            exit 1
          }
          [[ "$PRODUCTION_ACTIVATION_BASE_URL" =~ ^https://[^/]+$ ]] || {
            echo "::error::PRODUCTION_ACTIVATION_BASE_URL must be an HTTPS origin without a path"
            exit 1
          }
          [[ "$BUILD_LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$ ]] || {
            echo "::error::build_label must match ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$"
            exit 1
          }

          missing=0
          required_secrets=(
            "BLOFY_ANDROID_KEYSTORE_BASE64:ANDROID_KEYSTORE_BASE64"
            "BLOFY_ANDROID_KEYSTORE_PASSWORD:ANDROID_KEYSTORE_PASSWORD"
            "BLOFY_ANDROID_KEY_ALIAS:ANDROID_KEY_ALIAS"
            "BLOFY_ANDROID_KEY_PASSWORD:ANDROID_KEY_PASSWORD"
            "BLOFY_ANDROID_CERT_SHA256 (production variable):EXPECTED_CERT_SHA256"
          )
          for required_secret in "${required_secrets[@]}"; do
            github_name="${required_secret%%:*}"
            env_name="${required_secret#*:}"
            if [[ -z "${!env_name:-}" ]]; then
              echo "::error::Missing required production signing secret: $github_name"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1

          normalized_cert_sha256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')"
          [[ "$normalized_cert_sha256" =~ ^[0-9A-F]{64}$ ]] || {
            echo "::error::BLOFY_ANDROID_CERT_SHA256 must be a 64-character SHA-256 certificate fingerprint"
            exit 1
          }

          echo "build_label=$BUILD_LABEL" >> "$GITHUB_OUTPUT"
          echo "expected_cert_sha256=$normalized_cert_sha256" >> "$GITHUB_OUTPUT"

      - name: Wait for matching production activation deployment
        timeout-minutes: 18
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          health_file="$RUNNER_TEMP/blofy-production-health.json"
          expected_commit_sha="$(printf '%s' "$EXPECTED_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_commit_sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || {
            echo "::error::GITHUB_SHA is not a complete Git commit hash"
            exit 1
          }

          deadline=$((SECONDS + 900))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            rm -f "$health_file"
            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-redirs 3 \
              --proto '=https' \
              --tlsv1.2 \
              --connect-timeout 5 \
              --max-time 15 \
              "$PRODUCTION_ACTIVATION_BASE_URL/health" \
              --output "$health_file"; then
              if python3 - "$health_file" "$expected_commit_sha" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          expected = sys.argv[2]
          release = payload.get("release") if isinstance(payload.get("release"), dict) else {}
          observed = str(release.get("commitSha") or "").lower()
          service_version = str(release.get("version") or "")
          healthy = (
              payload.get("ok") is True
              and payload.get("database") == "ready"
              and payload.get("playlistEncryption") == "ready"
          )
          metadata_ready = (
              release.get("service") == "blofy-activation"
              and release.get("platform") == "vercel"
              and re.fullmatch(r"[0-9A-Za-z._-]{1,64}", service_version) is not None
          )
          if healthy and metadata_ready and observed == expected:
              print(f"Production activation {service_version} is healthy at commit {observed[:12]}")
              raise SystemExit(0)

          status = "healthy" if healthy else "not-ready"
          shown_commit = observed[:12] if re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", observed) else "missing"
          print(f"Waiting for production deployment: status={status}, commit={shown_commit}")
          raise SystemExit(1)
          PY
              then
                exit 0
              fi
            else
              echo "Production /health is not reachable yet (attempt $attempt)"
            fi
            sleep 10
          done

          echo "::error::Production activation did not reach commit ${expected_commit_sha:0:12} within 15 minutes"
          exit 1

      - name: Install Android native and signing toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          test -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -d "$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Decode and validate production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ steps.release-meta.outputs.expected_cert_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/blofy-production.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"

          keytool -list \
            -keystore "$keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          actual_cert_sha256="$(
            keytool -exportcert \
              -keystore "$keystore" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" \
              | sha256sum \
              | awk '{print toupper($1)}'
          )"
          if [[ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::The signing certificate does not match BLOFY_ANDROID_CERT_SHA256"
            exit 1
          fi

      - name: Build Media3 FFmpeg decoder AAR
        shell: bash
        env:
          ENABLED_DECODERS: ${{ env.FFMPEG_DECODERS }}
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"
          test -d "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh

      - name: Verify FFmpeg AAR
        shell: bash
        run: |
          set -euo pipefail
          aar="build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          test -s "$aar"
          unzip -Z1 "$aar" > "$RUNNER_TEMP/ffmpeg-aar-files.txt"
          grep -Eiq '(^|/)jni/[^/]+/lib(ffmpeg|ffmpegJNI).*\.so$' "$RUNNER_TEMP/ffmpeg-aar-files.txt"
          sha256sum --check "$aar.sha256"

      - name: Build production release APK and AAB with FFmpeg
        shell: bash
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          aar="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-$MEDIA3_VERSION.aar"
          test -s "$aar"
          gradle --no-daemon \
            -PBLOFY_ACTIVATION_BASE_URL="$PRODUCTION_ACTIVATION_BASE_URL" \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            -PBLOFY_FFMPEG_AAR="$aar" \
            testDebugUnitTest lintRelease assembleRelease bundleRelease

      - name: Stage AGP-signed release APK and AAB
        shell: bash
        env:
          BUILD_LABEL: ${{ steps.release-meta.outputs.build_label }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          mkdir -p "$release_dir"

          gradle_apk="app/build/outputs/apk/release/app-release.apk"
          gradle_aab="app/build/outputs/bundle/release/app-release.aab"
          signed_apk="$release_dir/BLOFY-PLAYER-2.0-$BUILD_LABEL.apk"
          signed_aab="$release_dir/BLOFY-PLAYER-2.0-$BUILD_LABEL.aab"
          compliance_source="$GITHUB_WORKSPACE/build/ffmpeg-native/compliance"
          compliance_zip="$release_dir/BLOFY-PLAYER-2.0-$BUILD_LABEL-ffmpeg-compliance.zip"
          test -s "$gradle_apk"
          test -s "$gradle_aab"
          cp "$gradle_apk" "$signed_apk"
          cp "$gradle_aab" "$signed_aab"

          test -s "$compliance_source/COPYING.LGPLv2.1"
          test -s "$compliance_source/FFmpeg-LICENSE.md"
          test -s "$compliance_source/BUILD-AND-RELINK.txt"
          test -s "$compliance_source/FFmpeg-$FFMPEG_VERSION-source.tar.gz"
          test -s "$compliance_source/androidx-media-$MEDIA3_VERSION-source.tar.gz"
          test -s "$compliance_source/androidx-media-changes.diff"
          command -v zip >/dev/null
          (
            cd "$compliance_source"
            zip -q -r "$compliance_zip" .
          )
          test -s "$compliance_zip"

      - name: Verify production configuration, FFmpeg, signatures, and hashes
        shell: bash
        env:
          BUILD_LABEL: ${{ steps.release-meta.outputs.build_label }}
          EXPECTED_CERT_SHA256: ${{ steps.release-meta.outputs.expected_cert_sha256 }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          signed_apk="$release_dir/BLOFY-PLAYER-2.0-$BUILD_LABEL.apk"
          signed_aab="$release_dir/BLOFY-PLAYER-2.0-$BUILD_LABEL.aab"
          compliance_zip="$release_dir/BLOFY-PLAYER-2.0-$BUILD_LABEL-ffmpeg-compliance.zip"
          test -s "$signed_apk"
          test -s "$signed_aab"
          test -s "$compliance_zip"

          "$build_tools/aapt" dump badging "$signed_apk" \
            | tee "$release_dir/apk-badging.txt"
          grep -Fq \
            "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" \
            "$release_dir/apk-badging.txt"

          "$build_tools/zipalign" -c -P 16 -v 4 "$signed_apk"
          "$build_tools/apksigner" verify \
            --verbose \
            --print-certs \
            "$signed_apk" \
            | tee "$release_dir/apk-signature.txt"

          actual_apk_cert_sha256="$(
            "$build_tools/apksigner" verify --print-certs "$signed_apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr -d '[:space:]:-' \
              | tr '[:lower:]' '[:upper:]'
          )"
          [[ "$actual_apk_cert_sha256" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "::error::Signed APK certificate fingerprint mismatch"
            exit 1
          }

          jarsigner -verify -certs "$signed_aab" \
            | tee "$release_dir/aab-signature.txt"
          unzip -Z1 "$signed_aab" > "$RUNNER_TEMP/signed-aab-files.txt"
          grep -Eiq '^META-INF/[^/]+\.SF$' "$RUNNER_TEMP/signed-aab-files.txt"
          grep -Eiq '^META-INF/[^/]+\.(RSA|DSA|EC)$' "$RUNNER_TEMP/signed-aab-files.txt"

          keytool -printcert -jarfile "$signed_aab" -rfc \
            > "$RUNNER_TEMP/blofy-aab-signer.pem"
          actual_aab_cert_sha256="$(
            openssl x509 \
              -in "$RUNNER_TEMP/blofy-aab-signer.pem" \
              -outform DER \
              | sha256sum \
              | awk '{print toupper($1)}'
          )"
          [[ "$actual_aab_cert_sha256" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "::error::Signed AAB certificate fingerprint mismatch"
            exit 1
          }

          unzip -Z1 "$signed_apk" > "$RUNNER_TEMP/signed-apk-files.txt"
          for license_asset in \
            assets/open_source/THIRD_PARTY_NOTICES.txt \
            assets/open_source/ffmpeg/LICENSE.md \
            assets/open_source/ffmpeg/COPYING.LGPLv2.1 \
            assets/open_source/ffmpeg/SOURCE_OFFER.txt \
            assets/open_source/androidx-media/LICENSE; do
            grep -Fxq "$license_asset" "$RUNNER_TEMP/signed-apk-files.txt"
            grep -Fxq "base/$license_asset" "$RUNNER_TEMP/signed-aab-files.txt"
          done

          unzip -Z1 "$compliance_zip" > "$RUNNER_TEMP/ffmpeg-compliance-files.txt"
          for compliance_file in \
            AndroidX-Media-LICENSE \
            BUILD-AND-RELINK.txt \
            COPYING.LGPLv2.1 \
            FFmpeg-LICENSE.md \
            "FFmpeg-$FFMPEG_VERSION-source.tar.gz" \
            SHA256SUMS \
            "androidx-media-$MEDIA3_VERSION-source.tar.gz" \
            androidx-media-changes.diff \
            ffmpeg-changes.diff; do
            grep -Fxq "$compliance_file" "$RUNNER_TEMP/ffmpeg-compliance-files.txt"
          done
          unzip -p "$compliance_zip" BUILD-AND-RELINK.txt | grep -Fq 'CONFIG_GPL=0'
          unzip -p "$compliance_zip" BUILD-AND-RELINK.txt | grep -Fq 'CONFIG_NONFREE=0'
          unzip -p "$compliance_zip" BUILD-AND-RELINK.txt | grep -Fq 'CONFIG_VERSION3=0'
          unzip -p "$compliance_zip" BUILD-AND-RELINK.txt | grep -Fq "Gradle: $MEDIA3_GRADLE_VERSION"
          unzip -p "$compliance_zip" androidx-media-changes.diff | grep -Fq 'Modified by BLOFY PLAYER'
          unzip -p "$compliance_zip" androidx-media-changes.diff | grep -Fq "ndkVersion '$ANDROID_NDK_VERSION'"

          compliance_verify_dir="$RUNNER_TEMP/blofy-ffmpeg-compliance"
          mkdir -p "$compliance_verify_dir"
          unzip -q "$compliance_zip" -d "$compliance_verify_dir"
          (
            cd "$compliance_verify_dir"
            sha256sum --check SHA256SUMS
          )

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Eiq "^lib/$abi/lib(ffmpeg|ffmpegJNI).*\\.so$" "$RUNNER_TEMP/signed-apk-files.txt"
            grep -Eiq "^base/lib/$abi/lib(ffmpeg|ffmpegJNI).*\\.so$" "$RUNNER_TEMP/signed-aab-files.txt"
          done

          native_dir="$RUNNER_TEMP/blofy-native-libs"
          rm -rf "$native_dir"
          mkdir -p "$native_dir"
          unzip -qq "$signed_apk" 'lib/*/*.so' -d "$native_dir"
          python3 - \
            "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump" \
            "$native_dir/lib/arm64-v8a" \
            "$native_dir/lib/x86_64" <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          objdump = sys.argv[1]
          checked = 0
          for abi_dir_arg in sys.argv[2:]:
              abi_dir = Path(abi_dir_arg)
              libraries = sorted(abi_dir.glob("*.so"))
              if not libraries:
                  raise SystemExit(f"No native libraries found for {abi_dir.name}")
              for library in libraries:
                  output = subprocess.check_output(
                      [objdump, "-p", str(library)],
                      text=True,
                  )
                  load_alignment_exponents = [
                      int(match.group(1))
                      for line in output.splitlines()
                      if line.lstrip().startswith("LOAD ")
                      if (match := re.search(r"align 2\*\*(\d+)", line))
                  ]
                  if not load_alignment_exponents:
                      raise SystemExit(f"No LOAD segments found in {library}")
                  if min(load_alignment_exponents) < 14:
                      raise SystemExit(
                          f"{library} is not 16 KB ELF-aligned: "
                          f"LOAD exponents={load_alignment_exponents}"
                      )
                  checked += 1
          print(f"Verified 16 KB ELF LOAD alignment for {checked} 64-bit native libraries")
          PY

          rm -rf "$RUNNER_TEMP/apk-dex" "$RUNNER_TEMP/aab-dex"
          mkdir -p "$RUNNER_TEMP/apk-dex" "$RUNNER_TEMP/aab-dex"
          unzip -qq "$signed_apk" '*.dex' -d "$RUNNER_TEMP/apk-dex"
          unzip -qq "$signed_aab" 'base/dex/*.dex' -d "$RUNNER_TEMP/aab-dex"
          grep -aRFq -- "$PRODUCTION_ACTIVATION_BASE_URL" "$RUNNER_TEMP/apk-dex"
          grep -aRFq -- "$PRODUCTION_ACTIVATION_BASE_URL" "$RUNNER_TEMP/aab-dex"

          (
            cd "$release_dir"
            sha256sum \
              "BLOFY-PLAYER-2.0-$BUILD_LABEL.apk" \
              "BLOFY-PLAYER-2.0-$BUILD_LABEL.aab" \
              "BLOFY-PLAYER-2.0-$BUILD_LABEL-ffmpeg-compliance.zip" \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          cat > "$release_dir/release-build-info.txt" <<EOF
          variant=release
          label=$BUILD_LABEL
          application_id=$EXPECTED_APPLICATION_ID
          version_code=$EXPECTED_VERSION_CODE
          version_name=$EXPECTED_VERSION_NAME
          commit=$GITHUB_SHA
          run=$GITHUB_RUN_NUMBER
          activation_origin=$PRODUCTION_ACTIVATION_BASE_URL
          activation_health=ok
          database_health=ready
          media3=$MEDIA3_VERSION
          media3_commit=839c4a90f2ab36e48be73e1b5e907f3283dce72e
          ffmpeg=$FFMPEG_VERSION
          ffmpeg_commit=ea3d24bbe3c58b171e55fe2151fc7ffaca3ab3d2
          ffmpeg_bundled=true
          ffmpeg_license=LGPL-2.1-or-later
          ffmpeg_linkage=static-archives-in-libffmpegJNI.so
          ffmpeg_config_gpl=0
          ffmpeg_config_nonfree=0
          ffmpeg_config_version3=0
          ffmpeg_decoders=$FFMPEG_DECODERS
          gradle=$MEDIA3_GRADLE_VERSION
          ffmpeg_abis=arm64-v8a,armeabi-v7a,x86,x86_64
          elf_page_alignment=16384
          signed=true
          certificate_sha256=$EXPECTED_CERT_SHA256
          compliance_archive=BLOFY-PLAYER-2.0-$BUILD_LABEL-ffmpeg-compliance.zip
          EOF

      - name: Upload one verified production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-${{ steps.release-meta.outputs.build_label }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/blofy-production.keystore"
