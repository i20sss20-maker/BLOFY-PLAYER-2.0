name: BLOFY Polish Diagnostics

on:
  push:
    branches: [professional-polish]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile tests lint assemble with captured log
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon \
            -PBLOFY_ACTIVATION_BASE_URL=https://blofy-player-2-0.vercel.app \
            testDebugUnitTest lintDebug assembleDebug 2>&1 | tee polish-gradle.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-polish-gradle-${{ github.sha }}
          path: polish-gradle.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
