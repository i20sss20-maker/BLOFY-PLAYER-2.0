name: BLOFY STREAM Protected Arabic Audio Backend QA
on:
  push:
    branches: [fix/stream-foxfm-blofy-audio-20261116]
    paths:
      - 'services/activation/src/stream-arabic-audio-bridge.mjs'
      - 'services/activation/src/xtream-gateway-hook.mjs'
      - 'services/activation/test/stream-arabic-audio-bridge.test.mjs'
      - 'services/activation/test/stream-arabic-audio-operator-shapes.test.mjs'
      - 'services/activation/test/stream-arabic-audio-probe.test.mjs'
      - 'services/activation/test/stream-arabic-audio-live-relay.test.mjs'
      - '.github/workflows/stream-arabic-audio-backend-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax checks
        run: |
          node --check services/activation/src/stream-arabic-audio-bridge.mjs
          node --check services/activation/src/xtream-gateway-hook.mjs
      - name: Run isolated no-network, no-secrets audio backend tests
        run: node --test services/activation/test/stream-arabic-audio-bridge.test.mjs services/activation/test/stream-arabic-audio-operator-shapes.test.mjs services/activation/test/stream-arabic-audio-probe.test.mjs services/activation/test/stream-arabic-audio-live-relay.test.mjs
      - name: Preserve opt-in status
        run: |
          echo 'BLOFY FoXFM audio relay is tested on a standalone branch before deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'New 33-station runtime playlist must be supplied through Railway environment only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Railway deployment or source configuration is performed by this job.' >> "$GITHUB_STEP_SUMMARY"
