name: BLOFY Activation CI

on:
  pull_request:
    paths:
      - 'services/activation/**'
      - '.github/workflows/activation-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/activation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/activation/package.json
      - run: npm install
      - run: npm run check
