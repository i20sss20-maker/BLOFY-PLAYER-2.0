name: BLOFY Activation CI

on:
  push:
    branches:
      - main
    paths:
      - 'services/activation/**'
      - '.github/workflows/activation-ci.yml'
  pull_request:
    paths:
      - 'services/activation/**'
      - '.github/workflows/activation-ci.yml'
  workflow_dispatch:

jobs:
  downloads-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render Downloader layout on desktop and phone
        env:
          AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
          AGENT_BROWSER_ARGS: --no-sandbox
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/blofy-browser" --ignore-scripts=false --no-audit --no-fund agent-browser@0.37.1
          export PATH="$RUNNER_TEMP/blofy-browser/node_modules/.bin:$PATH"
          node services/activation/test/downloads-browser-fixture.mjs &
          mkdir -p downloads-evidence
          agent-browser open http://127.0.0.1:8127/downloads
          agent-browser eval "document.fonts.ready.then(() => 'Fonts ready')"
          agent-browser set viewport 1280 720
          agent-browser snapshot -i
          agent-browser eval "document.getElementById('download-primary').focus()"
          agent-browser screenshot downloads-evidence/downloads-tv.png
          agent-browser eval "if(document.documentElement.scrollWidth > innerWidth) throw new Error('Horizontal overflow'); if(document.getElementById('download-primary').getBoundingClientRect().height < 54) throw new Error('Small download target'); if(document.querySelector('.previous-releases').open) throw new Error('Older versions must start collapsed'); 'TV layout verified'"
          agent-browser click '.previous-releases summary'
          agent-browser snapshot -i
          agent-browser set viewport 390 844
          agent-browser open http://127.0.0.1:8127/downloads
          agent-browser screenshot downloads-evidence/downloads-phone.png
          agent-browser eval "if(document.documentElement.scrollWidth > innerWidth) throw new Error('Phone horizontal overflow'); 'Phone layout verified'"
          agent-browser errors
          agent-browser close
          python3 - <<'PYSCREEN'
          import base64,pathlib
          for p in pathlib.Path('downloads-evidence').glob('*.png'):
              print('BLOFY_WEB_SCREEN '+p.stem+' '+base64.b64encode(p.read_bytes()).decode())
          PYSCREEN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downloads-browser-${{ github.sha }}
          path: downloads-evidence/
          retention-days: 14
  admin-session-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blofy
          POSTGRES_PASSWORD: isolated-admin-test-only
          POSTGRES_DB: blofy_admin_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blofy -d blofy_admin_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/activation
    env:
      BLOFY_TEST_DATABASE_URL: postgresql://blofy:isolated-admin-test-only@127.0.0.1:5432/blofy_admin_security_test
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Concurrent PostgreSQL limits and cross-process session revocation
        run: node --test test/admin-session-persistence.runtime.mjs
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blofy
          POSTGRES_PASSWORD: blofy_test
          POSTGRES_DB: blofy_activation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blofy -d blofy_activation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/activation
    env:
      DATABASE_URL: postgresql://blofy:blofy_test@127.0.0.1:5432/blofy_activation
      PGSSLMODE: disable
      BLOFY_ADMIN_TOKEN: ci-test-admin-token-1234567890
      BLOFY_TRIAL_DAYS: 7
      BLOFY_PLAYLIST_ENCRYPTION_KEY: 3f13b9368c3ae0dbcc7b4e7fbc28ba1247136ed4ad967f8a91a7db0911c7d4a2
      BLOFY_RELEASE_COMMIT_SHA: ${{ github.sha }}
      PORT: 8080
      BLOFY_SMOKE_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/activation/package.json
      - run: npm install
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Approved rc07.44 publication with real PostgreSQL
        env:
          BLOFY_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: node --test test/approved-release-rc0744.test.mjs
      - name: Start activation service
        run: |
          npm start > /tmp/blofy-activation.log 2>&1 &
          echo $! > /tmp/blofy-activation.pid
      - name: Wait for DB-aware health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"database":"ready"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/blofy-activation.log
          exit 1
      - name: Unified production smoke suite
        run: node smoke.mjs
      - name: Portal to Android playlist sync E2E contract
        env:
          BLOFY_E2E_BASE_URL: http://127.0.0.1:8080
        run: node test/portal-playlist-sync.e2e.mjs
      - name: Verify active expiry and reactivation lifecycle
        run: |
          curl --fail --silent -H 'content-type: application/json' \
            -d '{"deviceId":"BLOFY-AB12-CD34","activationCode":"123456","appVersion":"ci","platform":"android"}' \
            http://127.0.0.1:8080/api/v1/activation/check | grep -q '"status":"trial"'
          curl --fail --silent -X PATCH \
            -H 'authorization: Bearer ci-test-admin-token-1234567890' -H 'content-type: application/json' \
            -d '{"status":"active","days":30}' \
            http://127.0.0.1:8080/api/v1/admin/devices/BLOFY-AB12-CD34 | grep -q '"status":"active"'
          curl --fail --silent -X PATCH \
            -H 'authorization: Bearer ci-test-admin-token-1234567890' -H 'content-type: application/json' \
            -d '{"status":"expired"}' \
            http://127.0.0.1:8080/api/v1/admin/devices/BLOFY-AB12-CD34 | grep -q '"status":"expired"'
          curl --fail --silent -X PATCH \
            -H 'authorization: Bearer ci-test-admin-token-1234567890' -H 'content-type: application/json' \
            -d '{"status":"active","days":365}' \
            http://127.0.0.1:8080/api/v1/admin/devices/BLOFY-AB12-CD34 | grep -q '"status":"active"'
      - name: Verify playback diagnostics ingestion and admin query
        run: |
          code=$(curl --silent --output /tmp/diag-accepted.json --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"deviceId":"BLOFY-AB12-CD34","activationCode":"123456","providerKey":"provider-ci","contentKind":"live","redactedUrl":"https://example.test/live/***/***/123.ts","ttffMs":842,"bufferingCount":2,"errorCode":"ERROR_CODE_IO_NETWORK_CONNECTION_FAILED","errorMessage":"ci-network-error","appVersion":"ci"}' \
            http://127.0.0.1:8080/api/v1/diagnostics/playback)
          test "$code" = "202"
          curl --fail --silent -H 'authorization: Bearer ci-test-admin-token-1234567890' \
            'http://127.0.0.1:8080/api/v1/admin/diagnostics?deviceId=BLOFY-AB12-CD34&providerKey=provider-ci&limit=10' > /tmp/diag-list.json
          grep -q '"ttffMs":842' /tmp/diag-list.json
          grep -q '"bufferingCount":2' /tmp/diag-list.json
      - name: Dump service log on failure
        if: failure()
        run: cat /tmp/blofy-activation.log || true
