name: BLOFY STREAM 56.0.3 long-running content refresh regression QA
on:
  push:
    branches: [fix/stream-56-0-3-refresh-indicator-stall-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Test refresh UI, bounded auto retry, revision cadence and old catalog parser
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeOnlyUnitTest \
            --tests 'tv.blofy.player.ui.settings.StreamCatalogRefreshUiPolicyTest' \
            --tests 'tv.blofy.player.data.StreamCatalogRetryPolicyTest' \
            --tests 'tv.blofy.player.data.StreamCatalogRefreshCadenceTest' \
            --tests 'tv.blofy.player.data.StreamCatalogDeltaParserTest'
      - name: Compile STREAM demo flavor only (not a customer release)
        run: |
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            assembleStreamCodeDemo
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-refresh-stall-regression-results
          path: |
            app/build/test-results/testStreamCodeOnlyUnitTest/*.xml
            app/build/reports/tests/testStreamCodeOnlyUnitTest/
          if-no-files-found: ignore
          retention-days: 7
