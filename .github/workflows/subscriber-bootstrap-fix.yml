name: BLOFY Subscriber Bootstrap Fix

on:
  push:
    branches:
      - fix/azure-subscriber-bootstrap
    paths:
      - .github/workflows/subscriber-bootstrap-fix.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/azure-subscriber-bootstrap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 tools/apply_subscriber_bootstrap_fix.py
      - name: Validate patch
        run: git diff --check
      - name: Install activation dependencies
        working-directory: services/activation
        run: npm ci
      - name: Syntax checks
        working-directory: services/activation
        run: npm run check
      - name: Activation tests
        working-directory: services/activation
        run: npm test
      - name: Commit tested fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/activation/src/subscriber-proxy-hook.mjs services/activation/package.json infra/azure/managed/main.bicep
          git diff --cached --quiet && exit 1
          git commit -m 'fix(subscriber): bootstrap and persist hidden host on Azure'
          git push origin HEAD:fix/azure-subscriber-bootstrap
