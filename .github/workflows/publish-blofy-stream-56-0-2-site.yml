name: Upload verified BLOFY STREAM 56.0.2 owner-signed APK to official site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-blofy-stream-56-0-2-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: publish-blofy-stream-56-0-2-official-upload
  cancel-in-progress: false
jobs:
  upload-verified-owner-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '44835025044'
      SOURCE_SHA: '8a855395bb4178732a5d5762058c4a177fd29790'
      ARTIFACT_PREFIX: 'BLOFY-STREAM-56.0.2-AUTO-CATALOG-OWNER-SIGNED-'
      APK_NAME: 'BLOFY-STREAM-56.0.2-AUTO-CATALOG-FIX-OWNER-SIGNED.apk'
      CERT: 'C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E'
      SHA256: '9a3037936b374b3e62e2bc06f4f9fe8b5a3a64441c249c8cf00d78944c58876a'
      BYTES: '135787039'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source run finished original-owner signing and all Android QA
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$SOURCE_SHA" '.head_sha==$sha and .status=="completed" and .conclusion=="success"' "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          jq -e '[.jobs[] | select(.name=="verify" and .conclusion=="success")] | length==1' "$RUNNER_TEMP/jobs.json"
          jq -e '[.jobs[] | select(.name=="owner-signed-stream-qa" and .conclusion=="success")] | length==1' "$RUNNER_TEMP/jobs.json"
          jq -e '[.jobs[].steps[] | select(.name=="Sign full BLOFY STREAM with original owner certificate" and .conclusion=="success")] | length==1' "$RUNNER_TEMP/jobs.json"
          jq -e '[.jobs[].steps[] | select(.name=="Verify identity, certificate, signatures, native FFmpeg and SHA256" and .conclusion=="success")] | length==1' "$RUNNER_TEMP/jobs.json"
      - name: Download and independently verify original-owner-signed APK identity
        shell: bash
        run: |
          # This step reads only public binary provenance and no private credentials.
          set -euxo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          artifact="$(jq -er --arg prefix "$ARTIFACT_PREFIX" '[.artifacts[] | select((.name|startswith($prefix)) and .expired==false)] | if length==1 then .[0].name else error("missing or ambiguous signed APK") end' "$RUNNER_TEMP/artifacts.json")"
          mkdir -p staging
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir staging
          apk="$(find staging -type f -name "$APK_NAME" -print -quit)"
          identity="$(find staging -type f -name IDENTITY.txt -print -quit)"
          test -s "$apk" && test -s "$identity"
          grep -Fxq 'application_id=tv.blofy.player.v2.stream' "$identity"
          grep -Fxq 'version_code=2000117' "$identity"
          grep -Fxq "source_sha=$SOURCE_SHA" "$identity"
          mkdir -p verified
          cp "$apk" "verified/$APK_NAME"
          actual_size="$(stat -c '%s' "verified/$APK_NAME")"
          actual_sha="$(sha256sum "verified/$APK_NAME" | awk '{print $1}')"
          test "$actual_size" = "$BYTES" && test "$actual_sha" = "$SHA256"
          # Fresh Ubuntu runners may not include the pinned Android build-tools.
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" || test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging "verified/$APK_NAME" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "name='tv.blofy.player.v2.stream' versionCode='2000117' versionName='2.0.0-rc07.56.0.2-STREAM'" "$RUNNER_TEMP/badging.txt"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/badging.txt"
          "$tools/apksigner" verify --verbose --print-certs "verified/$APK_NAME" > "$RUNNER_TEMP/cert.txt"
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt" | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$actual_cert" = "$CERT"
          "$tools/zipalign" -c -P 16 -v 4 "verified/$APK_NAME" >/dev/null
          unzip -Z1 "verified/$APK_NAME" > "$RUNNER_TEMP/entries.txt"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libffmpegJNI.so" "$RUNNER_TEMP/entries.txt"
          done
      - name: Upload to existing official site via exact-APK OIDC gate
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?OIDC required}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?OIDC required}"
          audience='blofy-stream-56-0-2-owner-signed-website-upload'
          token="$(curl -fsSL --max-time 25 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$audience" | jq -er '.value')"
          test -n "$token"
          target="https://updates.blofyplayer.com/api/internal/releases/upload?filename=$APK_NAME"
          uploaded=0
          for attempt in $(seq 1 16); do
            if curl --fail-with-body --silent --show-error --max-time 420 \
                -H "Authorization: Bearer $token" \
                -H 'Content-Type: application/vnd.android.package-archive' \
                --data-binary "@verified/$APK_NAME" "$target" > "$RUNNER_TEMP/upload.json"; then
              uploaded=1
              break
            fi
            sleep 18
          done
          test "$uploaded" -eq 1
          jq -e --arg name "$APK_NAME" --argjson bytes "$BYTES" '.ok==true and .filename==$name and .size==$bytes' "$RUNNER_TEMP/upload.json"
      - name: Verify public release bytes staged before promoting website updater
        shell: bash
        run: |
          set -euo pipefail
          url="https://updates.blofyplayer.com/files/releases/$APK_NAME"
          verified=0
          for i in $(seq 1 12); do
            headers="$(curl -fsSI --max-time 40 "$url" || true)"
            if printf '%s\n' "$headers" | grep -iq "^content-length: $BYTES"; then
              verified=1
              break
            fi
            sleep 6
          done
          test "$verified" -eq 1
          echo "### Owner signed STREAM 56.0.2 staged successfully on the official download site" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA256: $SHA256 ; size: $BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Public updater and existing 56.0.1 download unchanged until explicit verified promotion." >> "$GITHUB_STEP_SUMMARY"
