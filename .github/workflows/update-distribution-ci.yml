name: Update distribution checks
on:
  push:
    branches: [main]
    paths:
      - 'services/update-distribution/**'
      - '.github/workflows/update-distribution-ci.yml'
  pull_request:
    paths:
      - 'services/update-distribution/**'
      - '.github/workflows/update-distribution-ci.yml'
  workflow_dispatch:
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/update-distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
