name: STREAM live endpoint non-destructive rollout smoke
on:
  push:
    branches: [release/stream-unified-server-20261125]
    paths: ['.github/workflows/stream-unified-live-smoke.yml']
  workflow_dispatch:
    inputs:
      enabled:
        description: Unified feature flag expected enabled
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ENABLED: ${{ github.event_name == 'push' || inputs.enabled }}
    steps:
      - name: Verify public route and gate without touching any subscriber
        shell: bash
        run: |
          set -euo pipefail
          root=https://blofyplayer.com
          curl -fsS --retry 2 --connect-timeout 10 --max-time 25 "$root/health" > "$RUNNER_TEMP/health.json"
          jq -e '.ok==true or .status=="ok" or .status=="healthy"' "$RUNNER_TEMP/health.json"
          # Only deliberately malformed input. Never look up, issue, activate,
          # rotate, or redeem any real code or account.
          expected=503
          if test "$ENABLED" = true; then expected=400; fi
          for attempt in 1 2 3 4 5 6 7 8; do
            status=$(curl -sS --connect-timeout 10 --max-time 25 -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" -w '%{http_code}' -H 'Content-Type: application/json' --data '{"code":"INVALID","deviceKey":"invalid"}' "$root/api/v1/stream/app/unified-redeem" || true)
            if test "$status" = "$expected"; then break; fi
            sleep 15
          done
          test "$status" = "$expected"
          grep -Eiq '^cache-control:.*no-store' "$RUNNER_TEMP/headers"
          grep -Eiq '^referrer-policy:.*no-referrer' "$RUNNER_TEMP/headers"
          if test "$ENABLED" = true; then
            jq -e '.ok==false and .error=="stream_code_invalid"' "$RUNNER_TEMP/body"
            # A fresh 144-bit random BC identifier cannot match a paid voucher.
            # Verify real pairing DB readiness and generic rejection without
            # creating an account or sending any known customer code.
            probe=$(node -e 'process.stdout.write("BC-"+require("crypto").randomBytes(18).toString("base64url"))')
            device=$(openssl rand -hex 32)
            jq -n --arg code "$probe" --arg device "$device" '{code:$code,deviceKey:$device}' > "$RUNNER_TEMP/probe.json"
            status=$(curl -sS --connect-timeout 10 --max-time 25 -o "$RUNNER_TEMP/body" -w '%{http_code}' -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/probe.json" "$root/api/v1/stream/app/unified-redeem")
            test "$status" = 409
            jq -e '.ok==false and .error=="stream_code_unavailable"' "$RUNNER_TEMP/body"
          else
            jq -e '.ok==false and .error=="stream_unified_unavailable"' "$RUNNER_TEMP/body"
          fi
          echo "Live unified route: expected $expected, confirmed. No real customer codes used." >> "$GITHUB_STEP_SUMMARY"
