name: BLOFY rc07.24 Direct Signed Release

on:
  push:
    branches: [rc07-runtime-recovery]
    paths:
      - .github/workflows/rc0724-signed-direct.yml

permissions:
  contents: read

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}

jobs:
  signed-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build verify and sign rc07.24
        run: bash tools/rc0724_signed_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-rc07.24-signed-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

# direct user-triggered production build
