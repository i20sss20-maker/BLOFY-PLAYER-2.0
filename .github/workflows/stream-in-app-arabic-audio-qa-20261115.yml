name: BLOFY STREAM In-App Arabic Audio QA

on:
  push:
    branches:
      - feat/stream-in-app-arabic-audio-20261115
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blofy-stream-in-app-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-stream-local-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Validate in-app Arabic audio, code-only demo and Android 9 parsing
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeDemoUnitTest \
            --tests tv.blofy.player.ui.player.StreamArabicAudioCatalogTest \
            --tests tv.blofy.player.ui.player.StreamInAppAudioImportTest \
            --tests tv.blofy.player.ui.player.ArabicSidecarTimingPolicyTest
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            assembleStreamCodeDemo
      - name: Save QA reports (not a customer release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blofy-stream-in-app-audio-qa-${{ github.sha }}
          path: |
            app/build/test-results/testStreamCodeDemoUnitTest/
            app/build/reports/tests/testStreamCodeDemoUnitTest/
          if-no-files-found: ignore
          retention-days: 7
