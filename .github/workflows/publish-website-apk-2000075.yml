name: Publish BLOFY 2000075 signed website APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-website-apk-2000075.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blofy-website-apk-2000075
  cancel-in-progress: false
jobs:
  website-apk:
    name: Build and publish independently signed website APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      SOURCE_SHA: 674979c4e0e0a2396874d2d4521775cb6563cf3e
      EXPECTED_CERT_SHA256: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
      NDK_VERSION: '28.0.13004108'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate pinned reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fq 'applicationId = "tv.blofy.player.v2"' app/build.gradle.kts
          grep -Fq 'versionCode = 2000075' app/build.gradle.kts
      - name: Install native SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1"
          command -v ninja >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ninja-build; }
      - name: Check original signing certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$RUNNER_TEMP/blofy-upload.keystore"
          actual="$(keytool -exportcert -keystore "$RUNNER_TEMP/blofy-upload.keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
      - name: Build verified FFmpeg decoders
        shell: bash
        env:
          ENABLED_DECODERS: ac3 eac3 dca truehd aac mp3 opus vorbis flac
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          test -s build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar
      - name: Build signed website APK with in-app update installer
        shell: bash
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-upload.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m
        run: |
          set -euo pipefail
          aar="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar"
          gradle --no-daemon --max-workers=2 -PBLOFY_DISTRIBUTION=website -PBLOFY_SECURITY_R8=true -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com -PBLOFY_BUILD_SHA="$SOURCE_SHA" -PBLOFY_FFMPEG_AAR="$aar" lintRelease assembleRelease
      - name: Verify APK identity, permissions, signing, alignment, and packaged codecs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging "$apk" > release/badging.txt
          grep -Fq "package: name='tv.blofy.player.v2' versionCode='2000075' versionName='2.0.0-rc07.55.7-identity-recovery'" release/badging.txt
          "$tools/aapt" dump permissions "$apk" | grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES'
          "$tools/apksigner" verify --print-certs "$apk" > release/signature.txt
          actual="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/native-files.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Eiq "^lib/$abi/lib(ffmpeg|ffmpegJNI).*\.so$" "$RUNNER_TEMP/native-files.txt"
          done
          cp "$apk" release/BLOFY-PLAYER-v2000075-WEBSITE-SIGNED.apk
          (cd release && sha256sum *.apk > SHA256SUMS && sha256sum --check SHA256SUMS)
          printf 'source_sha=%s\npackage=tv.blofy.player.v2\nversionCode=2000075\ndistribution=website\ninternal_updater=true\nplay_build=false\nrelease_signed=true\n' "$SOURCE_SHA" > release/build-info.txt
      - name: Publish signed website APK with stable GitHub release URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: i20sss20-maker/BLOFY-PLAYER-2.0
        run: |
          set -euo pipefail
          tag="blofy-player-v2000075-website"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release under this tag already exists; do not replace published binaries without explicit version change." >&2
            exit 1
          fi
          gh release create "$tag" release/BLOFY-PLAYER-v2000075-WEBSITE-SIGNED.apk release/SHA256SUMS release/build-info.txt --target "$SOURCE_SHA" --title "BLOFY PLAYER 2000075 — Website APK" --notes "Signed website installer (tv.blofy.player.v2, versionCode 2000075) built from reviewed source $SOURCE_SHA. Uses the website in-app updater. Google Play users should update through Google Play. This is not an APK generated from the Play AAB." --latest=false
      - name: Preserve owner QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-WEBSITE-SIGNED-v2000075-${{ github.sha }}
          path: release/
          retention-days: 30
          if-no-files-found: error
