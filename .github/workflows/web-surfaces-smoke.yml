name: BLOFY Web Surfaces Smoke

# Final all-site production gate for BLOFY public/admin web surfaces.

on:
  push:
    branches: [main]
    paths:
      - services/activation/web/**
      - services/activation/src/public-downloads.mjs
      - services/activation/src/admin-console-hook.mjs
      - services/activation/src/server.mjs
      - services/activation/src/sources-admin-hook.mjs
      - services/activation/src/privacy-pages.mjs
      - .github/workflows/web-surfaces-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public BLOFY web surfaces
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/blofy-web"
          mkdir -p "$tmp"

          check_html() {
            url="$1"; marker="$2"; out="$3"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2               --connect-timeout 8 --max-time 30 "$url" > "$out"
            grep -Eiq "$marker" "$out"
          }

          check_html "https://blofyplayer.com/" "BLOFY" "$tmp/root.html"
          check_html "https://blofyplayer.com/connect" "BLOFY" "$tmp/connect.html"
          check_html "https://blofyplayer.com/downloads" "BLOFY|تحميل" "$tmp/downloads.html"
          check_html "https://blofyplayer.com/privacy" "BLOFY|الخصوصية" "$tmp/privacy.html"
          check_html "https://blofyplayer.com/status" "BLOFY|حالة الخدمات" "$tmp/status.html"
          check_html "https://blofyplayer.com/admin" "BLOFY|الإدارة|المشرف" "$tmp/admin.html"
          check_html "https://blofyplayer.com/sources-admin" "BLOFY|المصادر|Xtream" "$tmp/sources-admin.html"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "https://blofyplayer.com/robots.txt" > "$tmp/robots.txt"
          grep -Fq "Sitemap: https://blofyplayer.com/sitemap.xml" "$tmp/robots.txt"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "https://blofyplayer.com/sitemap.xml" > "$tmp/sitemap.xml"
          grep -Fq "<loc>https://blofyplayer.com/privacy</loc>" "$tmp/sitemap.xml"
          grep -Fq "<loc>https://blofyplayer.com/status</loc>" "$tmp/sitemap.xml"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 8 --max-time 30 "https://blofyplayer.com/site-polish.css" > "$tmp/site-polish.css"
          grep -Fq -- "--blofy-accent" "$tmp/site-polish.css"

          check_html "https://updates.blofyplayer.com/" "BLOFY|تحميل" "$tmp/updates.html"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "https://blofyplayer.com/manifest.webmanifest" > "$tmp/manifest.json"
          python3 - "$tmp/manifest.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('name') == 'BLOFY PLAYER'
          assert p.get('start_url') == '/'
          assert p.get('display') == 'standalone'
          PY

          grep -Fq 'rel="canonical" href="https://blofyplayer.com/"' "$tmp/root.html"
          grep -Fq 'rel="canonical" href="https://blofyplayer.com/privacy"' "$tmp/privacy.html"
          grep -Fq 'rel="canonical" href="https://blofyplayer.com/status"' "$tmp/status.html"
          grep -Fq 'rel="canonical" href="https://updates.blofyplayer.com/"' "$tmp/updates.html"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "https://updates.blofyplayer.com/robots.txt" > "$tmp/updates-robots.txt"
          grep -Fq "Sitemap: https://updates.blofyplayer.com/sitemap.xml" "$tmp/updates-robots.txt"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 "https://updates.blofyplayer.com/sitemap.xml" > "$tmp/updates-sitemap.xml"
          grep -Fq "<loc>https://updates.blofyplayer.com/</loc>" "$tmp/updates-sitemap.xml"

          status="$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 -o "$tmp/updates-404.html" -w '%{http_code}' \
            https://updates.blofyplayer.com/__blofy_missing_route__)"
          test "$status" = "404"
          grep -Fq 'BLOFY PLAYER' "$tmp/updates-404.html"
          grep -Fq 'الصفحة غير موجودة' "$tmp/updates-404.html"

          echo "BLOFY web surfaces OK"

      - name: Verify linked static assets
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/blofy-assets"
          mkdir -p "$tmp"
          for path in \
            /site-polish.css \
            /premium.css \
            /control-premium.css \
            /device-admin.css \
            /release-manager.css \
            /experience.js \
            /release-manager.js \
            /privacy-actions.js \
            /sources-admin.css \
            /sources-admin.js \
            /xtream-gateway-admin.js \
            /blofy-logo.png \
            /manifest.webmanifest
          do
            file="$tmp/$(echo "$path" | tr '/.' '__')"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 8 --max-time 30 "https://blofyplayer.com$path" > "$file"
            test -s "$file"
          done

      - name: Verify security headers and branded 404
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/blofy-web-security"
          mkdir -p "$tmp"

          curl --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 -D "$tmp/root.headers" -o /dev/null \
            https://blofyplayer.com/
          grep -Eiq '^strict-transport-security: *max-age=31536000' "$tmp/root.headers"
          grep -Eiq '^permissions-policy:.*camera=\(\).*microphone=\(\).*geolocation=\(\)' "$tmp/root.headers"
          grep -Eiq '^x-frame-options: *DENY' "$tmp/root.headers"

          status="$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 -o "$tmp/404.html" -w '%{http_code}' \
            https://blofyplayer.com/__blofy_missing_route__)"
          test "$status" = "404"
          grep -Fq 'BLOFY PLAYER' "$tmp/404.html"
          grep -Fq 'الصفحة غير موجودة' "$tmp/404.html"

          curl --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 -D "$tmp/updates.headers" -o /dev/null \
            https://updates.blofyplayer.com/
          grep -Eiq '^strict-transport-security: *max-age=31536000' "$tmp/updates.headers"

      - name: Verify stable download and health endpoints
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/blofy-health"
          mkdir -p "$tmp"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 https://api.blofyplayer.com/health > "$tmp/api.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 https://blofyplayer.com/health > "$tmp/root.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 30 https://updates.blofyplayer.com/health > "$tmp/updates.json"

          python3 - "$tmp/api.json" "$tmp/root.json" "$tmp/updates.json" <<'PY'
          import json,sys
          api=json.load(open(sys.argv[1],encoding='utf-8'))
          root=json.load(open(sys.argv[2],encoding='utf-8'))
          updates=json.load(open(sys.argv[3],encoding='utf-8'))
          for p in (api,root,updates):
              assert p.get('ok') is True
          for p in (api,root):
              assert p.get('database') == 'ready'
              assert p.get('playlistEncryption') == 'ready'
          aa=(api.get('release') or {}).get('app') or {}
          ra=(root.get('release') or {}).get('app') or {}
          ua=(updates.get('release') or {}).get('app') or {}
          expected=(ua.get('versionCode'),ua.get('versionName'),ua.get('downloadUrl'))
          assert all(expected)
          assert (aa.get('versionCode'),aa.get('versionName'),aa.get('downloadUrl')) == expected
          assert (ra.get('versionCode'),ra.get('versionName'),ra.get('downloadUrl')) == expected
          print(f"release={ua.get('versionName')} ({ua.get('versionCode')})")
          PY

          for url in \
            https://updates.blofyplayer.com/download/latest.apk \
            https://updates.blofyplayer.com/latest.apk \
            https://updates.blofyplayer.com/apk \
            https://blofyplayer.com/download/latest.apk \
            https://blofyplayer.com/latest.apk \
            https://blofyplayer.com/apk
          do
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 8 --max-time 45 --range 0-0 --output /dev/null "$url"
          done
