name: BLOFY Subscriber Health Probe

on:
  push:
    branches: [tmp/subscriber-health-probe]
    paths:
      - '.github/workflows/subscriber-health-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe subscriber health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io/api/v1/subscribers/health'
          code="$(curl -sS --max-time 20 -o /tmp/subscriber-health.json -w '%{http_code}' "$URL")"
          echo "HTTP $code"
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/subscriber-health.json', encoding='utf-8'))
          safe={k:p.get(k) for k in ('ok','hostConfigured','bootstrapReady','encryptionReady','databaseReady')}
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          assert p.get('ok') is True
          assert p.get('bootstrapReady') is True or p.get('hostConfigured') is True
          assert p.get('encryptionReady') is True
          assert p.get('databaseReady') is True
          PY
          test "$code" = '200'
