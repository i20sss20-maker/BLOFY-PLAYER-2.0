name: BLOFY Railway Domain Verify

on:
  push:
    branches: [main]
    paths:
      - 'ops/railway-domain-verify.run'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect public DNS
        shell: bash
        run: |
          set -u
          for host in api.blofyplayer.com blofyplayer.com updates.blofyplayer.com; do
            echo "=== $host ==="
            getent ahosts "$host" || true
          done

      - name: Verify API custom domain and TLS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://api.blofyplayer.com/health | jq -e '.ok==true and .database=="ready"' >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://api.blofyplayer.com/portal)" = "200"

      - name: Verify root custom domain and TLS
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://blofyplayer.com/health | jq -e '.ok==true and .database=="ready"' >/dev/null

      - name: Verify update custom domain and TLS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://updates.blofyplayer.com/health | jq -e '.ok==true and .release.service=="blofy-update-distribution"' >/dev/null
