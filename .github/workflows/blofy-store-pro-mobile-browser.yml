name: BLOFY STORE PRO mobile Chromium QA

on:
  pull_request:
    paths:
      - 'services/activation/web/store.html'
      - 'services/activation/web/store-*.html'
      - 'services/activation/web/store-*.css'
      - 'services/activation/web/store-*.js'
      - 'services/activation/test/store-mobile-browser.mjs'
      - 'services/activation/test/store-mobile-performance.test.mjs'
      - '.github/workflows/blofy-store-pro-mobile-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/activation/package-lock.json
      - name: Install service dependencies
        working-directory: services/activation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated Playwright browser runner
        working-directory: services/activation
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Verify checkout lazy-load safety contract
        working-directory: services/activation
        run: node --test test/store-mobile-performance.test.mjs test/storefront.test.mjs test/store-pro-mobile-ux.test.mjs
      - name: Render real Chromium mobile-sized storefront pages
        working-directory: services/activation
        run: node test/store-mobile-browser.mjs
      - name: Upload screenshots and performance JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blofy-store-mobile-chromium-audit
          path: services/activation/artifacts/mobile-browser/
          if-no-files-found: ignore
          retention-days: 7
