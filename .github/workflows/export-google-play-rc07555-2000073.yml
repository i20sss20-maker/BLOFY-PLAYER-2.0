name: Export BLOFY rc07.55.5 Google Play AAB 2000073

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-google-play-rc07555-2000073.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified 55.5 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: i20sss20-maker/BLOFY-PLAYER-2.0
          run-id: 36275519562
          name: BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED-a9a11011806b22a21475c45554960de045e5b9a0
          path: signed

      - name: Verify exact AAB identity
        shell: bash
        run: |
          set -euo pipefail
          test -s signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab
          grep -Fxq 'version=2.0.0-rc07.55.5' signed/build-info.txt
          grep -Fxq 'versionCode=2000073' signed/build-info.txt
          grep -Fxq 'commit=a9a11011806b22a21475c45554960de045e5b9a0' signed/build-info.txt
          grep -Fxq 'production_signed=true' signed/build-info.txt
          sha256sum signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab | tee source.sha256

      - name: Upload exact AAB to temporary direct-share endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --retry 3 --retry-all-errors \
            -X PUT \
            -H "Content-Type: application/octet-stream" \
            --data-binary @signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab \
            "https://blofy-aab-share-2000073-v2-production.up.railway.app/upload-55-5-2000073-8d7c6a4f"

      - name: Verify public direct AAB byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            "https://blofy-aab-share-2000073-v2-production.up.railway.app/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED-2000073.aab" \
            -o downloaded.aab
          test -s downloaded.aab
          test "$(sha256sum signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab | awk '{print $1}')" = "$(sha256sum downloaded.aab | awk '{print $1}')"
          echo "DIRECT_AAB_OK"
