name: BLOFY Linode continuity QA
on:
  pull_request:
    paths:
      - 'scripts/qa/linode-continuity-regression.py'
      - '.github/workflows/blofy-linode-continuity-qa.yml'
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install offline media test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Validate synthetic MPEG-TS generation transitions
        run: python3 scripts/qa/linode-continuity-regression.py
