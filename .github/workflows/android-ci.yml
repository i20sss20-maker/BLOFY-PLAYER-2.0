name: BLOFY Android CI

on:
  push:
    branches: [main, rc07-commercial-stability]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact checked-out source
        shell: bash
        run: git archive --format=zip --output=blofy-source.zip HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-source-${{ github.sha }}
          path: blofy-source.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
      - name: Optimize TV home local feed
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/java/tv/blofy/player/ui/home/HomeActivity.kt"
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          old = 'val all = dao.allStreamsForProvider(provider.id).filter { it.kind == "movie" || it.kind == "series" }'
          new = 'val all = dao.latestHomeStreams(provider.id, 320)'
          if old not in s:
              raise SystemExit('HomeActivity bounded-feed target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fq 'val all = dao.latestHomeStreams(provider.id, 320)' "$file"
      - name: Test lint and assemble
        shell: bash
        env:
          BLOFY_TMDB_TOKEN: ${{ secrets.BLOFY_TMDB_TOKEN }}
        run: |
          set -o pipefail
          if [[ -z "${BLOFY_TMDB_TOKEN:-}" ]]; then
            echo "::warning::BLOFY_TMDB_TOKEN is not configured; actor/cinematic metadata will use provider fallback only."
          fi
          gradle --no-daemon \
            -PBLOFY_ACTIVATION_BASE_URL=https://blofy-player-2-0.vercel.app \
            -PBLOFY_TMDB_TOKEN="$BLOFY_TMDB_TOKEN" \
            testDebugUnitTest lintDebug assembleDebug 2>&1 | tee gradle-ci.log
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-gradle-diagnostics-${{ github.sha }}
          path: gradle-ci.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stamp standard build
        shell: bash
        env:
          BLOFY_TMDB_TOKEN: ${{ secrets.BLOFY_TMDB_TOKEN }}
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          {
            echo "variant=standard"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_NUMBER"
            echo "ffmpeg=false"
            echo "activation=https://blofy-player-2-0.vercel.app"
            echo "home_bounded_cache=true"
            if [[ -n "${BLOFY_TMDB_TOKEN:-}" ]]; then echo "tmdb=true"; else echo "tmdb=false"; fi
          } > app/build/outputs/apk/debug/build-info.txt
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-standard-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 30
