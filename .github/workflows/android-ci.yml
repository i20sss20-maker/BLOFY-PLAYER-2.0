name: BLOFY Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
      - name: Test lint and assemble
        shell: bash
        run: |
          set -o pipefail
          # Unit tests start BlofyApp; never let fixtures register on a customer service.
          gradle --no-daemon \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testDebugUnitTest 2>&1 | tee gradle-ci.log
          gradle --no-daemon \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            lintDebug assembleDebug 2>&1 | tee -a gradle-ci.log
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-gradle-diagnostics-${{ github.sha }}
          path: gradle-ci.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stamp standard build
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          {
            echo "variant=standard"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_NUMBER"
            echo "ffmpeg=false"
            echo "activation=https://api.blofyplayer.com"
          } > app/build/outputs/apk/debug/build-info.txt
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-standard-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 30
