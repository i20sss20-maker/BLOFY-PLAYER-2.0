name: BLOFY Android CI

on:
  push:
    branches: [main, rc07-commercial-stability]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact checked-out source
        shell: bash
        run: git archive --format=zip --output=blofy-source.zip HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-source-${{ github.sha }}
          path: blofy-source.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
      - name: Verify bounded Home source is committed
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/java/tv/blofy/player/ui/home/HomeActivity.kt"
          grep -Fq 'HomeSnapshotStore.read(applicationContext, provider.id)' "$file"
          grep -Fq 'dao.latestHomeStreams(provider.id, 320)' "$file"
          if grep -Fq 'dao.allStreamsForProvider(provider.id).filter' "$file"; then
            echo 'Unbounded Home catalog scan returned to source' >&2
            exit 1
          fi
      - name: Verify large catalog sections stay streaming
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/java/tv/blofy/player/data/PlaylistManager.kt"
          grep -Fq 'private suspend fun <T> parseStreamingArray(' "$file"
          grep -Fq 'actionUrl(provider, "get_live_streams")' "$file"
          grep -Fq 'actionUrl(provider, "get_vod_streams")' "$file"
          grep -Fq 'actionUrl(provider, "get_series")' "$file"
          grep -Fq 'DIRECT_STREAM_BATCH' "$file"
          grep -Fq 'dao.insertCatalogBatch(batch, batch.map(::searchRow))' "$file"
          grep -Fq 'suspend fun insertCatalogBatch(' app/src/main/java/tv/blofy/player/data/local/BlofyDao.kt
          if grep -Fq 'api.list(actionUrl(provider, "get_live_streams"))' "$file"; then
            echo 'Live catalog regressed to full in-memory raw JSON buffering' >&2
            exit 1
          fi
          if grep -Fq 'api.list(actionUrl(provider, "get_vod_streams"))' "$file"; then
            echo 'VOD catalog regressed to full in-memory raw JSON buffering' >&2
            exit 1
          fi
          if grep -Fq 'api.list(actionUrl(provider, "get_series"))' "$file"; then
            echo 'Series catalog regressed to full in-memory raw JSON buffering' >&2
            exit 1
          fi
      - name: Verify staged refresh promotes search index in place
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/java/tv/blofy/player/data/local/BlofyDao.kt"
          grep -Fq 'promoteStagedSearchIndexInPlace(stagedProviderId, targetProvider.id)' "$file"
          if sed -n '/suspend fun promoteStagedCatalog/,/^    }/p' "$file" | grep -Fq 'rebuildSearchIndex(targetProvider.id)'; then
            echo 'Large refresh regressed to a full search-index rebuild during promotion' >&2
            exit 1
          fi

      - name: Verify entry gate has no network enrichment
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/java/tv/blofy/player/data/preparation/FullCatalogPreparer.kt"
          grep -Fq 'EntryPreparationPipeline.run(' "$file"
          grep -Fq 'HomeSnapshotStore.rebuild(app, dao, provider)' "$file"
          grep -Fq 'CatalogSyncState.markEntryReady(app, providerId, expectedEpoch)' "$file"
          start=$(grep -n 'EntryPreparationPipeline.run(' "$file" | head -1 | cut -d: -f1)
          end=$(tail -n +"$start" "$file" | grep -n '^                )' | head -1 | cut -d: -f1)
          if [ -n "$start" ] && [ -n "$end" ]; then
            block=$(sed -n "${start},$((start + end - 1))p" "$file")
            if printf '%s\n' "$block" | grep -Eq 'ArtworkLoader\.persist|XtreamClient\.api\.(jsonResponse|list|streamingResponse)'; then
              echo 'Network enrichment returned to the first-entry gate' >&2
              exit 1
            fi
          fi
      - name: Verify deep-clean UI paths stay local-first
        shell: bash
        run: |
          set -euo pipefail
          app="app/src/main/java/tv/blofy/player/BlofyApp.kt"
          live="app/src/main/java/tv/blofy/player/ui/browser/LiveChannelAdapter.kt"
          cloud="app/src/main/java/tv/blofy/player/ui/profile/ProfileCloudLifecycle.kt"

          test ! -f app/src/main/java/tv/blofy/player/ui/login/LoginLocalFastPathLifecycle.kt
          test ! -f app/src/main/java/tv/blofy/player/ui/login/LoginPortalRefreshLifecycle.kt
          ! grep -Fq 'LoginLocalFastPathLifecycle' "$app"
          ! grep -Fq 'LoginPortalRefreshLifecycle' "$app"

          if grep -Eq 'BlofyDatabase|get\(applicationContext\)|syncShortEpg' "$live"; then
            echo 'Live row binding regressed to database/network work' >&2
            exit 1
          fi
          grep -Fq 'is HomeActivity -> activity.lifecycleScope.launch' "$cloud"
          grep -Fq 'delay(HOME_DEFER_MS)' "$cloud"
          grep -Fq 'private const val HOME_DEFER_MS = 10_000L' "$cloud"
          if grep -Fq 'if (activity is HomeActivity' "$cloud"; then
            echo 'Immediate Home profile cloud sync returned' >&2
            exit 1
          fi
      - name: Verify actual catalog queries on 200k rows
        run: python3 tools/check_catalog_queries.py
      - name: Verify Play Xiaomi-design UX / STREAM candidate 2000088 manifest and TV routes
        if: github.head_ref != 'fix/stream-55832-catalog-refresh-stall-20261117' && github.head_ref != 'integration/stream-55832-stable-tv-catalog-20261117' && github.head_ref != 'feature/stream-separate-live-search-windows-20261117' && github.head_ref != 'feature/stream-nextgen-phase1-20261117' && github.head_ref != 'fix/stream-55835-auto-sync-stall90-20261117' && github.head_ref != 'fix/stream-55836-catalog-tv-remote-20261117' && github.head_ref != 'fix/stream-55837-settings-first-login-sync-20261118'
        env:
          BLOFY_EXPECTED_PLAY_VERSION_CODE: "2000088"
        run: python3 tools/verify_play_2000073.py
      - name: Test lint and assemble
        shell: bash
        run: |
          set -o pipefail
          # Unit tests start BlofyApp; never let fixtures register on a customer service.
          gradle --no-daemon \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testDebugUnitTest 2>&1 | tee gradle-ci.log
          gradle --no-daemon \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            lintDebug assembleDebug assembleDebugAndroidTest 2>&1 | tee -a gradle-ci.log
      - name: Verify channel and search are separate windows on STREAM
        if: github.head_ref == 'feature/stream-separate-live-search-windows-20261117' || github.head_ref == 'feature/stream-nextgen-phase1-20261117' || github.head_ref == 'fix/stream-55835-auto-sync-stall90-20261117' || github.head_ref == 'fix/stream-55836-catalog-tv-remote-20261117' || github.head_ref == 'fix/stream-55837-settings-first-login-sync-20261118'
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/java/tv/blofy/player/ui/player/LiveChannelOverlayLifecycle.kt"
          grep -Fq 'private fun openSearchWindow(' "$file"
          grep -Fq 'private var searchDialog: AlertDialog?' "$file"
          grep -Fq 'val searchButton = TextView(activity)' "$file"
          ! grep -Fq 'val searchField = if (BuildConfig.CODE_ONLY_LOGIN)' "$file"

      - name: Test STREAM 55.8.37 code-only catalog persistence regression
        if: github.head_ref == 'fix/stream-55832-catalog-refresh-stall-20261117' || github.head_ref == 'integration/stream-55832-stable-tv-catalog-20261117' || github.head_ref == 'feature/stream-separate-live-search-windows-20261117' || github.head_ref == 'feature/stream-nextgen-phase1-20261117' || github.head_ref == 'fix/stream-55835-auto-sync-stall90-20261117' || github.head_ref == 'fix/stream-55836-catalog-tv-remote-20261117' || github.head_ref == 'fix/stream-55837-settings-first-login-sync-20261118'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeOnlyUnitTest \
            --tests 'tv.blofy.player.data.preparation.CatalogLoadPersistenceTest' \
            --tests 'tv.blofy.player.ui.player.LiveChannelPanelPolicyTest' \
            --tests 'tv.blofy.player.data.CatalogRefreshCommitPolicyTest' \
            --tests 'tv.blofy.player.ui.player.LivePlayerMenuPolicyTest' \
            --tests 'tv.blofy.player.core.remote.FocusCheckpointStoreTest' \
            --tests 'tv.blofy.player.ui.library.DownloadTransferPolicyTest' \
            --tests 'tv.blofy.player.data.CatalogAutoRefreshPolicyTest' \
            --tests 'tv.blofy.player.data.CatalogRefreshCheckpointTest' \
            --tests 'tv.blofy.player.data.CatalogRefreshProgressTest' \
            --tests 'tv.blofy.player.data.CatalogSectionRetryTest'

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-gradle-diagnostics-${{ github.sha }}
          path: |
            gradle-ci.log
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Stamp standard build
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          {
            echo "variant=standard"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_NUMBER"
            echo "ffmpeg=false"
            echo "activation=https://api.blofyplayer.com"
            echo "home_snapshot=true"
            echo "home_bounded_cache=true"
            echo "catalog_streaming=true"
            echo "entry_gate_network_free=true"
            echo "deep_clean_ui=true"
            echo "metadata=provider_only"
          } > app/build/outputs/apk/debug/build-info.txt
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-standard-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 30
      - name: Build Google Play 2000086 debug manifest variant
        if: github.head_ref != 'fix/stream-55832-catalog-refresh-stall-20261117' && github.head_ref != 'integration/stream-55832-stable-tv-catalog-20261117' && github.head_ref != 'feature/stream-separate-live-search-windows-20261117' && github.head_ref != 'feature/stream-nextgen-phase1-20261117' && github.head_ref != 'fix/stream-55835-auto-sync-stall90-20261117' && github.head_ref != 'fix/stream-55836-catalog-tv-remote-20261117' && github.head_ref != 'fix/stream-55837-settings-first-login-sync-20261118'
        shell: bash
        run: |
          set -euxo pipefail
          # Verifies the Play-only manifest, not just the website/default one.
          # Debug uses CI keys; it is NOT installable over the published Play app.
          gradle --no-daemon -PBLOFY_DISTRIBUTION=play \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            lintDebug assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          # Inspect the actual Play-flavored APK manifest after Android manifest merging,
          # not just src/play XML. This must never request sideload-install permission.
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/play-apk-permissions.txt"
          ! grep -Fq android.permission.REQUEST_INSTALL_PACKAGES "$RUNNER_TEMP/play-apk-permissions.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/play-apk-manifest.txt"
          for route in VlcFallbackActivity LibraryDownloadActivity SectionSearchActivity; do
            grep -Fq "$route" "$RUNNER_TEMP/play-apk-manifest.txt"
          done
          cp "$APK" app/build/outputs/apk/debug/blofy-play-2000086-test-only.apk
      - name: Save Google Play 2000086 debug artifact
        if: github.head_ref != 'fix/stream-55832-catalog-refresh-stall-20261117' && github.head_ref != 'integration/stream-55832-stable-tv-catalog-20261117' && github.head_ref != 'feature/stream-separate-live-search-windows-20261117' && github.head_ref != 'feature/stream-nextgen-phase1-20261117' && github.head_ref != 'fix/stream-55835-auto-sync-stall90-20261117' && github.head_ref != 'fix/stream-55836-catalog-tv-remote-20261117' && github.head_ref != 'fix/stream-55837-settings-first-login-sync-20261118'
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAY-2000086-TEST-ONLY-${{ github.sha }}
          path: app/build/outputs/apk/debug/blofy-play-2000086-test-only.apk
          if-no-files-found: error
          retention-days: 14


  owner-signed-stream-qa:
    # Private owner-signed artifact only. Never upload to release, website or customer update feed.
    needs: verify
    if: github.event_name == 'pull_request' && (github.head_ref == 'integration/stream-55832-stable-tv-catalog-20261117' || github.head_ref == 'feature/stream-separate-live-search-windows-20261117' || github.head_ref == 'feature/stream-nextgen-phase1-20261117' || github.head_ref == 'fix/stream-55835-auto-sync-stall90-20261117' || github.head_ref == 'fix/stream-55836-catalog-tv-remote-20261117' || github.head_ref == 'fix/stream-55837-settings-first-login-sync-20261118')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      EXPECTED_CERT: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
      ANDROID_NDK_VERSION: '28.0.13004108'
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android tools and FFmpeg dependencies
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000114' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.8.37"' app/build.gradle.kts
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION" 'cmake;3.22.1'
          if ! command -v ninja >/dev/null; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Build pinned FFmpeg decoders and LGPL compliance material
        shell: bash
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          test -s build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar
          grep -Fxq 'config_gpl=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'config_nonfree=0' build/ffmpeg-native/build-info.txt
          grep -Fxq 'page_size_compatible=16384' build/ffmpeg-native/build-info.txt
      - name: Re-run critical STREAM tests before signing
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 testStreamCodeOnlyUnitTest \
            --tests 'tv.blofy.player.data.CatalogRefreshCommitPolicyTest' \
            --tests 'tv.blofy.player.data.preparation.CatalogLoadPersistenceTest' \
            --tests 'tv.blofy.player.ui.player.LiveChannelPanelPolicyTest' \
            --tests 'tv.blofy.player.ui.player.LivePlayerMenuPolicyTest' \
            --tests 'tv.blofy.player.core.remote.FocusCheckpointStoreTest' \
            --tests 'tv.blofy.player.ui.library.DownloadTransferPolicyTest' \
            --tests 'tv.blofy.player.data.CatalogAutoRefreshPolicyTest' \
            --tests 'tv.blofy.player.data.CatalogRefreshCheckpointTest' \
            --tests 'tv.blofy.player.data.CatalogRefreshProgressTest' \
            --tests 'tv.blofy.player.data.CatalogSectionRetryTest'
      - name: Sign full BLOFY STREAM with original owner certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!required:-}" || { echo "::error::Owner signing secret unavailable: $required"; exit 1; }
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > "$RUNNER_TEMP/blofy-production.b64"
          base64 -d "$RUNNER_TEMP/blofy-production.b64" > "$BLOFY_RELEASE_KEYSTORE_PATH"
          test -s "$BLOFY_RELEASE_KEYSTORE_PATH"
          cert="$(keytool -exportcert -keystore "$BLOFY_RELEASE_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$cert" = "$EXPECTED_CERT" || { echo "::error::Original STREAM owner certificate mismatch"; exit 1; }
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m" \
            -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar" \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            validateReleaseConfiguration assembleStreamCodeOnly
      - name: Verify identity, certificate, signatures, native FFmpeg and SHA256
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/streamCodeOnly/app-streamCodeOnly.apk"
          test -s "$source_apk"
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$tools/aapt" dump badging "$source_apk" > "$RUNNER_TEMP/stream-badging.txt"
          grep -Fq "name='tv.blofy.player.v2.stream' versionCode='2000114' versionName='2.0.0-rc07.55.8.37-STREAM'" "$RUNNER_TEMP/stream-badging.txt"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/stream-badging.txt"
          "$tools/apksigner" verify --verbose --print-certs "$source_apk" > "$RUNNER_TEMP/stream-signatures.txt"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/stream-signatures.txt" | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$cert" = "$EXPECTED_CERT" || { echo "::error::Wrong signed APK certificate"; exit 1; }
          "$tools/zipalign" -c -P 16 -v 4 "$source_apk"
          unzip -Z1 "$source_apk" > "$RUNNER_TEMP/entries.txt"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libffmpegJNI.so" "$RUNNER_TEMP/entries.txt"
          done
          mkdir -p build/owner-signed-qa
          name="BLOFY-STREAM-55.8.37-CATALOG-TV-CONTROLS-FIX-OWNER-SIGNED.apk"
          cp "$source_apk" "build/owner-signed-qa/$name"
          (cd build/owner-signed-qa && sha256sum "$name" > SHA256SUMS && sha256sum -c SHA256SUMS)
          printf 'application_id=tv.blofy.player.v2.stream\nversion_code=2000114\nsource_sha=%s\nchannel=private_owner_qa_no_auto_update\n' "$GITHUB_SHA" > build/owner-signed-qa/IDENTITY.txt
      - name: Upload verified owner-signed APK for manual testing only
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.37-CATALOG-TV-CONTROLS-OWNER-SIGNED-${{ github.sha }}
          path: |
            build/owner-signed-qa/
            build/ffmpeg-native/compliance/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing secrets
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/blofy-production.keystore" "$RUNNER_TEMP/blofy-production.b64"

  qa-stream-stock:
    # The full legacy Player CI keeps running separately; do not treat these
    # STREAM-specific checks as passing all Player UI regression tests.
    if: github.event_name == 'pull_request' && github.head_ref == 'release/stream-55-8-8-signed-inapp-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Test audio and code playback in isolated stock STREAM app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeDemoUnitTest \
              --tests 'tv.blofy.player.core.diagnostics.StreamAudioHealthTest' \
              --tests 'tv.blofy.player.core.identity.StreamCodeClientTest' \
              --tests 'tv.blofy.player.core.playback.PlaybackSessionReleaseTest'
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            assembleStreamCodeDemo
      - name: Confirm stock QA APK identity, no FFmpeg JNI, and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/streamCodeDemo/app-streamCodeDemo.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/stock-badging.txt"
          grep -Fq "name='tv.blofy.player.v2.stream.qa'" "$RUNNER_TEMP/stock-badging.txt"
          grep -Fq "versionName='2.0.0-rc07.55.8.8-STREAM-QA'" "$RUNNER_TEMP/stock-badging.txt"
          if unzip -Z1 "$APK" | grep -Eq '^lib/[^/]+/libffmpegJNI[.]so$'; then
            echo "The non-FFmpeg APK unexpectedly includes FFmpeg JNI." >&2
            exit 1
          fi
          mkdir -p build/qa-stock
          sha256sum "$APK" > build/qa-stock/SHA256SUMS.txt
          printf 'build=stock-55.8.8-qa\\npackage=tv.blofy.player.v2.stream.qa\\ncommit=%s\\n' "$GITHUB_SHA" > build/qa-stock/IDENTITY.txt
      - name: Upload stock QA APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-55.8.8-STOCK-QA-${{ github.sha }}
          path: |
            app/build/outputs/apk/streamCodeDemo/*.apk
            app/build/test-results/testStreamCodeDemoUnitTest/
            build/qa-stock/
          if-no-files-found: warn
          retention-days: 7
