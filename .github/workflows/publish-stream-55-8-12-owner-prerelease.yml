name: Publish BLOFY STREAM 55.8.12 owner-signed pre-release for manual device QA
on:
  push:
    branches:
      - release/stream-55-8-12-updater-device-20261111
    paths:
      - '.github/workflows/publish-stream-55-8-12-owner-prerelease.yml'
permissions:
  contents: write
  actions: read
jobs:
  verified-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '42990945952'
      SOURCE_COMMIT: '6603ead2d770f061bbae271dc979634511382fa7'
      SOURCE_ARTIFACT: 'BLOFY-STREAM-55.8.12-FFMPEG-OWNER-SIGNED-6603ead2d770f061bbae271dc979634511382fa7'
      TAG: 'blofy-stream-55.8.12-owner-qa-20261111'
      APK_NAME: 'BLOFY-STREAM-55.8.12-FFMPEG-OWNER-SIGNED.apk'
      OWNER_CERT: 'C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E'
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived signed build source and CI success
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          test "$actual" = "$SOURCE_COMMIT" || { echo 'Signed source commit mismatch'; exit 1; }
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .conclusion)"
          test "$conclusion" = success || { echo 'Signed build did not pass CI'; exit 1; }
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"$SOURCE_ARTIFACT\" and .expired == false) | .id")"
          test -n "$id" || { echo 'Verified artifact not found'; exit 1; }
      - name: Download original-owner signed APK only from attested build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir signed
          # Composite artifact paths are nested by actions/upload-artifact.
          APK_FILE="$(find signed -type f -name "$APK_NAME" -print -quit)"
          test -n "$APK_FILE" && test -s "$APK_FILE" || {
            echo 'Signed APK missing from CI artifact'; find signed -maxdepth 4 -type f; exit 1;
          }
          SIGNED_DIR="$(dirname "$APK_FILE")"
          echo "SIGNED_DIR=$SIGNED_DIR" >> "$GITHUB_ENV"
          test -s "$SIGNED_DIR/SHA256SUMS"
          test -s "$SIGNED_DIR/BUILD-IDENTITY.txt"
          grep -Fxq "source_commit=$SOURCE_COMMIT" "$SIGNED_DIR/BUILD-IDENTITY.txt"
          grep -Fxq 'app_id=tv.blofy.player.v2.stream' "$SIGNED_DIR/BUILD-IDENTITY.txt"
          grep -Fxq 'version_code=2000089' "$SIGNED_DIR/BUILD-IDENTITY.txt"
          (cd "$SIGNED_DIR" && sha256sum -c SHA256SUMS)
          size="$(stat -c%s "$APK_FILE")"
          test "$size" -gt 10000000
          test "$size" -lt 268435456 || { echo "APK too large for original installed updater: $size"; exit 1; }
          echo "Signed archive size: $size bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm APK identity and original owner signer once more
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$SDK/apksigner" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null || true
          fi
          "$SDK/aapt" dump badging "$SIGNED_DIR/$APK_NAME" > "$RUNNER_TEMP/stream-badging.txt"
          grep -Fq "name='tv.blofy.player.v2.stream' versionCode='2000089' versionName='2.0.0-rc07.55.8.12-STREAM'" "$RUNNER_TEMP/stream-badging.txt"
          grep -Fq "sdkVersion:'23'" "$RUNNER_TEMP/stream-badging.txt"
          "$SDK/apksigner" verify --print-certs "$SIGNED_DIR/$APK_NAME" > "$RUNNER_TEMP/stream-cert.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/stream-cert.txt" | head -1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$OWNER_CERT" || { echo 'APK signing certificate mismatch'; exit 1; }
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -Z1 "$SIGNED_DIR/$APK_NAME" | grep -Fxq "lib/$abi/libffmpegJNI.so"
          done
      - name: Publish owner-only QA pre-release, never the live update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'An owner test pre-release already exists; refusing overwrite.'
            exit 1
          fi
          gh release create "$TAG" "$SIGNED_DIR/$APK_NAME" "$SIGNED_DIR/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --prerelease \
            --title 'BLOFY STREAM 55.8.12 — Owner signed Android device QA' \
            --notes 'BLOFY STREAM 55.8.12 owner-signed test APK: Android TV and remote/D-pad compatibility, phone/tablet UI, early movie and series categories, Arabic subtitle defaults, and resumable secure in-app updates. Same installed STREAM package/certificate as 55.8.11. Full FFmpeg support on ARMv7/ARM64/x86/x86_64. This is a pre-release for device testing; it is not promoted to the live customer update feed and does not change BLOFY PLAYER or Google Play builds.'
          echo 'Owner-signed Android 55.8.12 pre-release published for opt-in device QA only.' >> "$GITHUB_STEP_SUMMARY"
