name: Publish BLOFY rc07.52

on:
  push:
    branches: [release/rc0752-signed-test]
    paths:
      - .github/workflows/publish-rc0752.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: blofy-publish-rc0752
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download verified production-signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          gh run download 35323920146 \
            --repo "$GITHUB_REPOSITORY" \
            --name "BLOFY-PLAYER-2.0-rc07.52-PRODUCTION-SIGNED-4ce77af0780efdeab135359ed62f3fe45de34ecc" \
            --dir publish
          apk="$(find publish -type f -name 'BLOFY-PLAYER-2.0-rc07.52-PRODUCTION-SIGNED.apk' -print -quit)"
          test -s "$apk"
          sha256sum "$apk" | tee publish/RC0752-APK-SHA256.txt

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.0.0-rc07.52"
          APK="$(find publish -type f -name 'BLOFY-PLAYER-2.0-rc07.52-PRODUCTION-SIGNED.apk' -print -quit)"
          NOTES="BLOFY PLAYER RC07.52 — إصلاح فحص التحديث عبر Azure، تحسين ثبات فوكس الريموت داخل شريط المشغل، ومنع شاشة الاستراحة أثناء المشاهدة. لا تغييرات على Media3 أو FFmpeg أو fallback أو محركات التشغيل."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" publish/RC0752-APK-SHA256.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" publish/RC0752-APK-SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "BLOFY PLAYER 2.0.0-rc07.52" \
              --notes "$NOTES"
          fi
