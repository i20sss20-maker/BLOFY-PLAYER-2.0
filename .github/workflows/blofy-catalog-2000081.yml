name: BLOFY 55.8.4 Google Play signed AAB version 2000081
on:
  push:
    branches: [fix/truncated-xtream-catalog-2000081]
    paths:
      - .github/workflows/blofy-catalog-2000081.yml
      - app/**
      - tools/verify_play_2000073.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: blofy-55-8-4-play-2000081-${{ github.ref }}
  cancel-in-progress: false
env:
  EXPECTED_PACKAGE: tv.blofy.player.v2
  EXPECTED_CODE: '2000081'
  EXPECTED_NAME: 2.0.0-rc07.55.8.4
  EXPECTED_CERT: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
  ACTIVATION_URL: https://api.blofyplayer.com
  UPDATE_URL: https://updates.blofyplayer.com
jobs:
  signed-55-8:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Verify 55.8.4 version identity and original upload key availability
        env:
          KEYSTORE_B64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000081' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.8.4"' app/build.gradle.kts
          for var in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!var:-}" ]] || { echo "::error::Missing signing secret $var"; exit 1; }
          done
      - name: Install Android build tools
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Fetch pinned FFmpeg native decoder (no unreviewed libraries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/ffmpeg-native
          gh run download 41481513423 --repo "$GITHUB_REPOSITORY"             --name media3-ffmpeg-1.6.1-aar-214371372b8e82cfa53ebd89e90569c7e5903177             --dir build/ffmpeg-native
          aar="$(find build/ffmpeg-native -name 'media3-decoder-ffmpeg-1.6.1.aar' -type f -print -quit)"
          test -s "$aar"
          sha_file="$(find build/ffmpeg-native -name 'media3-decoder-ffmpeg-1.6.1.aar.sha256' -type f -print -quit)"
          test -s "$sha_file"
          sha="$(awk '{print $1}' "$sha_file" | head -1)"
          test "$(sha256sum "$aar" | awk '{print $1}')" = "$sha"
          cp "$aar" build/ffmpeg-native/blofy-55-8.aar
      - name: Test current app and check lint before touching production artifacts
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2             -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9             -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9             testDebugUnitTest
          gradle --no-daemon --max-workers=2             -PBLOFY_DISTRIBUTION=play             -PBLOFY_ACTIVATION_BASE_URL="$ACTIVATION_URL"             -PBLOFY_UPDATE_BASE_URL="$UPDATE_URL"             -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/blofy-55-8.aar"             lintDebug
      - name: Restore production signing certificate and verify identity
        env:
          KEYSTORE_B64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' > "$RUNNER_TEMP/key.b64"
          pad=$(( $(wc -c < "$RUNNER_TEMP/key.b64") % 4 ))
          if [[ "$pad" -ne 0 ]]; then printf '%*s' $((4-pad)) '' | tr ' ' '=' >> "$RUNNER_TEMP/key.b64"; fi
          base64 --decode "$RUNNER_TEMP/key.b64" > "$RUNNER_TEMP/blofy-production.keystore"
          keytool -list -keystore "$RUNNER_TEMP/blofy-production.keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          actual="$(keytool -exportcert -keystore "$RUNNER_TEMP/blofy-production.keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$actual" = "$EXPECTED_CERT"
          rm -f "$RUNNER_TEMP/key.b64"
      - name: Assemble signed website APK, then signed Google Play AAB
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m
        run: |
          set -euo pipefail
          common=(-PBLOFY_SECURITY_R8=true -PBLOFY_ACTIVATION_BASE_URL="$ACTIVATION_URL"             -PBLOFY_UPDATE_BASE_URL="$UPDATE_URL" -PBLOFY_BUILD_SHA="$GITHUB_SHA"             -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/blofy-55-8.aar")
          gradle --no-daemon --max-workers=2 "${common[@]}" lintRelease assembleRelease
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/BLOFY-PLAYER-55.8.4-2000081-SIGNED.apk
          gradle --no-daemon --max-workers=2 -PBLOFY_DISTRIBUTION=play "${common[@]}" bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab output/BLOFY-PLAYER-55.8.4-2000081-GOOGLE-PLAY.aab
      - name: Verify APK/AAB signatures, version, minSdk, 16K alignment and all native ABIs
        run: |
          set -euo pipefail
          apk=output/BLOFY-PLAYER-55.8.4-2000081-SIGNED.apk
          aab=output/BLOFY-PLAYER-55.8.4-2000081-GOOGLE-PLAY.aab
          test -s "$apk" && test -s "$aab"
          tool="$ANDROID_HOME/build-tools/35.0.0"
          "$tool/aapt" dump badging "$apk" > output/apk-badging.txt
          grep -Fq "package: name='$EXPECTED_PACKAGE' versionCode='$EXPECTED_CODE' versionName='$EXPECTED_NAME'" output/apk-badging.txt
          grep -Fq "sdkVersion:'23'" output/apk-badging.txt
          ! grep -Fq 'application-debuggable' output/apk-badging.txt
          "$tool/zipalign" -c -P 16 -v 4 "$apk" > output/zipalign-check.txt
          "$tool/apksigner" verify --verbose --print-certs "$apk" > output/apk-signature.txt
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' output/apk-signature.txt | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$cert" = "$EXPECTED_CERT"
          jarsigner -verify "$aab" > output/aab-signature.txt
          unzip -Z1 "$apk" > output/apk-file-list.txt
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Eiq "^lib/$abi/lib(ffmpeg|ffmpegJNI).*\.so$" output/apk-file-list.txt
          done
          ! unzip -Z1 "$aab" | grep -q '^base/assets/.*keystore$'
          sha256sum "$apk" "$aab" > output/SHA256SUMS
          {
            echo "VersionName=$EXPECTED_NAME"
            echo "VersionCode=$EXPECTED_CODE"
            echo "Package=$EXPECTED_PACKAGE"
            echo "OriginalSignatureSha256=$EXPECTED_CERT"
            echo "Signed=true"
            echo "GooglePlayUploaded=false"
            echo "WebsitePublished=false"
            echo "Commit=$GITHUB_SHA"
          } > output/BUILD_INFO.txt
      - name: Upload separate installable APK and upload-ready Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-55-8-4-2000081-APK-AAB-OWNER-SIGNED
          path: output/
          retention-days: 30
          if-no-files-found: error
      - name: Signed Google Play upload-ready build (not published)
        run: |
          echo 'Signed APK and AAB uploaded as Actions artifacts; no Play or public auto-update changes.'
