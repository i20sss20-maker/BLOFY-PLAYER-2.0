name: Apply RC07.6 final security patch

on:
  push:
    branches: [rc07-commercial-stability]
    paths: [.github/workflows/apply-rc07-final-security.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc07-commercial-stability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped patch
        run: python3 .github/rc07-final-patch.py
      - name: Commit final rc07.6 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(subscription): keep activation credentials out of status URLs'
          git push origin HEAD:rc07-commercial-stability
