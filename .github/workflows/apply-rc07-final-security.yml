name: Apply RC07.6 final security patch

on:
  push:
    branches: [rc07-commercial-stability]
    paths: [.github/workflows/apply-rc07-final-security.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc07-commercial-stability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped security and test patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Android client: status credentials move from URL query to authenticated JSON body.
          p = Path('app/src/main/java/tv/blofy/player/core/subscription/SubscriptionClient.kt')
          s = p.read_text()
          s = s.replace('import okhttp3.HttpUrl.Companion.toHttpUrl\n', '')
          old = '''    suspend fun status(context: Context, baseUrl: String): Status {
              val url = endpoint(baseUrl, "/api/v1/subscriptions/status").toHttpUrl().newBuilder()
                  .addQueryParameter("deviceId", DeviceIdentity.deviceId(context))
                  .addQueryParameter("activationCode", DeviceIdentity.activationCode(context))
                  .build()
              val request = Request.Builder().url(url).get().build()
              client.newCall(request).awaitResponse().use { response ->
                  check(response.isSuccessful) { "subscription_status_http_${response.code}" }
                  val root = JSONObject(response.body?.string().orEmpty())
                  return Status(
                      active = root.optBoolean("active", false),
                      planKey = root.optString("planKey").takeIf(String::isNotBlank),
                      planName = root.optString("planName").takeIf(String::isNotBlank),
                      maxDevices = if (root.has("maxDevices") && !root.isNull("maxDevices")) root.optInt("maxDevices") else null,
                      startsAt = if (root.has("startsAt") && !root.isNull("startsAt")) root.optLong("startsAt") else null,
                      expiresAt = if (root.has("expiresAt") && !root.isNull("expiresAt")) root.optLong("expiresAt") else null,
                  )
              }
          }
          '''
          new = '''    suspend fun status(context: Context, baseUrl: String): Status {
              // Credentials belong in the encrypted request body, never in a query string that can be logged.
              val root = postAuthenticated(context, endpoint(baseUrl, "/api/v1/subscriptions/status"), JSONObject())
              return Status(
                  active = root.optBoolean("active", false),
                  planKey = root.optString("planKey").takeIf(String::isNotBlank),
                  planName = root.optString("planName").takeIf(String::isNotBlank),
                  maxDevices = if (root.has("maxDevices") && !root.isNull("maxDevices")) root.optInt("maxDevices") else null,
                  startsAt = if (root.has("startsAt") && !root.isNull("startsAt")) root.optLong("startsAt") else null,
                  expiresAt = if (root.has("expiresAt") && !root.isNull("expiresAt")) root.optLong("expiresAt") else null,
              )
          }
          '''
          if old not in s:
              raise SystemExit('SubscriptionClient.status source changed unexpectedly')
          p.write_text(s.replace(old, new))

          # Server: accept POST JSON body for new apps; preserve GET only for installed old builds.
          p = Path('services/activation/src/subscription-hook.mjs')
          s = p.read_text()
          old = '''async function subscriptionStatus(req, res, requestUrl) {
            const deviceId = String(requestUrl.searchParams.get('deviceId') || '').trim();
            const activationCode = String(requestUrl.searchParams.get('activationCode') || '').trim();
          '''
          new = '''async function subscriptionStatus(req, res, requestUrl) {
            // New clients keep device credentials out of URLs and reverse-proxy access logs.
            // GET remains temporarily compatible with already-installed older builds.
            const auth = req.method === 'POST' ? await readJson(req) : requestUrl.searchParams;
            const deviceId = String(req.method === 'POST' ? auth.deviceId : auth.get('deviceId') || '').trim();
            const activationCode = String(req.method === 'POST' ? auth.activationCode : auth.get('activationCode') || '').trim();
          '''
          if old not in s:
              raise SystemExit('subscriptionStatus source changed unexpectedly')
          s = s.replace(old, new)
          old_route = "if (req.method === 'GET' && requestUrl.pathname === `${PREFIX}/status`)"
          new_route = "if ((req.method === 'POST' || req.method === 'GET') && requestUrl.pathname === `${PREFIX}/status`)"
          if old_route not in s:
              raise SystemExit('subscription status route source changed unexpectedly')
          p.write_text(s.replace(old_route, new_route))

          # Install-over version bump only; package and signing identity remain unchanged.
          p = Path('app/build.gradle.kts')
          s = p.read_text().replace('versionCode = 2000013', 'versionCode = 2000014').replace('versionName = "2.0.0-rc07.5"', 'versionName = "2.0.0-rc07.6"')
          p.write_text(s)

          # Signed release naming/validation follows the new installable version.
          p = Path('.github/workflows/rc07-release.yml')
          s = p.read_text().replace('2000013', '2000014').replace('rc07.5', 'rc07.6')
          marker = '''          for hook in subscription-hook payment-checkout-hook payment-return-hook commercial-readiness-hook profile-cloud-hook subscriber-proxy-hook; do
            grep -Fq "./$hook.mjs" "$bootstrap" || { echo "::error::Missing commercial hook $hook"; exit 1; }
          done
          '''
          guard = '''          subscription_client="app/src/main/java/tv/blofy/player/core/subscription/SubscriptionClient.kt"
          subscription_service="services/activation/src/subscription-hook.mjs"
          grep -Fq 'postAuthenticated(context, endpoint(baseUrl, "/api/v1/subscriptions/status"), JSONObject())' "$subscription_client"
          if grep -Fq '.addQueryParameter("activationCode"' "$subscription_client"; then
            echo '::error::Activation code must never be placed in subscription status URLs'
            exit 1
          fi
          grep -Fq "req.method === 'POST' || req.method === 'GET'" "$subscription_service"
          grep -Fq '`${PREFIX}/status`' "$subscription_service"
          '''
          if guard.strip() not in s:
              if marker not in s:
                  raise SystemExit('release commercial hook marker changed unexpectedly')
              s = s.replace(marker, marker + guard)
          p.write_text(s)

          # Standard CI gets the same fail-closed credential transport check.
          p = Path('.github/workflows/android-ci.yml')
          s = p.read_text()
          if 'Verify subscription credentials stay out of URLs' not in s:
              needle = '      - name: Test lint and assemble\n'
              guard = '''      - name: Verify subscription credentials stay out of URLs
                shell: bash
                run: |
                  set -euo pipefail
                  client="app/src/main/java/tv/blofy/player/core/subscription/SubscriptionClient.kt"
                  service="services/activation/src/subscription-hook.mjs"
                  grep -Fq 'postAuthenticated(context, endpoint(baseUrl, "/api/v1/subscriptions/status"), JSONObject())' "$client"
                  if grep -Fq '.addQueryParameter("activationCode"' "$client"; then
                    echo 'Subscription activation code returned to a query URL' >&2
                    exit 1
                  fi
                  grep -Fq "req.method === 'POST' || req.method === 'GET'" "$service"
                  grep -Fq '`${PREFIX}/status`' "$service"
          '''
              if needle not in s:
                  raise SystemExit('android CI insertion point changed unexpectedly')
              s = s.replace(needle, guard + needle)
          p.write_text(s)

          # Real transport regression test across old/current API levels.
          test = Path('app/src/test/java/tv/blofy/player/core/subscription/SubscriptionClientTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package tv.blofy.player.core.subscription

          import android.app.Application
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.runBlocking
          import okhttp3.mockwebserver.MockResponse
          import okhttp3.mockwebserver.MockWebServer
          import org.json.JSONObject
          import org.junit.After
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNull
          import org.junit.Before
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.RuntimeEnvironment
          import org.robolectric.annotation.Config
          import tv.blofy.player.core.identity.DeviceIdentity

          @RunWith(RobolectricTestRunner::class)
          @Config(sdk = [23, 28, 35], application = Application::class)
          class SubscriptionClientTest {
              private lateinit var server: MockWebServer
              private val app get() = RuntimeEnvironment.getApplication<Application>()

              @Before fun setup() { server = MockWebServer().also { it.start() } }
              @After fun cleanup() { server.shutdown() }

              @Test fun subscriptionStatusUsesPostBodyAndNeverLeaksActivationCodeInUrl() = runBlocking(Dispatchers.IO) {
                  server.enqueue(MockResponse().setResponseCode(200).setHeader("content-type", "application/json")
                      .setBody("{\\\"active\\\":false}"))
                  SubscriptionClient.status(app, server.url("/").toString())
                  val request = server.takeRequest()
                  assertEquals("POST", request.method)
                  assertEquals("/api/v1/subscriptions/status", request.requestUrl?.encodedPath)
                  assertNull(request.requestUrl?.query)
                  val body = JSONObject(request.body.readUtf8())
                  assertEquals(DeviceIdentity.deviceId(app), body.getString("deviceId"))
                  assertEquals(DeviceIdentity.activationCode(app), body.getString("activationCode"))
              }
          }
          '''.replace('\n          ', '\n').lstrip())

          # Remove this one-shot workflow from the resulting source tree.
          Path('.github/workflows/apply-rc07-final-security.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(subscription): keep activation credentials out of status URLs'
          git push origin HEAD:rc07-commercial-stability
