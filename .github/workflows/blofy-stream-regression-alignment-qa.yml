name: BLOFY Xtream release-gate regression QA
on:
  push:
    branches:
      - qa/stream-release-regression-alignment-20261123
    paths:
      - 'services/activation/test/xtream-media-range.test.mjs'
      - 'services/activation/test/xtream-media-retry-backoff.test.mjs'
      - 'services/activation/test/xtream-production-reliability.test.mjs'
      - 'services/activation/test/xtream-provider-order.test.mjs'
      - 'services/activation/test/xtream-source-admin-recovery-ui.test.mjs'
      - 'services/activation/test/xtream-sync-cancel-progress.test.mjs'
      - 'services/activation/test/xtream-sync-queue.test.mjs'
      - '.github/workflows/blofy-stream-regression-alignment-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 7 previously failing Xtream behavior tests (synthetic/offline)
        run: |
          node --test \
            services/activation/test/xtream-media-range.test.mjs \
            services/activation/test/xtream-media-retry-backoff.test.mjs \
            services/activation/test/xtream-production-reliability.test.mjs \
            services/activation/test/xtream-provider-order.test.mjs \
            services/activation/test/xtream-source-admin-recovery-ui.test.mjs \
            services/activation/test/xtream-sync-cancel-progress.test.mjs \
            services/activation/test/xtream-sync-queue.test.mjs
      - name: Scope assurance
        if: always()
        run: |
          echo 'Only test expectations are updated. No production code, subscriber records, or media origins are accessed in QA.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A complete production deployment also requires the full activation and device CI workflows to pass.' >> "$GITHUB_STEP_SUMMARY"
