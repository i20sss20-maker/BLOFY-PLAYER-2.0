name: BLOFY STREAM Anis Audio In-App QA

on:
  push:
    branches:
      - feat/stream-anis-audio-inside-app-20261115
      - fix/stream-live-audio-menu-ai-chat-20261115
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-anis-audio-inapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-stream-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Unit tests and installable STREAM demo compilation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeDemoUnitTest \
            --tests tv.blofy.player.ui.player.StreamAnisAudioCatalogTest \
            --tests tv.blofy.player.ui.player.StreamAudioPreferenceStoreTest \
            --tests tv.blofy.player.ui.player.StreamArabicAudioCatalogTest \
            --tests tv.blofy.player.ui.player.ArabicSidecarTimingPolicyTest \
            --tests tv.blofy.player.ui.player.LivePlayerMenuPolicyTest \
            --tests tv.blofy.player.ui.search.AiOfflineIntentPolicyTest \
            --tests tv.blofy.player.ui.search.AiChatRoutingPolicyTest
          # Build the owner-only debug-signed QA install with the real
          # BLOFY activation endpoints. Its .stream.qa package does not
          # replace any customer installation or reuse an existing device code.
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com \
            -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com \
            assembleStreamCodeDemo
      - name: Verify separate QA package and debug signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/streamCodeDemo -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "package: name='tv.blofy.player.v2.stream.qa'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
      - name: Owner-only QA install artifact (debug signed, never customer release)
        uses: actions/upload-artifact@v4
        with:
          name: blofy-stream-live-audio-ai-owner-qa-${{ github.sha }}
          path: app/build/outputs/apk/streamCodeDemo/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Store QA reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-anis-audio-tests-${{ github.sha }}
          path: |
            app/build/test-results/testStreamCodeDemoUnitTest/
            app/build/reports/tests/testStreamCodeDemoUnitTest/
          if-no-files-found: ignore
          retention-days: 7
