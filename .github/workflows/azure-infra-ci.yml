name: BLOFY Azure Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - 'infra/azure/**'
      - 'services/update-distribution/**'
      - '.github/workflows/azure-infra-ci.yml'
      - '.github/workflows/azure-student-images.yml'
  pull_request:
    paths:
      - 'infra/azure/**'
      - 'services/update-distribution/**'
      - '.github/workflows/azure-infra-ci.yml'
      - '.github/workflows/azure-student-images.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bicep syntax
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          for template in infra/azure/main.bicep infra/azure/managed/main.bicep; do
            output="/tmp/$(basename "$(dirname "$template")")-$(basename "$template").json"
            az bicep build --file "$template" --stdout >"$output"
            python3 - "$output" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          assert p.get('$schema')
          assert p.get('resources')
          print(sys.argv[1], 'compiled:', len(p['resources']), 'resources')
          PY
          done

      - name: Validate legacy Docker Compose expansion
        shell: bash
        env:
          AZURE_FQDN: blofy-ci.example.test
          POSTGRES_DB: blofy
          POSTGRES_USER: blofy
          POSTGRES_PASSWORD: ci-only-password
          BLOFY_ADMIN_TOKEN: ci-only-admin-token-long-enough-123456
          BLOFY_PLAYLIST_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BLOFY_TRIAL_DAYS: '7'
        run: |
          set -euo pipefail
          docker compose -f infra/azure/docker-compose.yml config >/tmp/blofy-compose.yml
          grep -Fq 'activation:' /tmp/blofy-compose.yml
          grep -Fq 'postgres:' /tmp/blofy-compose.yml
          grep -Fq 'caddy:' /tmp/blofy-compose.yml

      - name: Validate Caddy configs
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e AZURE_FQDN=blofy-ci.example.test \
            -v "$PWD/infra/azure/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -v "$PWD/infra/azure/Caddyfile.blofy:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -e PORT=8080 \
            -e ACTIVATION_URL=http://blofy-activation \
            -e RELEASE_URL=http://blofy-releases \
            -v "$PWD/infra/azure/managed/gateway/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Check Azure release service
        shell: bash
        run: |
          set -euo pipefail
          cd services/update-distribution
          npm install --ignore-scripts
          npm run check
          docker build -t blofy-release-ci .

      - name: Build managed gateway image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t blofy-gateway-ci infra/azure/managed/gateway

      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n infra/azure/init-env.sh
          sh -n infra/azure/deploy.sh
          bash -n infra/azure/managed/deploy.sh
          bash -n infra/azure/managed/security-audit.sh
          bash -n infra/azure/managed/configure-github-builds.sh
          bash -n infra/azure/managed/verify-deployment.sh

      - name: Check student-subscription OIDC fallback contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'TasksOperationsNotAllowed' infra/azure/managed/deploy.sh
          grep -Fq 'identity federated-credential create' infra/azure/managed/configure-github-builds.sh
          grep -Fq 'AcrPush' infra/azure/managed/configure-github-builds.sh
          grep -Fq 'gh variable set AZURE_CLIENT_ID' infra/azure/managed/configure-github-builds.sh
          grep -Fq 'image-build.trigger' infra/azure/managed/configure-github-builds.sh
          ! grep -Fq 'containerapp github-action add' infra/azure/managed/configure-github-builds.sh
          grep -Fq 'id-token: write' .github/workflows/azure-student-images.yml
          grep -Fq 'azure/login@v2' .github/workflows/azure-student-images.yml
          grep -Fq 'az acr login' .github/workflows/azure-student-images.yml
