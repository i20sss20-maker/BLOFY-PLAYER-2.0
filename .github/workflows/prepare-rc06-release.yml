name: Prepare BLOFY rc06 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-rc06-release.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote metadata from rc05 to rc06
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          old_code = 'versionCode = 2000006'
          old_name = 'versionName = "2.0.0-rc05"'
          if text.count(old_code) != 1 or text.count(old_name) != 1:
              raise SystemExit('Unexpected current version metadata')
          text = text.replace(old_code, 'versionCode = 2000007')
          text = text.replace(old_name, 'versionName = "2.0.0-rc06"')
          gradle.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/rc05-release.yml')
          text = workflow.read_text(encoding='utf-8')
          required = [
              'BLOFY RC05 Signed Release',
              'docs/RC05_RELEASE_READY',
              '2000006',
              '2.0.0-rc05',
              'BLOFY-PLAYER-2.0-rc05',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Missing release token: {token}')
          text = text.replace('RC05', 'RC06')
          text = text.replace('rc05', 'rc06')
          text = text.replace('2000006', '2000007')
          workflow.write_text(text, encoding='utf-8')

          marker = Path('docs/RC06_RELEASE_READY')
          marker.write_text(
              'BLOFY PLAYER 2.0 rc06 signed release gate\n\n'
              '- exact user-approved v339 visual identity retained\n'
              '- verified rc05 playback, cache, activation, FFmpeg and large-playlist fixes retained\n'
              '- repaired player HUD behavior retained\n'
              '- applicationId remains tv.blofy.player.v2\n'
              '- versionCode promoted to 2000007\n'
              '- versionName promoted to 2.0.0-rc06\n'
              '- production signed APK/AAB requested after successful rc05 candidate verification\n',
              encoding='utf-8',
          )
          PY

      - name: Commit rc06 metadata and release gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BLOFY Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/prepare-rc06-release.yml
          git add app/build.gradle.kts .github/workflows/rc05-release.yml docs/RC06_RELEASE_READY
          git diff --cached --check
          git commit -m "Promote verified v339 release to 2.0.0-rc06"
          git push origin HEAD:main
