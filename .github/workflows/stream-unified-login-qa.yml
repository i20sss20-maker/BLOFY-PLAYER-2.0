name: BLOFY STREAM unified login - Android 9 private QA
on:
  push:
    branches:
      - qa/stream-unified-login-20261125
    paths:
      - '.github/workflows/stream-unified-login-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stream-unified-login-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-xtream-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Cache pinned Robolectric Android runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-central-i7-api28-api35-v1-${{ runner.os }}
      - name: Fetch and verify Android runtimes from canonical Maven Central before tests
        shell: bash
        run: |
          set -euo pipefail
          fetch_central() {
            local relative="$1" target="$2" attempt base
            for attempt in 1 2 3 4 5; do
              for base in https://repo.maven.apache.org/maven2 https://repo1.maven.org/maven2; do
                rm -f "$target"
                if curl --fail --silent --show-error --location --connect-timeout 20 --max-time 240 "$base/$relative" -o "$target" && test -s "$target"; then
                  return 0
                fi
              done
              sleep "$((attempt * 15))"
            done
            echo "::error::Maven Central unavailable for $relative"
            return 1
          }
          group=org/robolectric/android-all-instrumented
          for version in 9-robolectric-4913185-2-i7 15-robolectric-12650502-i7; do
            dir="$HOME/.m2/repository/$group/$version"
            mkdir -p "$dir"
            name="android-all-instrumented-$version"
            for ext in jar pom; do
              file="$name.$ext"
              relative="$group/$version/$file"
              fetch_central "$relative.sha1" "$dir/$file.sha1.tmp"
              expected="$(awk '{print tolower($1)}' "$dir/$file.sha1.tmp")"
              [[ "$expected" =~ ^[a-f0-9]{40}$ ]]
              if ! test -s "$dir/$file" || ! printf '%s  %s\n' "$expected" "$dir/$file" | sha1sum -c --status; then
                fetch_central "$relative" "$dir/$file.tmp"
                printf '%s  %s\n' "$expected" "$dir/$file.tmp" | sha1sum -c
                mv "$dir/$file.tmp" "$dir/$file"
              fi
              mv "$dir/$file.sha1.tmp" "$dir/$file.sha1"
            done
            unzip -tq "$dir/$name.jar" >/dev/null
          done
          cat > "$RUNNER_TEMP/robolectric-central.init.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                  systemProperty 'maven.repo.local', new File(System.getProperty('user.home'), '.m2/repository').absolutePath
              }
          }
          GRADLE
      - name: Test native external catalog routing and existing CONNECT playback URL guards
        run: gradle --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/robolectric-central.init.gradle" -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 testStreamCodeDemoUnitTest --tests 'tv.blofy.player.data.remote.ExternalXtreamCatalogTransportTest' --tests 'tv.blofy.player.core.identity.ExternalStreamConnectCatalogTest' --tests 'tv.blofy.player.core.identity.ExternalXtreamMediaRoutesTest' --tests 'tv.blofy.player.core.identity.UnifiedStreamCodeClientTest' --tests 'tv.blofy.player.core.identity.NativeExternalMediaTransportTest' --tests 'tv.blofy.player.data.remote.ExternalArtworkPolicyTest' --tests 'tv.blofy.player.data.PlaylistManagerPersistenceTest.externalCatalogImportsBeyondPrototypeLimitWithoutStoringSourceUrls'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-external-xtream-test-results
          path: app/build/test-results/testStreamCodeDemoUnitTest/
          if-no-files-found: warn
          retention-days: 14
  android9:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Select STREAM code-only instrumentation build only inside QA checkout
        shell: bash
        run: |
          set -euo pipefail
          old='testBuildType = if (securityR8Enabled) "release" else "debug"'
          grep -Fq "$old" app/build.gradle.kts
          sed -i 's/testBuildType = if (securityR8Enabled) "release" else "debug"/testBuildType = "streamCodeDemo"/' app/build.gradle.kts
          grep -Fq 'testBuildType = "streamCodeDemo"' app/build.gradle.kts
      - name: Test original login and encrypted native staging profile on Android 9 API 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 720
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          # One shell line: embedded multi-line YAML actions otherwise pass
          # literal backslashes as Gradle task names ('Task \\ not found').
          script: gradle --no-daemon --max-workers=2 -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 -Pandroid.testInstrumentationRunnerArguments.class=tv.blofy.player.ui.ConnectProfileDeviceTest connectedStreamCodeDemoAndroidTest
      - name: Save API 28 device test XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-unified-login-api28-instrumented-qa
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
