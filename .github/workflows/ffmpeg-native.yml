name: BLOFY FFmpeg Native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ffmpeg-native.yml'

permissions:
  contents: read

jobs:
  build-ffmpeg-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android NDK r26b and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Checkout AndroidX Media3 1.6.1
        run: |
          git clone --depth 1 --branch 1.6.1 https://github.com/androidx/media.git "$RUNNER_TEMP/media3"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$RUNNER_TEMP/media3/local.properties"

      - name: Build FFmpeg static libraries
        run: |
          set -euxo pipefail
          FFMPEG_MODULE_PATH="$RUNNER_TEMP/media3/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          test -d "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd "$FFMPEG_MODULE_PATH/jni"
          git clone --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git ffmpeg
          ./build_ffmpeg.sh \
            "$FFMPEG_MODULE_PATH" \
            "$NDK_PATH" \
            linux-x86_64 \
            23 \
            ac3 eac3 dca truehd vorbis opus flac

      - name: Assemble Media3 FFmpeg AAR
        working-directory: ${{ runner.temp }}/media3
        run: ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease

      - name: Locate and verify FFmpeg AAR
        shell: bash
        run: |
          set -euxo pipefail
          AAR="$(find "$RUNNER_TEMP/media3/libraries/decoder_ffmpeg/build/outputs/aar" -name '*.aar' -type f | head -n 1)"
          test -n "$AAR" && test -f "$AAR"
          unzip -l "$AAR" | grep -q 'libffmpegJNI.so'
          cp "$AAR" "$RUNNER_TEMP/media3-ffmpeg-1.6.1.aar"

      - name: Build BLOFY APK with FFmpeg
        run: |
          gradle --no-daemon \
            -PBLOFY_FFMPEG_AAR="$RUNNER_TEMP/media3-ffmpeg-1.6.1.aar" \
            testDebugUnitTest lintDebug assembleDebug

      - name: Verify FFmpeg is bundled in final APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'libffmpegJNI.so'
          echo "FFmpeg native decoder verified inside BLOFY APK"

      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-ffmpeg-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: media3-ffmpeg-1.6.1-aar
          path: ${{ runner.temp }}/media3-ffmpeg-1.6.1.aar
          if-no-files-found: error
          retention-days: 30
