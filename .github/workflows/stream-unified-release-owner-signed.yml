name: BLOFY STREAM 56.0.12 official-package owner-signed candidate
on:
  push:
    branches: [release/stream-unified-56-0-9-20261125]
    paths: ['.github/workflows/stream-unified-release-owner-signed.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: unified-official-package-owner-signed
  cancel-in-progress: false
jobs:
  actual-native-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a298e264cc7e0d86c9009dea10370fab62fd323c
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Warm the isolated synthetic fixture and select QA instrumented build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 15 --max-time 60 https://blofy-migration-device-preview-test.up.railway.app/health | jq -e '.ok and .synthetic and (.providerRequests==0)'
          grep -Fq 'testBuildType = if (securityR8Enabled) "release" else "debug"' app/build.gradle.kts
          sed -i 's/testBuildType = if (securityR8Enabled) "release" else "debug"/testBuildType = "streamCodeDemo"/' app/build.gradle.kts
      - name: Decode first frame of live TS, HLS, movie and episode on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 720
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: gradle --no-daemon --max-workers=2 -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 -Pandroid.testInstrumentationRunnerArguments.class=tv.blofy.player.ui.DirectXtreamPlaybackDeviceTest connectedStreamCodeDemoAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-native-playback-api28-reports
          path: app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn
  build:
    needs: actual-native-playback
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: a298e264cc7e0d86c9009dea10370fab62fd323c
      ANDROID_NDK_VERSION: '28.0.13004108'
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - name: Require successful previous full QA and production-base server regression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45501166971 > "$RUNNER_TEMP/run.json"
          jq -e '.head_sha=="fdc42a8553aa3e430ab09b327126f12456ff9e85" and .conclusion=="success"' "$RUNNER_TEMP/run.json"
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45507325653 | jq -e '.head_sha=="3bf65673f2c8d78da32cd2846939b5282ab3bb9a" and .conclusion=="success"'
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45501166971/jobs > "$RUNNER_TEMP/jobs.json"
          for name in native-xtream-transport android9; do
            jq -e --arg name "$name" '.jobs | any(.name==$name and .conclusion=="success")' "$RUNNER_TEMP/jobs.json"
          done
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45502821502 | jq -e '.conclusion=="success" and .name=="STREAM synthetic device network QA"'
      - uses: actions/checkout@v4
        with:
          ref: a298e264cc7e0d86c9009dea10370fab62fd323c
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned native toolchain
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION" 'cmake;3.22.1'
          if ! command -v ninja >/dev/null; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Verify updated catalog retry and transport behavior before signing
        run: gradle --no-daemon --max-workers=2 -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 testStreamCodeDemoUnitTest --tests 'tv.blofy.player.data.CatalogSectionRetryTest' --tests 'tv.blofy.player.data.remote.ExternalXtreamCatalogTransportTest' --tests 'tv.blofy.player.core.identity.NativeExternalMediaTransportTest' --tests 'tv.blofy.player.core.identity.ExternalXtreamMediaRoutesTest' --tests 'tv.blofy.player.data.remote.ExternalArtworkPolicyTest' --tests 'tv.blofy.player.data.PlaylistManagerPersistenceTest' --tests 'tv.blofy.player.data.metadata.ProviderDetailsRepositoryTest'
      - name: Build licensed FFmpeg for all four ABIs
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          chmod +x tools/build_media3_ffmpeg.sh
          tools/build_media3_ffmpeg.sh
          test -s build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar
          for flag in config_gpl=0 config_nonfree=0 config_version3=0 page_size_compatible=16384; do
            grep -Fxq "$flag" build/ffmpeg-native/build-info.txt
          done
      - name: Check official STREAM manifest and release feature isolation
        run: |
          set -euo pipefail
          grep -Fq 'buildConfigField("boolean", "UNIFIED_STREAM_RELEASE", unifiedStreamRelease.toString())' app/build.gradle.kts
          grep -Fq 'syntheticLab = packageName == "tv.blofy.player.v2.stream.qa"' app/src/main/java/tv/blofy/player/ui/login/CodeOnlyLoginActivity.kt
          grep -Fq 'FOREGROUND_SERVICE_DATA_SYNC' app/src/streamCodeOnly/AndroidManifest.xml
      - name: Build official STREAM package without signing credentials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          old='create("streamCodeOnly") {\n            initWith(getByName("release"))'
          assert s.count(old)==1
          p.write_text(s.replace(old,old+'\n            signingConfig = null'))
          PY
          gradle --no-daemon --max-workers=2 -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/media3-decoder-ffmpeg-1.6.1.aar" -PBLOFY_ACTIVATION_BASE_URL=https://api.blofyplayer.com -PBLOFY_UPDATE_BASE_URL=https://updates.blofyplayer.com -PBLOFY_UNIFIED_STREAM_RELEASE=true assembleStreamCodeOnly
          mkdir -p build/unsigned-owner-qa
          mapfile -t apks < <(find app/build/outputs/apk/streamCodeOnly -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" = 1
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$tools/aapt" dump badging "${apks[0]}" > "$RUNNER_TEMP/badging"
          grep -Fq "name='tv.blofy.player.v2.stream' versionCode='2000127'" "$RUNNER_TEMP/badging"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/badging"
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" build/unsigned-owner-qa/STREAM-QA-unsigned.apk
          unzip -Z1 build/unsigned-owner-qa/STREAM-QA-unsigned.apk > "$RUNNER_TEMP/entries"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libffmpegJNI.so" "$RUNNER_TEMP/entries"
          done
          (cd build/unsigned-owner-qa && sha256sum STREAM-QA-unsigned.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: private-unsigned-release-payload
          path: build/unsigned-owner-qa/
          if-no-files-found: error
          retention-days: 1
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SOURCE_SHA: a298e264cc7e0d86c9009dea10370fab62fd323c
      EXPECTED_CERT: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: private-unsigned-release-payload
          path: unsigned
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate payload before accessing signing secrets
        run: |
          set -euo pipefail
          (cd unsigned && sha256sum -c SHA256SUMS)
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$tools/apksigner"
          "$tools/aapt" dump badging unsigned/STREAM-QA-unsigned.apk > "$RUNNER_TEMP/badging"
          grep -Fq "name='tv.blofy.player.v2.stream' versionCode='2000127'" "$RUNNER_TEMP/badging"
          ! grep -Fq 'application-debuggable' "$RUNNER_TEMP/badging"
          "$tools/zipalign" -c -P 16 -v 4 unsigned/STREAM-QA-unsigned.apk
      - name: Sign with original BLOFY certificate and verify
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!required:-}" || { echo "::error::Signing secret unavailable: $required"; exit 1; }
          done
          umask 077
          key="$RUNNER_TEMP/owner.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$key"
          cert="$(keytool -exportcert -keystore "$key" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$cert" = "$EXPECTED_CERT"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signed
          name=BLOFY-STREAM-56.0.12-UNIFIED-OWNER-SIGNED.apk
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --out "signed/$name" unsigned/STREAM-QA-unsigned.apk
          "$tools/apksigner" verify --verbose --print-certs "signed/$name" > signed/SIGNATURE.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signed/SIGNATURE.txt | head -n1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT"
          "$tools/zipalign" -c -P 16 -v 4 "signed/$name"
          (cd signed && sha256sum "$name" > SHA256SUMS && sha256sum -c SHA256SUMS)
          printf 'package=tv.blofy.player.v2.stream\nsource_commit=%s\nchannel=owner-signed-release-candidate\nactivation=real unified endpoint only; no synthetic code\nproduction_release=false\n' "$SOURCE_SHA" > signed/BUILD-IDENTITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-56.0.12-UNIFIED-OWNER-SIGNED
          path: signed/
          if-no-files-found: error
          retention-days: 7
      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/owner.keystore"
