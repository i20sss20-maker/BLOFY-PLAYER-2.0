name: BLOFY Azure Final Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-final-acceptance.yml'

permissions:
  contents: read
  id-token: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify public BLOFY Azure flows
        env:
          RG: ${{ vars.BLOFY_AZURE_RG }}
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null
          FQDN="$(az containerapp show --resource-group "$RG" --name blofy-gateway --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$FQDN"
          BASE="https://$FQDN"
          echo "Testing $BASE"

          curl -fsS --max-time 10 "$BASE/health" -o /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json
          grep -Fq '"service":"blofy-gateway"' /tmp/health.json

          curl -fsS --max-time 10 "$BASE/portal" -o /tmp/portal.html
          grep -Fqi 'BLOFY' /tmp/portal.html

          curl -fsS --max-time 10 "$BASE/downloads" -o /tmp/downloads.html
          grep -Fq 'AZURE OFFICIAL DOWNLOAD' /tmp/downloads.html

          curl -fsS --max-time 10 "$BASE/release.json" -o /tmp/release.json
          grep -Fq '"ok":true' /tmp/release.json
          grep -Fq 'blofy-update-distribution' /tmp/release.json

          admin_code="$(curl -sS --max-time 10 -o /tmp/admin.txt -w '%{http_code}' "$BASE/releases-admin")"
          test "$admin_code" = '401'

          activation_code="$(curl -sS --max-time 10 -o /tmp/activation.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"deviceId":"bad","activationCode":"000000"}' \
            "$BASE/api/v1/activation/check")"
          test "$activation_code" = '400'
          grep -Fq 'invalid_device_identity' /tmp/activation.json

          headers="$(curl -sSI --max-time 10 "$BASE/health" | tr -d '\r')"
          grep -Fqi 'strict-transport-security:' <<<"$headers"
          grep -Fqi 'x-content-type-options: nosniff' <<<"$headers"
          grep -Fqi 'x-frame-options: DENY' <<<"$headers"

          echo 'BLOFY Azure final acceptance passed.'
