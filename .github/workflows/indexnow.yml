name: BLOFY Website IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'services/activation/web/**'
      - 'services/activation/src/public-downloads.mjs'
      - 'services/activation/src/privacy-pages.mjs'
      - 'services/activation/src/server.mjs'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blofy-indexnow-notify
  cancel-in-progress: false

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate IndexNow key route
        run: node --test services/activation/test/indexnow-key.test.mjs
      - name: Wait for deployment and notify IndexNow of updated public URLs
        run: node .github/scripts/submit-indexnow.mjs
