name: QA BLOFY STREAM media backpressure and capacity
on:
  push:
    branches: [feat/stream-web-media-buffer-capacity-20261124]
    paths:
      - 'web/stream-native-parity/**'
      - '.github/workflows/qa-blofy-media-backpressure.yml'
  pull_request:
    branches: [release/blofy-stream-web-1-0-0-20261124]
    paths:
      - 'web/stream-native-parity/**'
      - '.github/workflows/qa-blofy-media-backpressure.yml'
permissions:
  contents: read
jobs:
  media-backpressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Verify streamed media response and capacity hints
        run: node --test web/stream-native-parity/qa/media-buffer-capacity.test.mjs
      - name: Real Bun HTTP concurrency smoke with synthetic TS data
        run: bun run web/stream-native-parity/qa/media-bun-stream-smoke.mjs
      - name: Verify media lifecycle including authenticated viewer isolation
        run: node --test web/stream-native-parity/qa/media-lifecycle.test.mjs
      - name: Build production Web and private media worker independently
        run: |
          bun build web/stream-native-parity/server.ts --target=bun --outdir=/tmp/blofy-web-capacity
          bun build web/stream-native-parity/media-worker.ts --target=bun --outdir=/tmp/blofy-media-capacity
      - name: Check legacy-TV playback JavaScript compatibility
        run: node --check web/stream-native-parity/app.js
