name: QA BLOFY STREAM Web Native Parity
on:
  push:
    branches: [feature/blofy-stream-web-native-parity-20261122]
    paths:
      - web/stream-native-parity/**
      - .github/workflows/qa-blofy-stream-web.yml
  pull_request:
    branches: [release/stream-56-0-4-final-20261121]
    paths:
      - web/stream-native-parity/**
      - .github/workflows/qa-blofy-stream-web.yml
  workflow_dispatch:
# Keep only the newest experimental QA run; obsolete push checks previously
# piled up downloading browsers and apt packages while the site was iterating.
concurrency:
  group: blofy-native-web-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web/stream-native-parity && npm install --no-audit --no-fund
      - name: Verify long-running HLS sessions and safe worker idle expiry
        run: cd web/stream-native-parity && node --test qa/media-lifecycle.test.mjs
      - run: cd web/stream-native-parity && npx playwright install --with-deps chromium
      - name: Install full Google Chrome for H.264/AAC codec verification
        run: cd web/stream-native-parity && npx playwright install chrome
      - name: Install FFmpeg only if absent from the runner
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verify H264 preserves real UHD 3840x2160 pixels through HLS packaging
        run: |
          mkdir -p /tmp/blofy-qa-4k
          ffmpeg -hide_banner -loglevel error -nostdin -f lavfi -i color=c=blue:size=3840x2160:rate=2 -t 2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 2 -f hls -hls_time 1 -hls_list_size 0 -hls_segment_filename '/tmp/blofy-qa-4k/seg-%06d.ts' -y /tmp/blofy-qa-4k/index.m3u8
          test -s /tmp/blofy-qa-4k/seg-000000.ts
          measured=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 /tmp/blofy-qa-4k/seg-000000.ts | head -n 1)
          test "$measured" = "3840,2160"
      - name: Verify 11-minute live audio keeps natural commentator pitch
        run: cd web/stream-native-parity && node --test qa/audio-11min.test.mjs
      - name: Make video fixture
        run: ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x180:rate=25 -f lavfi -i sine=frequency=400:sample_rate=44100 -t 4 -c:v libx264 -preset ultrafast -g 25 -keyint_min 25 -sc_threshold 0 -pix_fmt yuv420p -c:a aac -movflags +faststart -y /tmp/blofy-qa-test.mp4
      - name: Generate real browser-decodable HLS fixtures
        run: |
          mkdir -p /tmp/blofy-qa-hls
          ffmpeg -hide_banner -loglevel error -i /tmp/blofy-qa-test.mp4 -c copy -f hls -hls_time 1 -hls_list_size 0 -hls_segment_filename '/tmp/blofy-qa-hls/seg-%06d.ts' -y /tmp/blofy-qa-hls/index.m3u8
          test -s /tmp/blofy-qa-hls/index.m3u8
          test -s /tmp/blofy-qa-hls/seg-000000.ts
      - name: Start isolated local web server
        run: |
          cd web/stream-native-parity
          PORT=3000 VIDAA_SESSION_KEY=$(printf 'a%.0s' {1..64}) VIDAA_COMPAT_KEY=$(printf 'b%.0s' {1..64}) bun run server.ts >/tmp/blofy-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health && break; sleep 1; done
      - name: Test actual mouse and remote screens
        run: cd web/stream-native-parity && npx playwright test qa/ui-parity.spec.mjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-qa-failures
          path: web/stream-native-parity/test-results
          retention-days: 2
