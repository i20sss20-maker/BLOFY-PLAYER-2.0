name: Azure Live Downloads Verify

on:
  push:
    branches:
      - feature/tv-app-library-preview
    paths:
      - '.github/workflows/azure-live-downloads-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify smart catalog and inline details live
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io'

          sleep 20
          curl -fsS --max-time 20 "$BASE/health" -o /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json

          curl -fsS --max-time 20 "$BASE/downloads" -o /tmp/downloads.html
          grep -Fq 'id="app-search"' /tmp/downloads.html
          grep -Fq 'data-filter="store"' /tmp/downloads.html
          grep -Fq 'data-details-toggle' /tmp/downloads.html
          grep -Fq 'class="app-details"' /tmp/downloads.html
          grep -Fq "target.classList.contains('app-more')" /tmp/downloads.html

          slugs="$(grep -o 'data-slug="[^"]*"' /tmp/downloads.html | sed 's/data-slug="//;s/"//' | sort -u)"
          count="$(printf '%s\n' "$slugs" | sed '/^$/d' | wc -l)"
          test "$count" -ge 26

          detail_buttons="$(grep -o '<button class="app-more"' /tmp/downloads.html | wc -l)"
          detail_panels="$(grep -o '<div class="app-details"' /tmp/downloads.html | wc -l)"
          echo "APPS=$count DETAILS_BUTTONS=$detail_buttons DETAILS_PANELS=$detail_panels"
          test "$detail_buttons" = "$count"
          test "$detail_panels" = "$count"

          for name in 'MATVT' 'APKUpdater' 'Mrowser' 'SmartTube'; do
            grep -Fq "$name" /tmp/downloads.html
          done

          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            headers="$(curl -sSI --max-time 20 "$BASE/download/apps/$slug" | tr -d '\r')"
            code="$(printf '%s\n' "$headers" | awk 'NR==1{print $2}')"
            location="$(printf '%s\n' "$headers" | awk 'tolower($1)=="location:"{$1="";sub(/^ /,"");print;exit}')"
            test "$code" = '302'
            case "$location" in *.apk) ;; *) echo "$slug invalid APK redirect: $location" >&2; exit 1;; esac
          done <<< "$slugs"

          admin_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/releases-admin")"
          test "$admin_code" = '401'

          echo "SMART_CATALOG_DETAILS_PASS apps=$count details=$detail_buttons"
