name: Azure Live Downloads Verify

on:
  push:
    branches:
      - feature/tv-app-library-preview
    paths:
      - '.github/workflows/azure-live-downloads-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify 26-app live BLOFY center
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io'

          sleep 20
          curl -fsS --max-time 20 "$BASE/health" -o /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json

          curl -fsS --max-time 20 "$BASE/downloads" -o /tmp/downloads.html
          for name in 'MATVT' 'APKUpdater' 'Mrowser' 'SmartTube'; do
            grep -Fq "$name" /tmp/downloads.html
          done

          slugs="$(grep -o 'data-slug="[^"]*"' /tmp/downloads.html | sed 's/data-slug="//;s/"//' | sort -u)"
          count="$(printf '%s\n' "$slugs" | sed '/^$/d' | wc -l)"
          test "$count" -ge 26

          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            headers="$(curl -sSI --max-time 20 "$BASE/download/apps/$slug" | tr -d '\r')"
            code="$(printf '%s\n' "$headers" | awk 'NR==1{print $2}')"
            location="$(printf '%s\n' "$headers" | awk 'tolower($1)=="location:"{$1="";sub(/^ /,"");print;exit}')"
            test "$code" = '302'
            case "$location" in *.apk) ;; *) echo "$slug invalid APK redirect: $location" >&2; exit 1;; esac
          done <<< "$slugs"

          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/releases-admin")" = '401'
          echo "LIVE_26_APP_CENTER_PASS apps=$count"
