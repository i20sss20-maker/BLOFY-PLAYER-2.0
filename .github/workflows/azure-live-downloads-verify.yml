name: Azure Live Downloads Verify

on:
  push:
    branches:
      - feature/tv-app-library-preview
    paths:
      - '.github/workflows/azure-live-downloads-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify compact live Azure download page
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io'
          curl -fsS --max-time 20 "$BASE/downloads" -o /tmp/downloads.html
          grep -Fq 'class="official-card"' /tmp/downloads.html
          grep -Fq 'تحميل BLOFY APK ↓' /tmp/downloads.html
          grep -Fq 'class="apps-section"' /tmp/downloads.html
          test "$(grep -o 'class="app-row' /tmp/downloads.html | wc -l)" = '9'
          test "$(grep -Fc 'تحميل APK ↓' /tmp/downloads.html)" = '9'
          if grep -Fq 'QUICK INSTALL' /tmp/downloads.html; then exit 11; fi
          if grep -Fq 'نسختك الرسمية' /tmp/downloads.html; then exit 12; fi
          if grep -Fq 'نزّله بالطريقة المناسبة لجهازك' /tmp/downloads.html; then exit 13; fi
          if grep -Fq 'ملاحظات الإصدار' /tmp/downloads.html; then exit 14; fi
          echo 'COMPACT_DOWNLOAD_PAGE=PASS'
