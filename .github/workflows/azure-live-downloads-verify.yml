name: Azure Live Downloads Verify

on:
  push:
    branches:
      - feature/tv-app-library-preview
    paths:
      - '.github/workflows/azure-live-downloads-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Azure download center
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io'
          curl -fsS --max-time 20 "$BASE/downloads" -o /tmp/downloads.html
          grep -Fq 'BLOFY PLAYER' /tmp/downloads.html
          grep -Fq 'تطبيقات مفيدة للشاشات والرسيفرات' /tmp/downloads.html
          for app in VLC Kodi Downloader 'TV Bro' FLauncher; do
            grep -Fq "$app" /tmp/downloads.html
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/download/apps/vlc")"
          test "$code" = '302'
          location="$(curl -sSI --max-time 20 "$BASE/download/apps/vlc" | tr -d '\r' | awk 'tolower($1)=="location:"{$1=""; sub(/^ /,""); print; exit}')"
          test -n "$location"
          admin_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/releases-admin")"
          test "$admin_code" = '401'
          echo "LIVE_DOWNLOADS_VERIFY=PASS"
          echo "APP_REDIRECT=$location"
