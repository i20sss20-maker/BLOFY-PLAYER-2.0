name: Azure Live Downloads Verify

on:
  push:
    branches:
      - feature/tv-app-library-preview
    paths:
      - '.github/workflows/azure-live-downloads-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose upgraded Azure download center
        shell: bash
        run: |
          set -u
          BASE='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io'
          curl -fsS --max-time 20 "$BASE/downloads" -o /tmp/downloads.html || exit 10
          fail=0
          echo "ROWS=$(grep -o 'data-app-row' /tmp/downloads.html | wc -l)"
          echo "SEARCH=$(grep -Fc 'id=\"app-search\"' /tmp/downloads.html)"
          for filter in all media files tools network launcher screensaver; do
            n="$(grep -Fc "data-filter=\"$filter\"" /tmp/downloads.html)"
            echo "FILTER_$filter=$n"
          done
          for name in 'Obtainium' 'App Manager' 'Next Player' 'Fossify File Manager' 'WiFi Analyzer'; do
            n="$(grep -Fc "$name" /tmp/downloads.html)"
            echo "APP_$name=$n"
          done
          echo "UNIVERSAL=$(grep -Fc 'Universal' /tmp/downloads.html)"
          echo "ARM64=$(grep -Fc 'ARM64' /tmp/downloads.html)"
          echo "MB=$(grep -Fc 'MB' /tmp/downloads.html)"
          echo "SCRIPT=$(grep -Fc 'applyFilters()' /tmp/downloads.html)"
          exit "$fail"
