name: Azure Live Downloads Verify

on:
  push:
    branches:
      - feature/tv-app-library-preview
    paths:
      - '.github/workflows/azure-live-downloads-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose live Azure direct APK list
        shell: bash
        run: |
          set -u
          BASE='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io'
          curl -fsS --max-time 20 "$BASE/downloads" -o /tmp/downloads.html || exit 10
          echo "ROWS=$(grep -o 'class="app-row' /tmp/downloads.html | wc -l)"
          echo "HAS_LIST=$(grep -Fc 'class="app-list"' /tmp/downloads.html)"
          echo "HAS_DIRECT_TEXT=$(grep -Fc 'تحميل APK ↓' /tmp/downloads.html)"
          echo "HAS_RAW_ICONS=$(grep -Fc 'raw.githubusercontent.com' /tmp/downloads.html)"
          fail=0
          for slug in vlc kodi just-player nova-player tv-bro amaze jellyfin-tv ltv-launcher aerial-views; do
            headers="$(curl -sSI --max-time 20 "$BASE/download/apps/$slug" | tr -d '\r')"
            code="$(printf '%s\n' "$headers" | awk 'NR==1{print $2}')"
            location="$(printf '%s\n' "$headers" | awk 'tolower($1)=="location:"{$1=""; sub(/^ /,""); print; exit}')"
            echo "$slug CODE=$code LOCATION=$location"
            if [ "$code" != '302' ]; then fail=1; fi
            case "$location" in *.apk) ;; *) fail=1;; esac
          done
          for icon in             'https://cdn.simpleicons.org/vlcmediaplayer'             'https://cdn.simpleicons.org/kodi'             'https://raw.githubusercontent.com/moneytoo/Player/master/fastlane/metadata/android/en-US/images/icon.png'             'https://raw.githubusercontent.com/truefedex/tv-bro/master/app/src/main/res/drawable-xhdpi/ic_launcher.png'; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$icon")"
            echo "ICON $code $icon"
            if [ "$code" != '200' ]; then fail=1; fi
          done
          exit "$fail"
