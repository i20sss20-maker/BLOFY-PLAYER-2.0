name: Azure Live Downloads Verify

on:
  push:
    branches:
      - feature/tv-app-library-preview
    paths:
      - '.github/workflows/azure-live-downloads-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live search markup
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io'
          curl -fsS --max-time 20 "$BASE/downloads" -o /tmp/downloads.html
          grep -o '.\{0,120\}app-search.\{0,180\}' /tmp/downloads.html | head -5 || true
          echo "APP_SEARCH_TEXT=$(grep -Fc 'app-search' /tmp/downloads.html)"
          echo "SEARCH_BOX=$(grep -Fc 'search-box' /tmp/downloads.html)"
          echo "INPUT_SEARCH=$(grep -Fc 'type="search"' /tmp/downloads.html)"
          echo "ROWS=$(grep -o 'data-app-row' /tmp/downloads.html | wc -l)"
