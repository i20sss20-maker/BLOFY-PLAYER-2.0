name: Azure Live Downloads Verify

on:
  push:
    branches:
      - feature/tv-app-library-preview
    paths:
      - '.github/workflows/azure-live-downloads-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify architecture variants live
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io'

          curl -fsS --max-time 20 "$BASE/health" -o /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json

          curl -fsS --max-time 20 "$BASE/downloads" -o /tmp/downloads.html
          grep -Fq 'class="variant-link"' /tmp/downloads.html
          grep -Fq 'ARMv7 · 32-bit' /tmp/downloads.html
          grep -Fq 'Universal' /tmp/downloads.html

          for path in             /download/apps/vlc/arm64             /download/apps/vlc/armv7             /download/apps/kodi/arm64             /download/apps/kodi/armv7             /download/apps/localsend/arm64             /download/apps/localsend/armv7             /download/apps/mpv-android/universal             /download/apps/mpv-android/arm64             /download/apps/mpv-android/armv7             /download/apps/rustdesk/universal             /download/apps/rustdesk/arm64             /download/apps/rustdesk/armv7             /download/apps/smarttube/universal             /download/apps/smarttube/arm64             /download/apps/smarttube/armv7
          do
            headers="$(curl -sSI --max-time 20 "$BASE$path" | tr -d '\r')"
            code="$(printf '%s\n' "$headers" | awk 'NR==1{print $2}')"
            location="$(printf '%s\n' "$headers" | awk 'tolower($1)=="location:"{$1="";sub(/^ /,"");print;exit}')"
            test "$code" = '302'
            case "$location" in *.apk) ;; *) echo "$path invalid redirect: $location" >&2; exit 1;; esac
          done

          slugs="$(grep -o 'data-slug="[^"]*"' /tmp/downloads.html | sed 's/data-slug="//;s/"//' | sort -u)"
          count="$(printf '%s\n' "$slugs" | sed '/^$/d' | wc -l)"
          test "$count" -ge 26

          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/releases-admin")" = '401'
          echo "ARCH_VARIANTS_LIVE_PASS apps=$count"
