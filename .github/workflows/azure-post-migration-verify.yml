name: BLOFY Azure Post Migration Verify (Manual Only)

# Legacy Azure workflow retained for reference/manual recovery only.
# Railway is the active BLOFY production platform; this workflow never runs automatically.

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: blofy-post-migration-verify
  cancel-in-progress: false

env:
  AZURE_RG: ${{ vars.BLOFY_AZURE_RG }}
  VERCEL_SOURCE_URL: https://blofy-player-2-0.vercel.app
  EXPORT_CONFIG: ops/blofy-migration-export-window.json

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure gateway
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null
          FQDN="$(az containerapp show -g "$AZURE_RG" -n blofy-gateway --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$FQDN"
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral read-only verification keys
        id: crypto
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE="$RUNNER_TEMP/blofy-verify-private.pem"
          PUBLIC="$RUNNER_TEMP/blofy-verify-public.pem"
          TOKEN_FILE="$RUNNER_TEMP/blofy-verify-token"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$PRIVATE"
          openssl pkey -in "$PRIVATE" -pubout -out "$PUBLIC"
          openssl rand -hex 32 > "$TOKEN_FILE"
          FP="$(openssl pkey -pubin -in "$PUBLIC" -outform DER | sha256sum | awk '{print $1}')"
          EXPIRES_MS="$(( ($(date +%s) + 1200) * 1000 ))"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "expires_ms=$EXPIRES_MS" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(cat "$TOKEN_FILE")"
          echo "::add-mask::$(base64 -w0 "$PRIVATE")"

      - name: Open encrypted source verification window
        env:
          GH_TOKEN: ${{ github.token }}
          EXPIRES_MS: ${{ steps.crypto.outputs.expires_ms }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC="$RUNNER_TEMP/blofy-verify-public.pem"
          TMP="$RUNNER_TEMP/blofy-verify-window.json"
          python3 - "$PUBLIC" "$EXPIRES_MS" "$TMP" <<'PY'
          import json,sys
          public_path,expires,out=sys.argv[1:]
          with open(public_path,encoding='utf-8') as handle:
              public_key=handle.read()
          with open(out,'w',encoding='utf-8') as handle:
              json.dump({'publicKeyPem':public_key,'expiresAt':int(expires)},handle,separators=(',',':'))
              handle.write('\n')
          PY
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$EXPORT_CONFIG?ref=main" --jq .sha)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$EXPORT_CONFIG" \
            -f message='ops(migration): open encrypted post-migration verification window' \
            -f content="$(base64 -w0 "$TMP")" -f sha="$SHA" -f branch=main >/dev/null

      - name: Wait for Vercel source exporter
        env:
          FP: ${{ steps.crypto.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 60); do
            STATUS="$(curl -fsS --max-time 12 "$VERCEL_SOURCE_URL/api/v1/internal/migration-export/status" 2>/dev/null || true)"
            if jq -e --arg fp "$FP" '.enabled==true and .fingerprint==$fp and .protocol=="blofy-migration-v1" and .source=="github-main-runtime-window"' <<<"$STATUS" >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo 'Vercel verification exporter window was not observed.' >&2
          exit 1

      - name: Enable temporary Azure validation endpoint
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_B64="$(base64 -w0 "$RUNNER_TEMP/blofy-verify-private.pem")"
          TOKEN="$(cat "$RUNNER_TEMP/blofy-verify-token")"
          az containerapp secret set -g "$AZURE_RG" -n blofy-activation --secrets \
            "migration-private-key=$PRIVATE_B64" "migration-import-token=$TOKEN" >/dev/null
          az containerapp update -g "$AZURE_RG" -n blofy-activation --set-env-vars \
            'BLOFY_MIGRATION_PRIVATE_KEY_B64=secretref:migration-private-key' \
            'BLOFY_MIGRATION_IMPORT_TOKEN=secretref:migration-import-token' \
            'BLOFY_MIGRATION_EXPECTED_SOURCE_DATABASE=neondb' >/dev/null
          URL='${{ steps.azure.outputs.url }}'
          for n in $(seq 1 60); do
            if curl -fsS --max-time 10 "$URL/api/v1/internal/migration-import/status" | jq -e '.available==true' >/dev/null; then exit 0; fi
            sleep 5
          done
          echo 'Azure validation endpoint did not become active.' >&2
          exit 1

      - name: Fetch encrypted source snapshot for comparison only
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/blofy-verify-envelope.json"
          curl -fsS --max-time 180 -X POST "$VERCEL_SOURCE_URL/api/v1/internal/migration-export" -o "$BUNDLE"
          jq -e '.protocol=="blofy-migration-envelope-v1" and (.data|type=="string") and (.data|length>0)' "$BUNDLE" >/dev/null

      - name: Prove Azure rows schema and production data key match source
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.azure.outputs.url }}'
          TOKEN="$(cat "$RUNNER_TEMP/blofy-verify-token")"
          OUT="$RUNNER_TEMP/blofy-post-migration-validation.json"
          curl -fsS --max-time 180 -X POST "$URL/api/v1/internal/migration-import/validate" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/blofy-verify-envelope.json" -o "$OUT"
          jq '{mode,source,sourceCounts,targetCountsBefore,keyCompatible,keyMigrationMode,schemaCompatible,schemaIssues}' "$OUT"
          jq -e '.mode=="validated" and .source.database=="neondb" and .schemaCompatible==true and
            .schemaIssues==[] and .keyCompatible==true and .sourceCounts==.targetCountsBefore' "$OUT" >/dev/null
          echo 'POST_MIGRATION_DATABASE_MATCH=YES'
          echo 'POST_MIGRATION_KEY_COMPATIBLE=YES'

      - name: Verify Azure public services
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.azure.outputs.url }}'
          curl -fsS --max-time 20 "$URL/health" | jq -e '.ok==true' >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL/admin")" = '200'
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL/portal")" = '200'
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL/release.json")" = '200'

      - name: Destroy temporary Azure validation credentials
        if: always()
        shell: bash
        run: |
          set +e
          az containerapp update -g "$AZURE_RG" -n blofy-activation --remove-env-vars \
            BLOFY_MIGRATION_PRIVATE_KEY_B64 BLOFY_MIGRATION_IMPORT_TOKEN BLOFY_MIGRATION_EXPECTED_SOURCE_DATABASE >/dev/null 2>&1
          JUNK1="$(openssl rand -base64 48 | tr -d '\n')"
          JUNK2="$(openssl rand -hex 32)"
          az containerapp secret set -g "$AZURE_RG" -n blofy-activation --secrets \
            "migration-private-key=$JUNK1" "migration-import-token=$JUNK2" >/dev/null 2>&1
          az containerapp secret remove -g "$AZURE_RG" -n blofy-activation --secret-names \
            migration-private-key migration-import-token >/dev/null 2>&1

      - name: Close encrypted source verification window
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          TMP="$RUNNER_TEMP/blofy-verify-disabled.json"
          printf '{"publicKeyPem":"","expiresAt":0}\n' > "$TMP"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$EXPORT_CONFIG?ref=main" --jq .sha 2>/dev/null)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$EXPORT_CONFIG" \
              -f message='ops(migration): close encrypted post-migration verification window' \
              -f content="$(base64 -w0 "$TMP")" -f sha="$SHA" -f branch=main >/dev/null 2>&1
          fi
          shred -u "$RUNNER_TEMP/blofy-verify-private.pem" "$RUNNER_TEMP/blofy-verify-public.pem" \
            "$RUNNER_TEMP/blofy-verify-token" "$RUNNER_TEMP/blofy-verify-envelope.json" 2>/dev/null || true
