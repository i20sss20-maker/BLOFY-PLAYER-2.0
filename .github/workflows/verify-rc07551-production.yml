name: Verify rc07.55.1 Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-rc07551-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPDATE_BASE: https://updates.blofyplayer.com
      ACTIVATION_BASE: https://api.blofyplayer.com
      RELEASE_APK: https://github.com/i20sss20-maker/BLOFY-PLAYER-2.0/releases/download/v2.0.0-rc07.55.1/BLOFY-PLAYER-2.0-rc07.55.1-PRODUCTION-SIGNED.apk
    steps:
      - name: Verify activation service
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 8 --max-time 30 "$ACTIVATION_BASE/health" -o activation.json
          jq -e '.ok == true and .database == "ready" and .playlistEncryption == "ready"' activation.json >/dev/null

      - name: Verify active update release is 55.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 8 --max-time 30 "$UPDATE_BASE/health" -o update.json
          jq -e '.ok == true and .release.app.versionCode == 2000069 and .release.app.versionName == "2.0.0-rc07.55.1"' update.json >/dev/null

      - name: Verify latest APK bytes match published 55.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 180             "$UPDATE_BASE/download/latest.apk" -o latest.apk
          curl --fail --silent --show-error --location --retry 3 --max-time 180             "$RELEASE_APK" -o release.apk
          test -s latest.apk
          test -s release.apk
          test "$(sha256sum latest.apk | awk '{print $1}')" = "$(sha256sum release.apk | awk '{print $1}')"

      - name: Verify public download page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 8 --max-time 30 "$UPDATE_BASE/downloads" -o downloads.html
          grep -Fq '2.0.0-rc07.55.1' downloads.html
