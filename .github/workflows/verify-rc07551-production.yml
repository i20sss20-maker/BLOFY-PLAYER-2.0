name: Verify rc07.55.2 Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-rc07551-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPDATE_BASE: https://updates.blofyplayer.com
      ACTIVATION_BASE: https://api.blofyplayer.com
            EXPECTED_APK_SHA256: 82303a50a531e884b952676b54ac40adebc6b71629d0f0563d39942fda5cc0da
    steps:
      - name: Verify activation service
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 8 --max-time 30 "$ACTIVATION_BASE/health" -o activation.json
          jq -e '.ok == true and .database == "ready" and .playlistEncryption == "ready"' activation.json >/dev/null

      - name: Verify active update release is 55.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 8 --max-time 30 "$UPDATE_BASE/health" -o update.json
          jq -e '.ok == true and .release.app.versionCode == 2000070 and .release.app.versionName == "2.0.0-rc07.55.2"' update.json >/dev/null

      - name: Verify latest APK bytes match signed 55.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            "$UPDATE_BASE/download/latest.apk" -o latest.apk
          test -s latest.apk
          test "$(sha256sum latest.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"

      - name: Verify public download page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 8 --max-time 30 "$UPDATE_BASE/downloads" -o downloads.html
          grep -Fq '2.0.0-rc07.55.2' downloads.html
