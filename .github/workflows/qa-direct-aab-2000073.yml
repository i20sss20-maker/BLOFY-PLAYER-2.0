name: BLOFY QA Direct AAB 2000073

on:
  push:
    branches: [qa/rc0755-5-safe-polish-20260926]
    paths:
      - .github/workflows/qa-direct-aab-2000073.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-direct-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified 55.5 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: i20sss20-maker/BLOFY-PLAYER-2.0
          run-id: 36275519562
          name: BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED-a9a11011806b22a21475c45554960de045e5b9a0
          path: signed

      - name: Verify exact Google Play bundle identity
        shell: bash
        run: |
          set -euo pipefail
          test -s signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab
          grep -Fxq 'version=2.0.0-rc07.55.5' signed/build-info.txt
          grep -Fxq 'versionCode=2000073' signed/build-info.txt
          grep -Fxq 'commit=a9a11011806b22a21475c45554960de045e5b9a0' signed/build-info.txt
          grep -Fxq 'production_signed=true' signed/build-info.txt
          sha256sum signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab

      - name: Publish direct Google Play AAB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="google-play-rc07.55.5-2000073"
          aab="signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$aab#BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED-2000073.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --target a9a11011806b22a21475c45554960de045e5b9a0 \
            --title "BLOFY PLAYER rc07.55.5 — Google Play AAB 2000073" \
            --notes "Exact production-signed rc07.55.5 build from run 36275519562, versionCode 2000073. Prepared for Google Play closed testing." \
            --prerelease
