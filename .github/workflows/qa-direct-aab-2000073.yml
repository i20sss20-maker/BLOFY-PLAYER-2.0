name: BLOFY QA Direct AAB 2000073

on:
  push:
    branches: [qa/rc0755-5-safe-polish-20260926]
    paths:
      - .github/workflows/qa-direct-aab-2000073.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  publish-direct-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified 55.5 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: i20sss20-maker/BLOFY-PLAYER-2.0
          run-id: 36275519562
          name: BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED-a9a11011806b22a21475c45554960de045e5b9a0
          path: signed

      - name: Verify exact Google Play bundle identity
        shell: bash
        run: |
          set -euo pipefail
          test -s signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab
          grep -Fxq 'version=2.0.0-rc07.55.5' signed/build-info.txt
          grep -Fxq 'versionCode=2000073' signed/build-info.txt
          grep -Fxq 'commit=a9a11011806b22a21475c45554960de045e5b9a0' signed/build-info.txt
          grep -Fxq 'production_signed=true' signed/build-info.txt
          sha256sum signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab

      - name: Upload exact AAB to temporary share
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 \
            -X PUT \
            --upload-file signed/BLOFY-PLAYER-2.0-rc07.55.5-PRODUCTION-SIGNED.aab \
            https://blofy-aab-2000073-share-production.up.railway.app/upload-55-5-2000073-once
