name: STREAM 56.0.3 authenticated live recovery QA
on:
  push:
    branches: [fix/stream-56-0-3-code-session-recovery-20261129]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Verify code playback recovery and regressions
        run: |
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeOnlyUnitTest \
            --tests 'tv.blofy.player.core.playback.PlaybackSessionReleaseTest' \
            --tests 'tv.blofy.player.core.playback.LiveCleanEndRecoveryPolicyTest' \
            --tests 'tv.blofy.player.core.playback.PlaybackRecoveryPolicyTest'
      - name: Compile isolated STREAM demo APK without release or publication
        run: |
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            assembleStreamCodeDemo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stream-56-0-3-code-recovery-test-reports
          path: app/build/test-results/testStreamCodeOnlyUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 7
