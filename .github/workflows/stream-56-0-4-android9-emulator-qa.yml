name: BLOFY STREAM 56.0.4 Android 9 real emulator instrumentation QA
on:
  push:
    branches: [release/stream-56-0-4-final-20261121]
    paths: ['.github/workflows/stream-56-0-4-android9-emulator-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android9:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test downloads, artwork and activation recovery on Android 9 API 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 720
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          # One shell line: embedded multi-line YAML actions otherwise pass
          # literal backslashes as Gradle task names ('Task \\ not found').
          script: gradle --no-daemon --max-workers=2 -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 -Pandroid.testInstrumentationRunnerArguments.class=tv.blofy.player.ui.LibraryDownloadDeviceTest,tv.blofy.player.ui.ArtworkFavoritesDeviceTest,tv.blofy.player.ui.CatalogRecoveryDeviceTest connectedStreamCodeDemoAndroidTest
      - name: Save API 28 device test XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-56-0-4-api28-instrumented-qa
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
