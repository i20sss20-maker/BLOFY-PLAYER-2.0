name: BLOFY Android TV private test APK

on:
  push:
    branches:
      - audit/play-2000073-stable-hotfix-20261024
    paths:
      - 'app/**'
      - '.github/workflows/tv-test-apk.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: blofy-tv-test-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/audit/play-2000073-stable-hotfix-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install required Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Test and build separate-install Android TV package
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --max-workers=2 -PBLOFY_DISTRIBUTION=play -PBLOFY_TEST_SIDELOAD=true \
            -PBLOFY_ACTIVATION_BASE_URL=https://blofy-player-2-0.vercel.app \
            -PBLOFY_UPDATE_BASE_URL=https://blofy-player-2-0.vercel.app \
            testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK identity, signing and checksum
        shell: bash
        run: |
          set -euxo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/badging.txt"
          grep -Fq "name='tv.blofy.player.v2.testing'" "$RUNNER_TEMP/badging.txt"
          "$tools/aapt" dump permissions "$apk" > "$RUNNER_TEMP/permissions.txt"
          ! grep -Fq "REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/permissions.txt"
          cp "$apk" BLOFY-PLAYER-Android-TV-TEST.apk
          sha256sum BLOFY-PLAYER-Android-TV-TEST.apk > BLOFY-PLAYER-Android-TV-TEST.apk.sha256
      - name: Save exact downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-Android-TV-TEST-${{ github.sha }}
          path: |
            BLOFY-PLAYER-Android-TV-TEST.apk
            BLOFY-PLAYER-Android-TV-TEST.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub pre-release (never update stable)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tv-test-2000073-20261024"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A test release with this fixed tag already exists. Refusing to overwrite."
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Android TV 2000073 FULL TEST build. Not a Google Play update.
          Installs beside the original app as tv.blofy.player.v2.testing; no uninstall required.
          Uses an isolated debug signing certificate and may require a fresh device activation.
          Silent catalog refresh, section checkpoints, video-first performance fixes.
          Trial download only; do not redistribute as a production release.
          NOTES
          gh release create "$tag" \
            BLOFY-PLAYER-Android-TV-TEST.apk \
            BLOFY-PLAYER-Android-TV-TEST.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "BLOFY PLAYER Android TV 2000073 — testing only" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"
