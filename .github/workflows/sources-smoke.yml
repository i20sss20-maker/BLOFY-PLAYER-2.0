name: BLOFY Sources Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sources-smoke.yml'
      - 'services/activation/src/sources-admin-hook.mjs'
      - 'services/activation/src/sources-curated-catalog.mjs'
      - 'services/activation/src/xtream-core.mjs'
      - 'services/activation/src/xtream-admin-hook.mjs'
      - 'services/activation/src/xtream-gateway-core.mjs'
      - 'services/activation/src/xtream-gateway-hook.mjs'
      - 'services/activation/web/sources-admin.html'
      - 'services/activation/web/sources-admin.css'
      - 'services/activation/web/sources-admin.js'
      - 'services/activation/web/xtream-gateway-admin.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://blofyplayer.com
    steps:
      - name: Wait for BLOFY Sources deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS --max-time 12 "$BASE/sources/health" -o /tmp/health.json; then
              break
            fi
            sleep 10
          done
          test -s /tmp/health.json
          cat /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(x.ok!==true||x.total<8||x.enabled<8) process.exit(1)"

      - name: Verify CNCVerse repository manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$BASE/sources/repo.json" -o /tmp/repo.json
          cat /tmp/repo.json
          node - <<'NODE'
          const x=require('/tmp/repo.json');
          if(x.name!=='BLOFY Sources') throw new Error('wrong repo name');
          if(x.manifestVersion!==1) throw new Error('wrong manifest version');
          if(!Array.isArray(x.pluginLists)||x.pluginLists.length!==1) throw new Error('missing plugin list');
          if(x.pluginLists[0]!==process.env.BASE+'/sources/plugins.json') throw new Error('wrong public plugin URL: '+x.pluginLists[0]);
          NODE

      - name: Verify published providers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$BASE/sources/plugins.json" -o /tmp/plugins.json
          node - <<'NODE'
          const x=require('/tmp/plugins.json');
          if(!Array.isArray(x)||x.length<8) throw new Error('expected at least 8 providers');
          for(const name of [
            'InternetArchiveProvider','TwitchProvider','DailymotionProvider','YoutubeProvider',
            'InvidiousProvider','LibriVoxAudiobook','BilibiliProvider','M3UPlaylistPlayerProvider'
          ]) {
            const p=x.find(v=>v.internalName===name);
            if(!p) throw new Error('missing '+name);
            if(!/^https:\/\//.test(p.url)||!Number.isInteger(p.version)||!Number.isInteger(p.status)) throw new Error('invalid '+name);
          }
          console.log('providers:',x.map(v=>v.internalName).join(', '));
          NODE

      - name: Verify Xtream public catalog surface
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$BASE/sources/xtream/summary" -o /tmp/xtream.json
          cat /tmp/xtream.json
          node - <<'NODE'
          const x=require('/tmp/xtream.json');
          if(x.ok!==true) throw new Error('Xtream summary not ready');
          if(x.playbackProxy!==false) throw new Error('unexpected public catalog proxy state');
          if(!Array.isArray(x.servers)) throw new Error('Xtream server summary invalid');
          const serialized=JSON.stringify(x).toLowerCase();
          if(serialized.includes('password')||serialized.includes('username_secret')||serialized.includes('password_secret')) {
            throw new Error('Xtream public summary leaked credentials');
          }
          console.log('Xtream public summary verified; published servers:', x.servers.length);
          NODE

      - name: Verify private Xtream gateway surface
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$BASE/xtream/health" -o /tmp/gateway.json
          cat /tmp/gateway.json
          node - <<'NODE'
          const x=require('/tmp/gateway.json');
          if(x.ok!==true) throw new Error('gateway not ready');
          if(x.compatible!=='Xtream Codes API') throw new Error('wrong gateway compatibility marker');
          if(x.playbackProxy!==true) throw new Error('gateway playback relay not active');
          if(!x.catalog || !Number.isInteger(x.catalog.live) || !Number.isInteger(x.catalog.movie) || !Number.isInteger(x.catalog.series)) {
            throw new Error('gateway catalog health invalid');
          }
          const serialized=JSON.stringify(x).toLowerCase();
          if(serialized.includes('password')||serialized.includes('username_secret')||serialized.includes('password_secret')) {
            throw new Error('gateway health leaked credentials');
          }
          NODE
          code=$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' --max-time 15 "$BASE/player_api.php?username=invalid&password=invalid-pass")
          test "$code" = "200"
          node -e "const x=require('/tmp/unauthorized.json'); if(x?.user_info?.auth!==0) process.exit(1)"

      - name: Verify Sources admin page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$BASE/sources-admin" -o /tmp/panel.html
          grep -Eq 'المصادر و Xtream|لوحة المصادر' /tmp/panel.html
          grep -Eq 'سيرفرك الخاص|إضافة مصدر Xtream' /tmp/panel.html
          grep -q 'الكتالوج' /tmp/panel.html
          grep -q 'بيانات السيرفر التي ستستخدمها في التطبيقات' /tmp/panel.html
          curl -fsS --max-time 15 "$BASE/sources-admin.js" -o /dev/null
          curl -fsS --max-time 15 "$BASE/xtream-gateway-admin.js" -o /dev/null
          curl -fsS --max-time 15 "$BASE/sources-admin.css" -o /dev/null
          echo 'BLOFY Sources + Xtream gateway production surface verified'
