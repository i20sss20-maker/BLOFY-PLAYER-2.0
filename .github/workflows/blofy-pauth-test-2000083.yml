name: BLOFY 55.8.7 P-AUTH signed test APK
on:
  push:
    branches: [fix/p-auth-activation-recovery-20261107]
    paths:
      - 'app/**'
      - '.github/workflows/blofy-pauth-test-2000084.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: blofy-pauth-2000084-test
  cancel-in-progress: false
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    environment: production
    env:
      ACTIVATION_URL: https://api.blofyplayer.com
      UPDATE_URL: https://updates.blofyplayer.com
      EXPECTED_CERT: C3B98CCCD2F0C86809014ACD9368BF61C7004CFD419CD867B71FEF10BFA6255E
      EXPECTED_CODE: '2000084'
      EXPECTED_NAME: 2.0.0-rc07.55.8.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Verify dedicated non-public test build
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 2000084' app/build.gradle.kts
          grep -Fq 'versionName = "2.0.0-rc07.55.8.7"' app/build.gradle.kts
          grep -Fq 'migrateStableIdentityIfNeeded(api, current)' app/src/main/java/tv/blofy/player/core/identity/ActivationManager.kt
          grep -Fq 'Identity migration deferred' app/src/main/java/tv/blofy/player/core/identity/ActivationManager.kt
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Fetch verified existing FFmpeg decoder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/ffmpeg-native
          gh run download 41481513423 --repo "$GITHUB_REPOSITORY" --name media3-ffmpeg-1.6.1-aar-214371372b8e82cfa53ebd89e90569c7e5903177 --dir build/ffmpeg-native
          aar="$(find build/ffmpeg-native -type f -name 'media3-decoder-ffmpeg-1.6.1.aar' -print -quit)"
          sum="$(find build/ffmpeg-native -type f -name 'media3-decoder-ffmpeg-1.6.1.aar.sha256' -print -quit)"
          test -s "$aar" && test -s "$sum"
          test "$(sha256sum "$aar" | awk '{print $1}')" = "$(awk '{print $1}' "$sum" | head -1)"
          cp "$aar" build/ffmpeg-native/blofy-55-8.aar
      - name: Run activation and identity unit regression tests
        run: |
          gradle --no-daemon --max-workers=2 -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 testDebugUnitTest --tests '*Activation*'
      - name: Restore original production signing identity
        env:
          KEYSTORE_B64: ${{ secrets.BLOFY_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS; do
            test -n "${!key:-}" || { echo "::error::Missing signing input $key"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' > "$RUNNER_TEMP/key.b64"
          base64 --decode "$RUNNER_TEMP/key.b64" > "$RUNNER_TEMP/blofy-production.keystore"
          keytool -list -keystore "$RUNNER_TEMP/blofy-production.keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          cert="$(keytool -exportcert -keystore "$RUNNER_TEMP/blofy-production.keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test "$cert" = "$EXPECTED_CERT"
          rm -f "$RUNNER_TEMP/key.b64"
      - name: Compile original-key signed test APK without publishing
        env:
          BLOFY_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/blofy-production.keystore
          BLOFY_RELEASE_STORE_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEYSTORE_PASSWORD }}
          BLOFY_RELEASE_KEY_ALIAS: ${{ secrets.BLOFY_ANDROID_KEY_ALIAS }}
          BLOFY_RELEASE_KEY_PASSWORD: ${{ secrets.BLOFY_ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_SECURITY_R8=true \
            -PBLOFY_ACTIVATION_BASE_URL="$ACTIVATION_URL" \
            -PBLOFY_UPDATE_BASE_URL="$UPDATE_URL" \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            -PBLOFY_FFMPEG_AAR="$GITHUB_WORKSPACE/build/ffmpeg-native/blofy-55-8.aar" \
            assembleRelease
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/BLOFY-PLAYER-55.8.7-2000084-P-AUTH-TEST-SIGNED.apk
      - name: Verify package and original certificate
        run: |
          set -euo pipefail
          apk=output/BLOFY-PLAYER-55.8.7-2000084-P-AUTH-TEST-SIGNED.apk
          tool="$ANDROID_HOME/build-tools/35.0.0"
          "$tool/aapt" dump badging "$apk" > output/badging.txt
          grep -Fq "package: name='tv.blofy.player.v2' versionCode='2000084' versionName='2.0.0-rc07.55.8.7'" output/badging.txt
          ! grep -Fq 'application-debuggable' output/badging.txt
          "$tool/apksigner" verify --verbose --print-certs "$apk" > output/signature.txt
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' output/signature.txt | head -1 | tr -d '[:space:]-:' | tr '[:lower:]' '[:upper:]')"
          test "$cert" = "$EXPECTED_CERT"
          "$tool/zipalign" -c -P 16 -v 4 "$apk" > output/zipalign.txt
          sha256sum "$apk" > output/SHA256SUMS
          printf 'TEST ONLY - Not published to updates or Play\nCommit=%s\n' "$GITHUB_SHA" > output/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-55.8.7-2000084-P-AUTH-TEST-SIGNED
          path: output/
          retention-days: 30
          if-no-files-found: error
