name: Verify public BLOFY STREAM 56.0.1 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-blofy-stream-56-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check precise live STREAM version, site card, signed APK, and isolated PLAYER updater
        shell: bash
        run: |
          set -euo pipefail
          root=https://updates.blofyplayer.com
          apk='BLOFY-STREAM-56.0.1-LIVE-RECONNECT-FIX-OWNER-SIGNED.apk'
          want='02d40e3748f0d75905f734ad429ef16994d87a7068280e567d8da9339932e89a'
          for attempt in $(seq 1 24); do
            curl -fsSL --max-time 25 "$root/stream/release.json" -o stream.json
            if jq -e --arg sha "$want" '.release.app.versionCode==2000116 and .release.app.versionName=="2.0.0-rc07.56.0.1-STREAM" and .release.app.packageName=="tv.blofy.player.v2.stream" and .release.app.sha256==$sha and .release.app.apkSizeBytes==135785176 and .release.app.downloadUrl=="https://updates.blofyplayer.com/d/blofy-stream"' stream.json >/dev/null; then
              break
            fi
            sleep 5
          done
          jq -e --arg sha "$want" '.release.app.versionCode==2000116 and .release.app.versionName=="2.0.0-rc07.56.0.1-STREAM" and .release.app.sha256==$sha' stream.json
          curl -fsSL --max-time 20 "$root/downloads" -o downloads.html
          grep -Fq 'id="blofy-stream"' downloads.html
          grep -Fq '56.0.1' downloads.html
          grep -Fq 'href="/d/blofy-stream"' downloads.html
          curl -fsSI --max-time 70 "$root/d/blofy-stream" -o app.headers
          grep -iq '^content-type: application/vnd.android.package-archive' app.headers
          grep -iq '^content-length: 135785176' app.headers
          curl -fsSI --max-time 70 "$root/files/releases/$apk" -o file.headers
          grep -iq '^content-length: 135785176' file.headers
          curl -fsSL --max-time 20 "$root/release.json" -o player.json
          jq -e '.release.app.packageName != "tv.blofy.player.v2.stream" and .release.app.downloadUrl!="https://updates.blofyplayer.com/d/blofy-stream"' player.json
          echo 'STREAM_5601_PUBLIC_SITE=PASS'
          echo 'STREAM_5601_SIGNED_APK=PASS'
          echo 'STREAM_5601_IN_APP_UPDATE=PASS'
          echo 'BLOFY_PLAYER_UNCHANGED=PASS'
