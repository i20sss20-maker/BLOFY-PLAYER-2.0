name: BLOFY Azure Admin Login Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-admin-login-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose public admin login path
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://blofy-gateway.mangotree-58d162b9.uaenorth.azurecontainerapps.io'
          STATUS="$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -X POST "$BASE/api/v1/admin/session/login" \
            -H 'content-type: application/json' \
            -H "origin: $BASE" \
            --data '{"username":"admin","password":"definitely-wrong-diagnostic-password"}')"
          echo "status=$STATUS"
          cat /tmp/body.json
          echo
          case "$STATUS" in
            401) echo 'Origin/routing passed; credentials reached login validation.' ;;
            403) echo 'Origin validation rejected the public gateway request.' ;;
            404) echo 'Admin login route did not reach activation service.' ;;
            *) echo 'Unexpected status.' ;;
          esac
