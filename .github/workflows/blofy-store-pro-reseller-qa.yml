name: BLOFY STORE PRO reseller portal QA

on:
  pull_request:
    paths:
      - 'services/activation/src/store-reseller-portal.mjs'
      - 'services/activation/src/server.mjs'
      - 'services/activation/web/store-reseller.*'
      - 'services/activation/web/store-inventory.html'
      - 'services/activation/test/store-reseller-portal.test.mjs'
      - '.github/workflows/blofy-store-pro-reseller-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reseller-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/activation/package-lock.json
      - name: Install dependencies
        working-directory: services/activation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        working-directory: services/activation
        run: |
          node --check src/store-reseller-portal.mjs
          node --check web/store-reseller.js
          node --check src/server.mjs
      - name: Scoped reseller regression checks
        working-directory: services/activation
        run: |
          node --test test/store-reseller-portal.test.mjs test/stream-distributors.test.mjs test/store-pro-growth.test.mjs test/store-pro-mobile-ux.test.mjs
