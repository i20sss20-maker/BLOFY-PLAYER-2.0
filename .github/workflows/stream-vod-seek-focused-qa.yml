name: BLOFY STREAM focused VOD seek/recovery and demo compile QA
on:
  push:
    branches: [qa/stream-vod-seek-abort-storm-20261123]
    paths:
      - 'app/src/main/java/tv/blofy/player/ui/player/PlayerActivity.kt'
      - 'app/src/main/java/tv/blofy/player/ui/player/VodSeekBurstPolicy.kt'
      - 'app/src/main/java/tv/blofy/player/core/playback/BlofyPlaybackSession.kt'
      - 'app/src/test/java/tv/blofy/player/ui/player/VodSeekBurstPolicyTest.kt'
      - 'app/src/test/java/tv/blofy/player/core/playback/PlaybackSessionReleaseTest.kt'
      - '.github/workflows/stream-vod-seek-focused-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-vod-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Run source-specific VOD and player lifecycle tests
        run: |
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            testStreamCodeOnlyUnitTest \
            --tests 'tv.blofy.player.ui.player.VodSeekBurstPolicyTest' \
            --tests 'tv.blofy.player.core.playback.PlaybackSessionReleaseTest' \
            --tests 'tv.blofy.player.ui.player.PlayerLifecycleTest'
      - name: Assemble STREAM demo variant without production signing
        run: |
          gradle --no-daemon --max-workers=2 \
            -PBLOFY_ACTIVATION_BASE_URL=http://127.0.0.1:9 \
            -PBLOFY_UPDATE_BASE_URL=http://127.0.0.1:9 \
            assembleStreamCodeDemo
          apk="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "name='tv.blofy.player.v2.stream.qa' versionCode='2000119'"
      - name: Upload isolated QA APK for Android 9 and TV testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-STREAM-56.0.4-VOD-SEEK-SIDE-BY-SIDE-QA
          path: app/build/outputs/apk/streamCodeDemo/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Test reports (no paid user credentials or APK publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-vod-seek-targeted-qa-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
