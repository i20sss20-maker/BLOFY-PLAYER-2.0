name: BLOFY FFmpeg Alpha

on:
  workflow_dispatch:
    inputs:
      activation_base_url:
        description: 'Activation base URL (HTTPS production endpoint, optional for local QA)'
        required: false
        default: ''
        type: string
      build_label:
        description: 'Artifact label'
        required: false
        default: 'alpha-ffmpeg'
        type: string

jobs:
  build-ffmpeg-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDIA3_VERSION: '1.6.1'
      FFMPEG_BRANCH: 'release/6.0'
      NDK_VERSION: '26.1.10909125'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install native Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Checkout matching Media3 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${MEDIA3_VERSION}" https://github.com/androidx/media.git "$RUNNER_TEMP/media3"

      - name: Build FFmpeg native libraries
        shell: bash
        run: |
          set -euxo pipefail
          MEDIA3="$RUNNER_TEMP/media3"
          MODULE="$MEDIA3/libraries/decoder_ffmpeg/src/main"
          JNI="$MODULE/jni"
          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          cd "$JNI"
          git clone --depth 1 --branch "${FFMPEG_BRANCH}" https://git.ffmpeg.org/ffmpeg.git ffmpeg
          ./build_ffmpeg.sh \
            "$MODULE" \
            "$NDK" \
            linux-x86_64 \
            23 \
            aac ac3 eac3 mp3 truehd dca vorbis opus flac

      - name: Assemble Media3 FFmpeg extension AAR
        shell: bash
        run: |
          set -euxo pipefail
          MEDIA3="$RUNNER_TEMP/media3"
          cd "$MEDIA3"
          ./gradlew --no-daemon lib-decoder-ffmpeg:assembleRelease
          AAR="$(find libraries/decoder_ffmpeg/build/outputs/aar -type f -name '*release*.aar' | head -n 1)"
          test -s "$AAR"
          mkdir -p "$RUNNER_TEMP/blofy-ffmpeg"
          cp "$AAR" "$RUNNER_TEMP/blofy-ffmpeg/media3-decoder-ffmpeg-${MEDIA3_VERSION}.aar"

      - name: Validate activation endpoint when configured
        if: ${{ inputs.activation_base_url != '' }}
        shell: bash
        env:
          ACTIVATION_URL: ${{ inputs.activation_base_url }}
        run: |
          set -euo pipefail
          [[ "$ACTIVATION_URL" =~ ^https:// ]] || { echo 'Activation URL must use HTTPS'; exit 1; }
          curl --fail --silent --show-error --max-time 15 "${ACTIVATION_URL%/}/health" > /tmp/blofy-health.json
          grep -q '"ok":true' /tmp/blofy-health.json
          grep -q '"database":"ready"' /tmp/blofy-health.json

      - name: Build BLOFY Alpha with FFmpeg
        shell: bash
        env:
          ACTIVATION_URL: ${{ inputs.activation_base_url }}
        run: |
          set -euxo pipefail
          AAR="$RUNNER_TEMP/blofy-ffmpeg/media3-decoder-ffmpeg-${MEDIA3_VERSION}.aar"
          gradle --no-daemon \
            -PBLOFY_FFMPEG_AAR="$AAR" \
            -PBLOFY_ACTIVATION_BASE_URL="$ACTIVATION_URL" \
            -PBLOFY_BUILD_SHA="$GITHUB_SHA" \
            testDebugUnitTest lintDebug assembleDebug

      - name: Verify and stamp FFmpeg Alpha
        shell: bash
        env:
          BUILD_LABEL: ${{ inputs.build_label }}
        run: |
          set -euxo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          OUT="app/build/outputs/apk/debug/BLOFY-PLAYER-2.0-${BUILD_LABEL}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          {
            echo "label=$BUILD_LABEL"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_NUMBER"
            echo "media3=$MEDIA3_VERSION"
            echo "ffmpeg_branch=$FFMPEG_BRANCH"
            echo "ffmpeg=true"
          } > app/build/outputs/apk/debug/ffmpeg-build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-2.0-${{ inputs.build_label }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/BLOFY-PLAYER-2.0-${{ inputs.build_label }}.apk
            app/build/outputs/apk/debug/BLOFY-PLAYER-2.0-${{ inputs.build_label }}.apk.sha256
            app/build/outputs/apk/debug/ffmpeg-build-info.txt
            ${{ runner.temp }}/blofy-ffmpeg/media3-decoder-ffmpeg-1.6.1.aar
          if-no-files-found: error
          retention-days: 30
